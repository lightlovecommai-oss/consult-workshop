<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>og-image 產生器（1200×630 截圖用）</title>
<!-- 重出方式：/Users/ivor/comconvertai/shot.sh og-image.html og-image4.png 1200 630
     ⚠️ LINE/FB 有 og 快取——改版後 PNG 要換新檔名，並同步改各頁 og:image / twitter:image
     ⚠️ logo 一律用描邊版 logo-mark.svg（真相＝productkit/2-行銷素材/logo-影響力健身房-主標.svg），
        橘色 app icon（icon3）只當手機圖示，不進門面圖（2026-09-06 老師裁決） -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:#F7F1EC; font-family:-apple-system,"PingFang TC",sans-serif; }
  .bar { position:absolute; left:0; width:1200px; height:14px; background:#C6603A; }
  .bar.top { top:0; } .bar.bot { bottom:0; }
  .col { position:absolute; inset:14px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; }
  .logo { width:160px; height:113px; }
  h1 { font-family:"Songti TC","Noto Serif TC",Georgia,serif; font-size:60px; font-weight:900; color:#5C3222; letter-spacing:.06em; margin-top:14px; }
  .en { font-size:22px; font-weight:700; letter-spacing:.34em; color:#8a6a58; margin:8px 0 30px; padding-left:.34em; }
  .tag { font-family:"Songti TC","Noto Serif TC",Georgia,serif; font-size:44px; font-weight:900; color:#4A1B0C; letter-spacing:.04em; }
  .sub { font-size:23px; color:#6E4A3C; letter-spacing:.12em; margin-top:22px; }
  .pill { margin-top:52px; background:linear-gradient(135deg,#C6603A 0%,#AF5433 100%); color:#fff; font-size:24px; font-weight:800; letter-spacing:.08em; padding:14px 44px; border-radius:999px; }
</style>
</head>
<body>
<div class="bar top"></div>
<div class="col">
  <img class="logo" src="logo-mark.svg" alt="">
  <h1>影響力健身房</h1>
  <div class="en">ATPIFit</div>
  <div class="tag">影響力是肌肉，只會越練越強。</div>
  <div class="sub">4 大肌肉 ・ 12 小肌群 ・ 可量測、可練、練了會變現</div>
  <div class="pill">atpifit.com</div>
</div>
<div class="bar bot"></div>
</body>
</html>
