<style>
/* 等待畫面＝品牌精神露出的時刻（2026-09-04 老師拍板）：呼吸燈 logo＋慢速輪替 slogan，乾淨優雅 */
@keyframes ldBreath{0%,100%{transform:scale(1);opacity:.82;}50%{transform:scale(1.06);opacity:1;}}
.ld{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;}
.ld-logo{animation:ldBreath 2.6s ease-in-out infinite;}
.ld-slogan{margin-top:24px;font-size:17px;font-weight:500;color:#4A1B0C;line-height:1.85;min-height:2em;opacity:1;transition:opacity 1.1s ease;}
.ld-note{margin-top:10px;font-size:13px;color:#9C8873;letter-spacing:.04em;}
.ld-rule{margin-top:28px;width:64px;height:2px;border-radius:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);}
@media (prefers-reduced-motion:reduce){.ld-logo{animation:none;}.ld-slogan{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="ld">
    <svg class="ld-logo" width="78" height="58" viewBox="-52 -30 104 72" aria-hidden="true"><g fill="none" stroke="#4A1B0C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-36 -22 L36 -22 Q48 -22 48 -10"/><path d="M48 -10 L48 10 Q48 22 36 22"/><path d="M36 22 L-6 22 L-16 36 L-22 22 L-36 22 Q-48 22 -48 10"/><path d="M-48 10 L-48 -10 Q-48 -22 -36 -22"/></g><circle cx="-21" cy="0" r="5" fill="#C6603A"/><circle cx="-7" cy="0" r="5" fill="#6E8B77"/><circle cx="7" cy="0" r="5" fill="#6E8CA8"/><circle cx="21" cy="0" r="5" fill="#C99A4E"/></svg>
    <div class="ld-slogan" id="ldSlogan">練好溝通，你就有影響力</div>
    <div class="ld-note">正在透過 LINE 確認你的身份…</div>
    <div class="ld-rule"></div>
  </div>
</div>
<script>
/* slogan 慢速輪替：主標語＋骨層句（14 §5 金句庫），淡出→換字→淡入 */
(function(){
  var lines = ["練好溝通，你就有影響力", "這裡可以說真話", "先點亮自己，再照亮別人", "影響力的盡頭不是成交，是有人因為你變好"];
  var i = 0, s = document.getElementById("ldSlogan");
  setInterval(function(){
    if (!document.body.contains(s)) return;
    s.style.opacity = 0;
    setTimeout(function(){ i = (i + 1) % lines.length; s.textContent = lines[i]; s.style.opacity = 1; }, 1100);
  }, 4600);
})();
</script>

<script src="atpi-core.js"></script>
<script src="common.js"></script>
<script>
/* ⭐ 2026-09-02 身分路由再收斂：showcase.html 從路由拿掉，所有人都進健身房——
   不管在不在名單，一律讓他們進去，沒資料的人 member.html 自己會顯示空狀態
   （還沒量過體格、還沒有片刻…），不需要另外一個「展示頁」擋在前面。
     · 有開通「超引力-顧問課」或「超引力-公眾演說」→ pro.html（私教學員層・新版科技版，
       另開一支檔案，不動 dashboard.html——天麗跟舊私教學員完全不受影響）
     · 有開通其他任一門課（一階/二階/三階/tenlead-1…） → dashboard.html（學員模式，舊版）
     · 其餘所有人（含完全不在名單的）→ member.html（會員模式，體驗客/會員內容由 S.member 分）
   showcase.html 這個檔案還留著（給行銷連結用），只是不再被自動路由指到。 */
var PRO_WORKSHOPS = ["超引力-顧問課", "超引力-公眾演說"];
function routeFor(id) {
  var s = STUDENTS.find(function(x) { return x.lineId === id; });
  var inPro = ENROLLMENTS.some(function(e){ return e.lineId === id && PRO_WORKSHOPS.indexOf(e.workshopId) > -1; });
  if (inPro) return "pro.html?id=" + encodeURIComponent(id);
  return (s && s.enrolled ? "dashboard.html?id=" : "member.html?id=") + encodeURIComponent(id);
}

async function init() {
  try {
    /* 優先：URL 參數 ?id=（方便測試） */
    var params = new URLSearchParams(window.location.search);
    var urlId = params.get("id");

    await loadStudents();
    await loadConfig();  // 帶出 ENROLLMENTS，routeFor() 才能判斷是不是超引力那兩門課

    if (urlId) {
      window.location.href = routeFor(urlId);
      return;
    }

    /* 次要：透過 LIFF 取得 LINE userId */
    var sc = document.createElement("script");
    sc.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    await new Promise(function(resolve, reject) { sc.onload = resolve; sc.onerror = reject; document.head.appendChild(sc); });
    await liff.init({liffId: LIFF_ID});

    if (liff.isLoggedIn()) {
      var p = await liff.getProfile();
      window.location.href = routeFor(p.userId);
      return;
    } else if (liff.isInClient()) {
      // 只在 LINE 內才走登入（無縫）；外部瀏覽器不強制登入，避免跳出 access.line.me 網頁登入頁
      liff.login();
      return;
    }
  } catch(e) {
    console.log("init error:", e);
  }

  /* 桌面捷徑若沒帶 id，用上次記住的 id 進場（同樣走身分路由，未開通的人才不會被 dashboard 再彈一次） */
  try {
    var savedId = localStorage.getItem("cw_uid");
    if (savedId) { window.location.href = routeFor(savedId); return; }
  } catch (e) {}

  /* 完全拿不到 id（沒帶 ?id=、不在 LINE 內、沒有存過的 id）→ 直接進 member.html，
     讓它自己走 LIFF 登入那條（跟 comconverttest 進健身房時同一招：沒有 userId 就不要帶 ?id=）。 */
  window.location.href = "member.html";
}

init();
</script>
</body>
</html>
