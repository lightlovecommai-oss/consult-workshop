<script>
/* ⭐ 2026-09-06 老師拍板漏斗全鏈：quiz → visitor → join → member →（付款手動開通）→ pro。
   visitor.html 正式接進路由（原本是孤兒頁、路人全落 member 的體驗客模式）：
     · 有開通「超引力-顧問課」或「超引力-公眾演說」→ pro.html（私教學員層・新版科技版，
       另開一支檔案，不動 dashboard.html——天麗跟舊私教學員完全不受影響）
     · 天麗共訓營（tenlead-1）→ dashboard.html（學員模式，舊版）
     · 有開通其他任一門課（一階/二階/三階…）→ member.html（新版會員席）
     · 已付 99（開通名單「溝通健身房會員」手動勾選欄 → paidMember）→ member.html（會員席）
     · 其餘所有人（含完全不在名單的）→ visitor.html（體驗席）
   member.html 內建的體驗客模式（S.member=false）保留當防呆——有人直開網址不會壞。
   showcase.html 這個檔案還留著（給行銷連結用），只是不再被自動路由指到。

   ⭐ 2026-09-07 老師裁決：舊版 dashboard.html **只留給天麗那一批**。
      原本是「有開通任何課 → dashboard.html」，導致做完測驗的舊學員一律被送回舊版介面，
      新的影響力健身房（visitor／member／pro）等於只有完全沒開通課的人看得到。
      改成白名單制：只有 LEGACY_WORKSHOPS 裡的課走舊版，其餘全部進新版。
      ⚠️ dashboard.html 本身一個像素都沒動——天麗「加到主畫面」的捷徑是
         dashboard.html?id=…&addhome=1 的直接網址，繞過本頁，所以他們完全不受影響。
      日後天麗那一梯結束、要收掉舊版時，把 LEGACY_WORKSHOPS 清空即可。

   ⭐ 2026-09-24：對照表（SEAT_MAP／PRO_WORKSHOPS／LEGACY_WORKSHOPS）與判斷本體
      （expectedPage_）都搬到 common.js 了，因為 visitor／member／pro／dashboard 四頁
      也要能回頭問「他到底該不該在我這一頁」（主畫面捷徑鎖頁的問題）。改規則改那邊。 */

/* from=quiz 等來源標記要跟著人走到落地頁（visitor 用它接「剛測完？」那句） */
var FROM = "", MSQ = "", QSID = "", REF = "", BINDG = false;
try {
  var sp_ = new URLSearchParams(window.location.search);
  FROM = sp_.get("from") || "";
  /* bind=google＝他是來「把 Google 綁上」的，不是來進場的。拿到身份後停在這一頁
     畫綁定面板，不要照席位跳走。綁定只能在 LINE 認得出他的裝置上做（＝手機）。 */
  BINDG = sp_.get("bind") === "google";
  MSQ = sp_.get("ms") || "";   // LINE 外測完的 12 格分數（quiz 夾帶過來，MORD 序、1–5）
  /* sid＝測驗那一站的裝置碼。quiz.atpifit.com 與 app.atpifit.com 的 localStorage 不互通，
     所以它只能靠網址過來；記下來一起送給後端，匿名測驗那列才接得到這個 LINE 身份。 */
  QSID = sp_.get("sid") || "";
  if (QSID) localStorage.setItem("cw_qsid", QSID);       // 之後幾次進來沒帶參數也還接得上
  else QSID = localStorage.getItem("cw_qsid") || "";
  /* ref＝是誰帶他來的（推薦碼）。走跟 sid 一樣的路：先從網址收、存起來，
     之後幾次沒帶參數也還記得。決定歸誰的 30 天規則在後端（Code.gs ensureRosterRow_），
     這裡只負責「把碼原封不動送到」。⚠️ 畫面上不顯示任何跟推薦有關的東西。 */
  REF = (sp_.get("ref") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 12);
  if (REF) localStorage.setItem("cw_ref", REF);
  else REF = localStorage.getItem("cw_ref") || "";
} catch(e){}
function fromQ_(){ return FROM ? "&from=" + encodeURIComponent(FROM) : ""; }

/* ⭐ 2026-09-08 接住「LINE 外測驗的孤兒結果」：
   在 LINE 外開測驗拿不到 userId，quiz 那站寫不進試算表；他點「進健身房」時 quiz 把
   12 格分數夾在 ?ms= 帶過來。這裡在拿到身份（LIFF／?id=／記住的 cw_uid）的那一刻，
   回頭補寫「能力測驗一列＋健檢基線 12 列」——人跟分數就接上了。
   · 同一組 (id, ms) 只送一次（localStorage 簽名防重複，健檢是 append 不能疊）
   · 用 sendBeacon（頁面馬上要跳走，fetch 會被砍）；沒有就退回 keepalive fetch
   · 補寫的列姓名/Email 是空的——Code.gs 的 quiz upsert 已設「空值不洗掉舊資料」 */
function sendQuizBaseline_(id, name) {
  if (!MSQ || !id) return;
  var parts = MSQ.split(",").map(Number);
  if (parts.length !== MORD.length || parts.some(function(v){ return !(v >= 1 && v <= 5); })) return;
  var sig = id + "|" + MSQ;
  try { if (localStorage.getItem("cw_msq_sent_v1") === sig) return; } catch(e){}
  var ms = {}; MORD.forEach(function(m, i){ ms[m] = parts[i]; });
  var d5 = dimFromMuscles(ms), pct = {};
  DORD.forEach(function(k){ pct[k] = pctFromEval(d5[k]); });
  var sk = DORD.reduce(function(a, b){ return pct[a] > pct[b] ? a : b; });
  var uk = DORD.filter(function(k){ return k !== sk; }).reduce(function(a, b){ return pct[a] > pct[b] ? a : b; });
  var quiz = { action: "quiz", userId: id, displayName: name || "", name: "", email: "", job: "", quizSid: QSID, ref: REF,
    scoreA: pct.A, scoreT: pct.T, scoreP: pct.P, scoreI: pct.I,
    rawAnswers: parts.join(","), mainAbility: DIMS[sk].name, subAbility: DIMS[uk].name,
    timestamp: new Date().toISOString() };
  var ev = { action: "eval", lineId: id, source: "quiz",
    evals: MORD.map(function(m){ return { muscle: m, score: ms[m] }; }) };
  var sent = false;
  try {
    if (navigator.sendBeacon) {
      var blob = function(o){ return new Blob([JSON.stringify(o)], { type: "text/plain;charset=utf-8" }); };
      sent = navigator.sendBeacon(SHEET_API, blob(quiz)) && navigator.sendBeacon(SHEET_API, blob(ev));
    }
  } catch(e){}
  if (!sent) {
    try {
      fetch(SHEET_API, { method: "POST", body: JSON.stringify(quiz), headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true });
      fetch(SHEET_API, { method: "POST", body: JSON.stringify(ev), headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true });
    } catch(e){}
  }
  try { localStorage.setItem("cw_msq_sent_v1", sig); } catch(e){}
}
/* ⭐ 2026-09-21 進館報到：只要拿到真身份就跟後端報一聲，開通名單補上這個人。
   以前只有「在 LINE 裡做測驗」會建列——在電腦上測完、之後才用 LINE 進來的人
   永遠不在名單上，看不到也開通不了。報到不改任何席位，課程欄空白＝還是體驗席。
   · 同一個 (id, 名字) 只送一次；拿到名字之後會再送一次，讓後端把空的姓名欄補起來
   · 跟 sendQuizBaseline_ 一樣用 sendBeacon——這行的下一行就跳頁了 */
function sayHello_(id, name) {
  if (!/^U[0-9a-f]{32}$/i.test(String(id || ""))) return;   // 假身份／測試 id 不進名單
  var sig = id + "|" + (name || "") + "|" + QSID + "|" + REF;   // 名字/測驗裝置碼/推薦碼晚一步才拿到時要能再送一次
  try { if (localStorage.getItem("cw_hello_v1") === sig) return; } catch(e){}
  var payload = { action: "hello", userId: id, displayName: name || "", quizSid: QSID, ref: REF };
  var ok = false;
  try {
    if (navigator.sendBeacon) {
      ok = navigator.sendBeacon(SHEET_API, new Blob([JSON.stringify(payload)], { type: "text/plain;charset=utf-8" }));
    }
  } catch(e){}
  if (!ok) {
    try { fetch(SHEET_API, { method: "POST", body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true }); } catch(e){}
  }
  try { localStorage.setItem("cw_hello_v1", sig); } catch(e){}
}

/* 2026-09-24：名單與開通改成「帶著自己的 id 去問」，所以要先知道 id 才能載。
   以前是進來就撈全體名單（含每個人的 LINE userId）到瀏覽器裡，才在裡面找自己。 */
async function routeFor(id) {
  await loadStudents(id);
  await loadConfig(id);   // 帶出 ENROLLMENTS，才判斷得出是不是超引力那兩門課
  var s = STUDENTS.find(function(x) { return x.lineId === id; });
  var mine = ENROLLMENTS.filter(function(e){ return e.lineId === id; });
  /* 判斷本體在 common.js（四頁的 seatEscape_ 也問同一個函式，答案才不會兩套） */
  return expectedPage_(s, mine) + "?id=" + encodeURIComponent(id) + fromQ_();
}

/* 綁定面板。走到這裡身份已經確定（章的主人＝uid），只差「證明他擁有哪一個 Google 帳號」。
   ⚠️ Google 封鎖 webview 裡的 OAuth（disallowed_useragent），所以這一屏**必須**在
      LINE 外面的瀏覽器跑。但綁定的 QR 很多人會用 LINE 內建掃描器掃——那會開在
      LINE webview 裡，按鈕畫不出來、整頁變死路。所以先攔下來，給一顆外開的鈕。 */
function showBindPanel_(uid) {
  var w = document.querySelector(".wrap");
  if (!w) return;
  if (inLineClient_()) {
    w.innerHTML =
      '<div style="text-align:center;padding:2.5rem 1.25rem;max-width:360px;margin:0 auto;">'
      + '<div style="font-size:17px;font-weight:500;color:#4A1B0C;line-height:1.85;">這一步要在瀏覽器裡做</div>'
      + '<div style="margin:14px auto 18px;width:64px;height:2px;border-radius:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);"></div>'
      + '<div style="font-size:14px;color:#6B5847;line-height:1.9;margin-bottom:18px;">Google 不讓人在 LINE 內建的瀏覽器登入。<br>按下面這顆，會用你手機的瀏覽器打開同一頁。</div>'
      + '<a id="gext" href="' + gesc_(bindUrl_()) + '" style="display:inline-block;background:linear-gradient(135deg,#C6603A,#A94E2C);color:#fff;border-radius:22px;padding:13px 26px;text-decoration:none;font-size:16px;">用瀏覽器開啟 →</a>'
      + '</div>';
    var ext = document.getElementById("gext");
    if (ext) ext.addEventListener("click", function(ev){
      try {
        if (window.liff && liff.openWindow) { ev.preventDefault(); liff.openWindow({ url: bindUrl_(), external: true }); }
      } catch (e) {}   /* 攔不到就讓 href 自己跑，總比沒反應好 */
    });
    return;
  }
  w.innerHTML =
    '<div style="text-align:center;padding:2.5rem 1.25rem;max-width:360px;margin:0 auto;">'
    + '<div style="font-size:17px;font-weight:500;color:#4A1B0C;line-height:1.85;">綁一次，以後電腦也認得你</div>'
    + '<div style="margin:14px auto 18px;width:64px;height:2px;border-radius:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);"></div>'
    + '<div style="font-size:14px;color:#6B5847;line-height:1.9;margin-bottom:18px;">選一個你在電腦上會登入的 Google 帳號。<br>之後在任何裝置按它一下就進得來，<br>紀錄都是同一份。</div>'
    + '<div id="gbtn" style="display:flex;justify-content:center;"></div>'
    + '<div id="gmsg" style="font-size:13px;color:#9C8873;line-height:1.8;margin-top:14px;"></div>'
    + '</div>';
  googleButton_("gbtn", "bind", function(d){
    var msg = document.getElementById("gmsg"), btn = document.getElementById("gbtn");
    if (btn) btn.style.display = "none";
    if (!msg) return;
    var goIn = '<a href="index.html" style="display:inline-block;margin-top:12px;background:linear-gradient(135deg,#C6603A,#A94E2C);color:#fff;border-radius:22px;padding:11px 22px;text-decoration:none;font-size:15px;">進健身房 →</a>';
    if (d.status === "ok") {
      msg.innerHTML = '綁好了：' + gesc_(d.email || "") + '<br>電腦上開 app.atpifit.com，按 Google 就進得來。' + goIn;
      return;
    }
    if (d.status === "taken") {
      msg.innerHTML = gesc_(d.email || "") + ' 已經連到另一個帳號了。<br>換一個 Google 帳號，或跟教練說一聲。' + goIn;
      return;
    }
    if (d.status === "need-auth") {
      msg.innerHTML = '身份確認過期了，<a href="' + bindUrl_() + '" style="color:inherit;">再認證一次 →</a>';
      return;
    }
    msg.innerHTML = '沒綁成功' + (d.why ? '（' + gesc_(d.why) + '）' : '') + '。' + goIn;
  });
}

async function init() {
  try {
    /* 優先：URL 參數 ?id=（方便測試、也是導師看學員後台的方式） */
    var params = new URLSearchParams(window.location.search);
    var urlId = params.get("id");

    if (urlId) {
      /* 記住身分＋綁進追蹤，之後 visitor/member 才接得起同一段旅程。
         第二個參數故意不給＝不可信：這台裝置已經記得別人時不覆蓋（見 common.js 的 rememberUid_）。 */
      rememberUid_(urlId);
      sendQuizBaseline_(urlId, "");
      sayHello_(urlId, "");
      window.location.href = await routeFor(urlId);
      return;
    }

    /* 次要：透過 LIFF 取得 LINE userId */
    var sc = document.createElement("script");
    sc.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    await new Promise(function(resolve, reject) { sc.onload = resolve; sc.onerror = reject; document.head.appendChild(sc); });
    await liff.init({liffId: LIFF_ID});

    if (liff.isLoggedIn()) {
      var p = await liff.getProfile();
      rememberUid_(p.userId, true);   // LIFF profile＝本人，可以蓋掉裝置上記錯的 id
      sendQuizBaseline_(p.userId, p.displayName || "");
      sayHello_(p.userId, p.displayName || "");
      /* 換通行證要在**離開這一頁之前**做完。index 是唯一保證有 LIFF 的入口，
         visitor.html／dashboard.html 都沒有自己的 liff.init——轉過去就再也拿不到
         ID Token，那些人的打卡會永遠是「未驗證」，開關一翻就被鎖在門外。
         跟 routeFor 併行跑：它自己要等兩趟，所以這一趟不多花時間。 */
      /* 綁定要用通行證證明「我是誰」，所以這裡一定要等 ensureAuthTok_ 跑完才畫面板。
         正常進場則兩件事併行——routeFor 自己要等兩趟，換證不多花時間。 */
      if (BINDG) { await ensureAuthTok_(p.userId); showBindPanel_(p.userId); return; }
      var r_ = await Promise.all([routeFor(p.userId), ensureAuthTok_(p.userId)]);
      window.location.href = r_[0];
      return;
    } else if (liff.isInClient() || params.get("login") === "line") {
      /* LINE 內＝無縫登入。外部瀏覽器**預設仍不強制**——真路人不該被 access.line.me 擋在門口。
         但 ?login=line 是本人自己按的（visitor 那條「回到你的紀錄」），那就讓他登：
         同一支手機用 Chrome 開會掉到體驗席，就是因為 Chrome 的 localStorage 跟
         LINE 內建瀏覽器是兩份，沒有 cw_uid 可撿，只有登入拿得到真身份。 */
      /* 外部瀏覽器 ＋ 本人按了「回到你的紀錄」＝桌機那個痛點的正中心：
         直接 liff.login() 會跳 access.line.me 要 LINE 帳密，而多數人從沒設過密碼。
         所以這裡先給一屏讓他選（Google 一鍵／LINE），不要替他決定。
         兩個例外照舊直接登入：
         ① LINE 內——本來就無縫，不會問密碼，多一屏只是擋路。
         ② 綁定流程（BINDG）——綁定的前提就是先證明 LINE 身份，
            在這裡給 Google 選項會變成雞生蛋。 */
      if (!liff.isInClient() && !BINDG && GOOGLE_CLIENT_ID) {
        var w_ = document.querySelector(".wrap");
        if (w_) { w_.innerHTML = '<div id="bd"></div>'; renderLineBridge("bd"); return; }
      }
      var q_ = [];
      if (FROM) q_.push("from=" + encodeURIComponent(FROM));
      /* bind 要跟著繞完 access.line.me 那一圈回來，掉了的話他登完就被送去席位，
         綁定永遠做不完（實際會變成「按了按鈕什麼都沒發生」）。 */
      if (BINDG) q_.push("bind=google");
      var back_ = location.origin + location.pathname + (q_.length ? "?" + q_.join("&") : "");
      liff.login({ redirectUri: back_ });
      return;
    }
  } catch(e) {
    console.log("init error:", e);
  }

  /* 桌面捷徑若沒帶 id，用上次記住的 id 進場（同樣走身分路由，未開通的人才不會被 dashboard 再彈一次） */
  try {
    var savedId = localStorage.getItem("cw_uid");
    /* 這台裝置已經有章＝它證明得出身份，可以直接綁。沒章就往下走，
       上面 ?login=line 那條會先把身份拿到再回來。 */
    if (savedId && BINDG && authTokUid_() === savedId) { showBindPanel_(savedId); return; }
    if (savedId) { sendQuizBaseline_(savedId, ""); sayHello_(savedId, ""); window.location.href = await routeFor(savedId); return; }
  } catch (e) {}

  /* 完全拿不到 id（沒帶 ?id=、不在 LINE 內、沒有存過的 id）＝真路人 → 體驗席。
     visitor.html 不需要 id 也能跑（紀錄存 localStorage）；付過錢的回頭客走上面 cw_uid 那條。 */
  window.location.href = "visitor.html" + (FROM ? "?from=" + encodeURIComponent(FROM) : "");
}

init();
</script>
</body>
</html>
