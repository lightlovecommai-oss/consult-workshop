/* 等待畫面＝品牌精神露出的時刻（2026-09-04 老師拍板）：呼吸燈 logo＋慢速輪替 slogan，乾淨優雅 */
@keyframes ldBreath{0%,100%{transform:scale(1);opacity:.82;}50%{transform:scale(1.06);opacity:1;}}
.ld{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;}
.ld-logo{animation:ldBreath 2.6s ease-in-out infinite;}
.ld-slogan{margin-top:24px;font-size:17px;font-weight:500;color:#4A1B0C;line-height:1.85;min-height:2em;opacity:1;transition:opacity 1.1s ease;}
.ld-note{margin-top:10px;font-size:13px;color:#9C8873;letter-spacing:.04em;}
.ld-rule{margin-top:28px;width:64px;height:2px;border-radius:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);}
@media (prefers-reduced-motion:reduce){.ld-logo{animation:none;}.ld-slogan{transition:none;}}
</style>

<div class="wrap">
  <div class="ld">
    <svg class="ld-logo" width="78" height="58" viewBox="-52 -30 104 72" aria-hidden="true"><g fill="none" stroke="#4A1B0C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-36 -22 L36 -22 Q48 -22 48 -10"/><path d="M48 -10 L48 10 Q48 22 36 22"/><path d="M36 22 L-6 22 L-16 36 L-22 22 L-36 22 Q-48 22 -48 10"/><path d="M-48 10 L-48 -10 Q-48 -22 -36 -22"/></g><circle cx="-21" cy="0" r="5" fill="#C6603A"/><circle cx="-7" cy="0" r="5" fill="#6E8B77"/><circle cx="7" cy="0" r="5" fill="#6E8CA8"/><circle cx="21" cy="0" r="5" fill="#C99A4E"/></svg>
    <div class="ld-slogan" id="ldSlogan">練好溝通，你就有影響力</div>
    <div class="ld-note">正在透過 LINE 確認你的身份…</div>
    <div class="ld-rule"></div>
  </div>
</div>
<script>
/* slogan 慢速輪替：主標語＋骨層句（14 §5 金句庫），淡出→換字→淡入 */
(function(){
  var lines = ["練好溝通，你就有影響力", "這裡可以說真話", "先點亮自己，再照亮別人", "影響力的盡頭不是成交，是有人因為你變好"];
  var i = 0, s = document.getElementById("ldSlogan");
  setInterval(function(){
    if (!document.body.contains(s)) return;
    s.style.opacity = 0;
    setTimeout(function(){ i = (i + 1) % lines.length; s.textContent = lines[i]; s.style.opacity = 1; }, 1100);
  }, 4600);
})();
</script>

<script src="track.js"></script>
<script src="atpi-core.js"></script>
<script src="common.js"></script>
<script>
/* ⭐ 2026-09-06 老師拍板漏斗全鏈：quiz → visitor → join → member →（付款手動開通）→ pro。
   visitor.html 正式接進路由（原本是孤兒頁、路人全落 member 的體驗客模式）：
     · 有開通「超引力-顧問課」或「超引力-公眾演說」→ pro.html（私教學員層・新版科技版，
       另開一支檔案，不動 dashboard.html——天麗跟舊私教學員完全不受影響）
     · 天麗共訓營（tenlead-1）→ dashboard.html（學員模式，舊版）
     · 有開通其他任一門課（一階/二階/三階…）→ member.html（新版會員席）
     · 已付 99（開通名單「溝通健身房會員」手動勾選欄 → paidMember）→ member.html（會員席）
     · 其餘所有人（含完全不在名單的）→ visitor.html（體驗席）
   member.html 內建的體驗客模式（S.member=false）保留當防呆——有人直開網址不會壞。
   showcase.html 這個檔案還留著（給行銷連結用），只是不再被自動路由指到。

   ⭐ 2026-09-07 老師裁決：舊版 dashboard.html **只留給天麗那一批**。
      原本是「有開通任何課 → dashboard.html」，導致做完測驗的舊學員一律被送回舊版介面，
      新的影響力健身房（visitor／member／pro）等於只有完全沒開通課的人看得到。
      改成白名單制：只有 LEGACY_WORKSHOPS 裡的課走舊版，其餘全部進新版。
      ⚠️ dashboard.html 本身一個像素都沒動——天麗「加到主畫面」的捷徑是
         dashboard.html?id=…&addhome=1 的直接網址，繞過本頁，所以他們完全不受影響。
      日後天麗那一梯結束、要收掉舊版時，把 LEGACY_WORKSHOPS 清空即可。 */
var PRO_WORKSHOPS = ["超引力-顧問課", "超引力-公眾演說"];
var LEGACY_WORKSHOPS = ["tenlead-1"];

/* 手動指定席位（2026-09-07）：開通名單的「指定席位」欄一填，就蓋過下面所有自動規則。
   跑 Code.gs 的 setupSeatColumn() 會把這欄跟下拉選單建好。中英文都收，免得手打對不上。
   「健檢」＝把他丟回測驗重測一次（跨站，所以是絕對網址）。 */
var SEAT_MAP = {
  "體驗席":"visitor.html", "體驗客":"visitor.html", "visitor":"visitor.html",
  "會員席":"member.html",  "會員":"member.html",   "member":"member.html",
  "私教席":"pro.html",     "私教":"pro.html",      "pro":"pro.html",
  "舊版":"dashboard.html", "學員":"dashboard.html", "dashboard":"dashboard.html",
  "健檢":"https://quiz.atpifit.com/", "測驗":"https://quiz.atpifit.com/", "quiz":"https://quiz.atpifit.com/"
};
/* from=quiz 等來源標記要跟著人走到落地頁（visitor 用它接「剛測完？」那句） */
var FROM = "", MSQ = "";
try {
  var sp_ = new URLSearchParams(window.location.search);
  FROM = sp_.get("from") || "";
  MSQ = sp_.get("ms") || "";   // LINE 外測完的 12 格分數（quiz 夾帶過來，MORD 序、1–5）
} catch(e){}
function fromQ_(){ return FROM ? "&from=" + encodeURIComponent(FROM) : ""; }

/* ⭐ 2026-09-08 接住「LINE 外測驗的孤兒結果」：
   在 LINE 外開測驗拿不到 userId，quiz 那站寫不進試算表；他點「進健身房」時 quiz 把
   12 格分數夾在 ?ms= 帶過來。這裡在拿到身份（LIFF／?id=／記住的 cw_uid）的那一刻，
   回頭補寫「能力測驗一列＋體測基線 12 列」——人跟分數就接上了。
   · 同一組 (id, ms) 只送一次（localStorage 簽名防重複，體測是 append 不能疊）
   · 用 sendBeacon（頁面馬上要跳走，fetch 會被砍）；沒有就退回 keepalive fetch
   · 補寫的列姓名/Email 是空的——Code.gs 的 quiz upsert 已設「空值不洗掉舊資料」 */
function sendQuizBaseline_(id, name) {
  if (!MSQ || !id) return;
  var parts = MSQ.split(",").map(Number);
  if (parts.length !== MORD.length || parts.some(function(v){ return !(v >= 1 && v <= 5); })) return;
  var sig = id + "|" + MSQ;
  try { if (localStorage.getItem("cw_msq_sent_v1") === sig) return; } catch(e){}
  var ms = {}; MORD.forEach(function(m, i){ ms[m] = parts[i]; });
  var d5 = dimFromMuscles(ms), pct = {};
  DORD.forEach(function(k){ pct[k] = pctFromEval(d5[k]); });
  var sk = DORD.reduce(function(a, b){ return pct[a] > pct[b] ? a : b; });
  var uk = DORD.filter(function(k){ return k !== sk; }).reduce(function(a, b){ return pct[a] > pct[b] ? a : b; });
  var quiz = { action: "quiz", userId: id, displayName: name || "", name: "", email: "", job: "",
    scoreA: pct.A, scoreT: pct.T, scoreP: pct.P, scoreI: pct.I,
    rawAnswers: parts.join(","), mainAbility: DIMS[sk].name, subAbility: DIMS[uk].name,
    timestamp: new Date().toISOString() };
  var ev = { action: "eval", lineId: id, source: "quiz",
    evals: MORD.map(function(m){ return { muscle: m, score: ms[m] }; }) };
  var sent = false;
  try {
    if (navigator.sendBeacon) {
      var blob = function(o){ return new Blob([JSON.stringify(o)], { type: "text/plain;charset=utf-8" }); };
      sent = navigator.sendBeacon(SHEET_API, blob(quiz)) && navigator.sendBeacon(SHEET_API, blob(ev));
    }
  } catch(e){}
  if (!sent) {
    try {
      fetch(SHEET_API, { method: "POST", body: JSON.stringify(quiz), headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true });
      fetch(SHEET_API, { method: "POST", body: JSON.stringify(ev), headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true });
    } catch(e){}
  }
  try { localStorage.setItem("cw_msq_sent_v1", sig); } catch(e){}
}
function routeFor(id) {
  var s = STUDENTS.find(function(x) { return x.lineId === id; });
  var q = "?id=" + encodeURIComponent(id) + fromQ_();

  var seat = s && s.seat ? SEAT_MAP[String(s.seat).trim().toLowerCase()] || SEAT_MAP[String(s.seat).trim()] : "";
  if (seat) return seat + q;

  var mine = ENROLLMENTS.filter(function(e){ return e.lineId === id; });
  var has = function(list){ return mine.some(function(e){ return list.indexOf(e.workshopId) > -1; }); };
  if (has(PRO_WORKSHOPS)) return "pro.html" + q;
  if (has(LEGACY_WORKSHOPS)) return "dashboard.html" + q;
  if (s && (s.enrolled || s.paidMember)) return "member.html" + q;
  return "visitor.html" + q;
}

async function init() {
  try {
    /* 優先：URL 參數 ?id=（方便測試） */
    var params = new URLSearchParams(window.location.search);
    var urlId = params.get("id");

    await loadStudents();
    await loadConfig();  // 帶出 ENROLLMENTS，routeFor() 才能判斷是不是超引力那兩門課

    if (urlId) {
      rememberUid_(urlId);   // 記住身分＋綁進追蹤，之後 visitor/member 才接得起同一段旅程
      sendQuizBaseline_(urlId, "");
      window.location.href = routeFor(urlId);
      return;
    }

    /* 次要：透過 LIFF 取得 LINE userId */
    var sc = document.createElement("script");
    sc.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    await new Promise(function(resolve, reject) { sc.onload = resolve; sc.onerror = reject; document.head.appendChild(sc); });
    await liff.init({liffId: LIFF_ID});

    if (liff.isLoggedIn()) {
      var p = await liff.getProfile();
      rememberUid_(p.userId);
      sendQuizBaseline_(p.userId, p.displayName || "");
      window.location.href = routeFor(p.userId);
      return;
    } else if (liff.isInClient()) {
      // 只在 LINE 內才走登入（無縫）；外部瀏覽器不強制登入，避免跳出 access.line.me 網頁登入頁
      liff.login();
      return;
    }
  } catch(e) {
    console.log("init error:", e);
  }

  /* 桌面捷徑若沒帶 id，用上次記住的 id 進場（同樣走身分路由，未開通的人才不會被 dashboard 再彈一次） */
  try {
    var savedId = localStorage.getItem("cw_uid");
    if (savedId) { sendQuizBaseline_(savedId, ""); window.location.href = routeFor(savedId); return; }
  } catch (e) {}

  /* 完全拿不到 id（沒帶 ?id=、不在 LINE 內、沒有存過的 id）＝真路人 → 體驗席。
     visitor.html 不需要 id 也能跑（紀錄存 localStorage）；付過錢的回頭客走上面 cw_uid 那條。 */
  window.location.href = "visitor.html" + (FROM ? "?from=" + encodeURIComponent(FROM) : "");
}

init();
</script>
</body>
