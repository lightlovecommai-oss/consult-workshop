<style>
/* ═══ 私人教練席 v5・三分頁版（2026-09-14 demo-pro-v5 驗過轉正）═══
   三分頁：①客戶管理＝引力場＋客戶卡（排序＝今天該動誰）＋COACH SIGNAL＋這週議程
   ②課程地圖＝甜蜜路徑（最強兩維定人設×三狀態定下一步）＋這季主力＋課程星圖＋演說段
   ③市場數字＝三個數字＋肌肉牆＋改觀句金庫（只收客戶原話，見證不代擬的制度版）
   打卡標準＝「這個客戶走到哪」（圈層 none/A/T/P/I）；舊紀錄沒有 stage 欄，
   用 entryStage() 從 reaction 推回（沒特別/空→none，其餘→那塊肌肉的維度）。
   資料全真：分數讀 calcMuscleScores/calcDimScores5、軌跡讀 checkinLog、金額讀 revenueLog；
   demo（?demo=1）才用示意資料。圈層用語拍板版：沒反應→想靠近→願意說→要找你→認定你。 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0c131e;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#eaf1fa;-webkit-font-smoothing:antialiased;}
/* 席位色：金＝我在私教席（骨架、數字、強調字），行動色橘只留給「要按的」。
   變數名跟 member／visitor 同一套（會員藍／體驗綠／私教金）。 */
body{--sd:#e6a93a;--st:rgba(230,169,58,.14);}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:84px;}

/* 席位橫幅（pro＝咖啡金識別＋掃描線） */
.tb{background:linear-gradient(135deg,#4A1B0C,#6B3018);padding:16px 20px 14px;position:relative;overflow:hidden;}
.tb:after{content:"";position:absolute;left:0;right:0;top:0;height:1.5px;background:linear-gradient(90deg,transparent,#E8C89A,transparent);animation:scan 3.2s ease-in-out infinite;}
@keyframes scan{0%{top:0;opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{top:100%;opacity:0;}}
.tb-k{display:flex;align-items:center;font-size:11px;letter-spacing:3px;font-weight:700;color:#E8C89A;}
.tb-d{margin-left:auto;font-size:12px;color:rgba(247,241,236,.6);letter-spacing:.5px;}
.tb-r{display:flex;align-items:center;gap:10px;margin-top:9px;}
.tb-n{font-size:19px;font-weight:900;color:#F7F1EC;}
.tb-s{font-size:12.5px;color:rgba(247,241,236,.65);margin-top:5px;}
.hall{font-size:12px;font-weight:700;color:#E8C89A;background:rgba(232,200,154,.12);border:1px solid rgba(232,200,154,.45);padding:3px 10px;border-radius:20px;margin-left:auto;white-space:nowrap;}
.aa-btn{margin-left:10px;font-size:13px;font-weight:800;letter-spacing:0;color:#E8C89A;background:rgba(232,200,154,.12);border:1px solid rgba(232,200,154,.45);border-radius:14px;padding:3px 10px;cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap;position:relative;z-index:1;}

.bd{padding:20px 20px 16px;}
.cd{background:#131f2b;border:1px solid #1d2c3c;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.28);}
.hero{background:linear-gradient(160deg,#0c131e 0%,#152233 100%);border:1px solid rgba(75,155,240,.25);border-radius:18px;padding:20px 18px 18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(12,19,30,.45);}
.sec{font-size:12px;font-weight:700;color:#8ea1b6;letter-spacing:2px;margin:0 0 12px;}
.sec b{color:#eaf1fa;font-size:13px;letter-spacing:1px;}
.kick{display:flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:2px;color:#E8C89A;margin-bottom:8px;}
.big-t{font-size:22px;font-weight:900;line-height:1.5;color:#F7F1EC;}
.big-t em{font-style:normal;color:var(--sd);text-shadow:0 0 12px rgba(230,169,58,.45);}
.sub-t{font-size:15px;color:#8ea1b6;margin-top:7px;line-height:1.85;}
.sub-t b{color:#cfdcea;}
.rule4{height:2px;background:linear-gradient(90deg,#e8734a,#33c495,#4b9bf0,#e6a93a);box-shadow:0 0 8px rgba(232,115,74,.35);border-radius:2px;margin-top:16px;}

/* ═ 薄片原語・科技版：形狀跟 member/visitor 完全同（skewX -12°、基線共軸、三態），
   只換色——實色＝霓虹＋發光、淡填＝霓虹 22% 透明、虛線＝深藍灰。
   I 金紅線的深底落法：不鋪實，改 18% 金底＋實線金描邊＋發光。 ═ */
.slw{--sg:0px;}
.srow{display:flex;align-items:flex-end;gap:7px;border-bottom:2px solid rgba(234,241,250,.20);padding:6px calc(4px + var(--sg,0px)) 0 4px;}
.sl{flex:1;border-radius:6px 6px 0 0;transform:skewX(-12deg);transform-origin:50% 100%;position:relative;transition:height .4s cubic-bezier(.4,0,.2,1);}
.sl.todo{background:transparent!important;border:1.5px dashed #3d5268;border-bottom:0;}
.sl.sel{outline:2px solid #E8C89A;outline-offset:2px;animation:selpop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes selpop{0%{transform:skewX(-12deg) scale(.92);}60%{transform:skewX(-12deg) scale(1.08);}100%{transform:skewX(-12deg) scale(1);}}
.sl.now.gold{background:rgba(230,169,58,.18)!important;border:2px solid #e6a93a;border-bottom:0;box-shadow:0 0 14px rgba(230,169,58,.45);}
.slbl{display:flex;gap:7px;padding:7px calc(4px + var(--sg,0px)) 0 4px;}
.slbl span{flex:1;text-align:center;font-size:12px;font-weight:700;color:#cfdcea;line-height:1.45;}
.slbl span i{display:block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:1px;}
.slbl span.dim{color:#5d7692;font-weight:600;}
.slv{display:flex;gap:7px;padding:0 calc(4px + var(--sg,0px)) 0 4px;}
.slv span{flex:1;text-align:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}

/* 客戶卡（CRM 主角）：一張卡＝一個人的軌跡。
   run 列＝出手順序：顏色＝用哪塊肌肉、高度＝他走到哪；最後一片實色發光。
   右內距 30px＝斜切呼吸位（最高 82px × tan12° ≈ 17px）。 */
.cl{background:#131f2b;border:1px solid #1d2c3c;border-radius:18px;padding:16px 30px 14px 16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;}
.cl:active{box-shadow:0 2px 8px rgba(0,0,0,.35);}
.cl-hd{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.cl-av{width:38px;height:38px;border-radius:50%;color:#0c131e;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.cl-n{font-size:16px;font-weight:800;color:#F7F1EC;}
.cl-m{font-size:12.5px;color:#7d90a3;margin-top:2px;}
.cl-st{margin-left:auto;font-size:12px;font-weight:800;padding:4px 11px;border-radius:20px;flex-shrink:0;}
.runrow{border-bottom:2px solid rgba(234,241,250,.20);display:flex;align-items:flex-end;gap:6px;padding:8px 2px 0;overflow-x:auto;}
.runrow .sl{flex:0 0 42px;}
.runlbl{display:flex;gap:6px;padding:6px 2px 0;overflow-x:auto;}
.runlbl span{flex:0 0 42px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#5d7692;}
/* 教練判讀＝pro 的產品，長在每張卡上 */
.read{display:flex;gap:9px;margin-top:12px;border-top:1px dashed rgba(93,118,146,.35);padding-top:11px;font-size:13.5px;line-height:1.8;color:#cfdcea;}
.read .cv{width:24px;height:24px;border-radius:50%;background:rgba(232,200,154,.15);border:1px solid rgba(232,200,154,.5);color:#E8C89A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px;}
.read b{color:#e6a93a;}
.cl-go{margin-top:10px;text-align:right;font-size:13px;font-weight:800;color:#E8C89A;}

/* 教練在場條 */
.coach{display:flex;align-items:center;gap:10px;background:rgba(12,19,30,.5);border:1px solid rgba(232,200,154,.25);border-radius:14px;padding:11px 13px;margin-bottom:14px;}
.coach-av{width:34px;height:34px;border-radius:50%;background:rgba(232,200,154,.15);border:1px solid rgba(232,200,154,.5);color:#E8C89A;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.coach-n{font-size:13.5px;font-weight:700;color:#F7F1EC;}
.coach-s{font-size:11.5px;color:rgba(247,241,236,.55);margin-top:1px;}
.coach-nx{margin-left:auto;text-align:right;font-size:11px;color:rgba(247,241,236,.55);line-height:1.6;flex-shrink:0;text-decoration:none;}
.coach-nx b{display:block;font-size:12.5px;color:#E8C89A;}

/* 席位路徑（全貌感常駐）：pro＝最後一站，CTA 換成骨層句不是升級 */
.seatpath{background:transparent;border:1.5px solid rgba(232,200,154,.5);border-radius:16px;padding:13px 14px 12px;margin:18px 0 4px;}
.sp-cta{margin-top:10px;border-top:1px dashed rgba(232,200,154,.35);padding-top:10px;text-align:center;font-size:13.5px;font-weight:700;color:#E8C89A;line-height:1.7;}
.sp-row{display:flex;align-items:flex-end;gap:6px;border-bottom:2px solid rgba(234,241,250,.20);padding:2px 2px 0;}
.sp{border-radius:5px 5px 0 0;transform:skewX(-12deg);transform-origin:50% 100%;}
.sp.past{background:rgba(51,196,149,.22);}
.sp.past.p2{background:rgba(75,155,240,.22);}
.sp.now{background:rgba(230,169,58,.18);border:2px solid #e6a93a;border-bottom:0;box-shadow:0 0 14px rgba(230,169,58,.45);}
.sp-lbl{display:flex;gap:6px;padding:6px 2px 0;font-size:11.5px;font-weight:700;}
.sp-goal{flex:1.6;align-self:center;font-size:12px;color:#8ea1b6;line-height:1.6;padding:0 2px 4px 8px;}
.sp-goal b{color:#E8C89A;}
.sp-here{font-size:10px;font-weight:800;letter-spacing:.5px;color:#e6a93a;white-space:nowrap;}

/* 主行動鈕（CTA 三層：練習鈕＝磚橘柔漸層，深底照樣成立） */
.gobtn{display:block;width:100%;background:linear-gradient(135deg,#C6603A 0%,#AF5433 100%);box-shadow:0 4px 12px rgba(198,96,58,.30);color:#fff;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:700;text-align:center;cursor:pointer;font-family:inherit;min-height:56px;margin-top:18px;}
.gobtn:active{transform:scale(.98);}
.howq{margin-top:14px;background:rgba(230,237,245,.06);border-left:3px solid var(--sd);border-radius:0 12px 12px 0;padding:12px 14px;}
.howq-k{font-size:12px;color:#7d90a3;margin-bottom:5px;}
.howq-t{font-size:15px;line-height:1.8;color:#cfdcea;}
.howq-t b{color:#e6a93a;}
.drill-tg{width:100%;background:none;border:0;color:#E8C89A;font-weight:700;font-size:13.5px;padding:12px 0 2px;cursor:pointer;font-family:inherit;min-height:44px;text-align:center;}
.drill{margin-top:8px;border-top:1px dashed rgba(93,118,146,.35);}
.dr{padding:10px 2px 9px;border-bottom:1px dashed rgba(93,118,146,.25);}
.dr:last-child{border-bottom:0;}
.dr-k{font-size:11.5px;color:#7d90a3;font-weight:700;letter-spacing:1.5px;margin-bottom:3px;}
.dr-v{font-size:14px;line-height:1.85;color:#cfdcea;}
.dr-v b{color:var(--sd);}
.pk-say{font-size:14px;color:#cfdcea;line-height:1.9;}
.pk-say b{color:#e6a93a;}
.pk-bl{display:inline-block;min-width:34px;border-bottom:1px solid #5d7692;height:1em;vertical-align:baseline;}

/* 開練流程 */
.rec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rec-bk{background:none;border:0;color:#7d90a3;font-size:22px;cursor:pointer;padding:0 4px 0 0;line-height:1;font-family:inherit;min-height:44px;}
.rec-n{font-size:15px;font-weight:700;color:#F7F1EC;}
.rec-m{font-size:13px;color:#8ea1b6;margin-top:2px;}
.q{font-size:15px;font-weight:700;margin:4px 0 11px;color:#F7F1EC;}
.qs{font-size:13px;color:#7d90a3;font-weight:400;margin-left:6px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.op{font-size:13px;padding:11px 16px;border-radius:20px;border:1px solid #2a3c52;background:rgba(230,237,245,.06);color:#cfdcea;cursor:pointer;font-family:inherit;min-height:44px;}
.op.on{background:#C6603A;border-color:#C6603A;color:#fff;font-weight:600;}
.brake{margin-top:12px;background:rgba(51,196,149,.12);border:1px solid rgba(51,196,149,.3);border-radius:12px;padding:10px 12px;font-size:13px;color:#5fd8b0;line-height:1.75;}
.ta{width:100%;background:rgba(230,237,245,.06);border:1px solid #2a3c52;border-radius:14px;padding:11px;font-size:17px;color:#eaf1fa;font-family:inherit;line-height:1.6;min-height:64px;resize:vertical;margin-top:9px;}
.ta:focus{outline:none;border-color:#C6603A;}
.sub{width:100%;background:linear-gradient(135deg,#C6603A 0%,#AF5433 100%);color:#fff;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:15px;font-family:inherit;min-height:44px;}
.sub[disabled]{background:#2a3c52;color:#5d7692;}
.skip{width:100%;margin-top:8px;background:none;border:0;color:#7d90a3;font-size:13px;cursor:pointer;font-family:inherit;min-height:44px;}
.ladder{margin-top:6px;} /* 最高片 118px 的斜角呼吸位 */
.ladder .sl{cursor:pointer;}

/* 完成頁 */
.ok{text-align:center;padding:10px 0 4px;}
.ok-t{font-size:26px;margin:14px 0 10px;line-height:1.4;font-weight:600;color:#F7F1EC;}
.ok-s{font-size:15px;color:#8ea1b6;line-height:1.95;}
.ok-s b{color:#eaf1fa;}
.p3check{width:64px;height:64px;border-radius:50%;background:#C6603A;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;animation:cpop .6s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 22px rgba(198,96,58,.5);}
@keyframes cpop{0%{transform:scale(0);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.mile{margin-top:14px;background:rgba(230,169,58,.10);border:1.5px solid rgba(230,169,58,.5);border-radius:12px;padding:11px 13px;font-size:14.5px;font-weight:700;text-align:left;color:#F7F1EC;}
.mile span{display:block;font-size:12.5px;color:#8ea1b6;font-weight:400;margin-top:3px;}
.fwwrap{position:relative;width:64px;height:64px;margin:0 auto;}
.fw{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;animation:fly .9s ease-out both;}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.35);opacity:0;}}
.echo{background:rgba(230,237,245,.06);border-left:3px solid var(--sd);border-radius:0 12px 12px 0;padding:11px 13px;margin-top:12px;font-size:14px;line-height:1.75;text-align:left;color:#cfdcea;}
.echo span{display:block;font-size:12px;color:#7d90a3;margin-top:4px;}
.bone{margin:16px 2px 2px;font-size:15px;line-height:1.85;text-align:center;animation:bfade 1s .4s both;cursor:pointer;color:#cfdcea;}
@keyframes bfade{from{opacity:0;}to{opacity:1;}}
.tapback{text-align:center;font-size:12.5px;color:#5d7692;margin-top:8px;cursor:pointer;padding:10px;min-height:44px;}

/* 體格牆（成果頁）：真資料、pro 12 塊全開＝跟 member 的迷霧對比 */
.wall-pot{border-bottom:1px dashed rgba(93,118,146,.35);padding-bottom:12px;margin-bottom:14px;}
.pot-k{font-size:11.5px;font-weight:700;color:#8ea1b6;letter-spacing:2px;}
.pot-n{font-size:27px;font-weight:900;color:var(--sd);text-shadow:0 0 14px rgba(230,169,58,.4);margin-top:1px;}
.pot-n span{font-size:13px;font-weight:700;color:#5d7692;margin-left:4px;}
.subrow{margin-top:14px;border-top:1px dashed rgba(93,118,146,.35);padding-top:12px;}
.fbchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.fbc{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(230,237,245,.08);color:#8ea1b6;}
.fbc b{font-weight:800;}
.wall-note{font-size:12.5px;color:#7d90a3;margin-top:10px;line-height:1.7;}
.open-note{background:rgba(230,169,58,.10);border-radius:10px;padding:9px 12px;color:#E8C89A;margin-top:10px;font-weight:600;font-size:12.5px;line-height:1.7;}

/* 成果數字＋金庫（改觀句＝骨層） */
.stat-row{display:flex;align-items:baseline;gap:10px;background:rgba(230,237,245,.06);border-radius:12px;padding:13px;margin-bottom:8px;}
.stat-v{font-size:22px;font-weight:700;color:#e8734a;line-height:1;font-variant-numeric:tabular-nums;}
.stat-l{font-size:13px;color:#cfdcea;}
.stat-r{margin-left:auto;font-size:12px;color:#7d90a3;text-align:right;line-height:1.5;}
.vault{background:linear-gradient(135deg,#4A1B0C,#6B3018);border:1px solid rgba(232,200,154,.35);border-radius:16px;padding:19px 18px;color:#F7F1EC;margin-bottom:14px;position:relative;overflow:hidden;}
.vault:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(232,200,154,.12),transparent);animation:sheen 4.5s ease-in-out infinite;}
@keyframes sheen{0%,55%{left:-60%;}85%,100%{left:120%;}}
.vault-k{font-size:11px;letter-spacing:3px;color:#E8C89A;font-weight:700;}
.vault-q{font-size:16px;line-height:1.9;margin-top:10px;}
.vault-q b{color:#E8C89A;}
.vault-quote{margin-top:13px;background:rgba(247,241,236,.08);border-left:3px solid #E8C89A;border-radius:0 10px 10px 0;padding:10px 13px;font-size:14px;line-height:1.85;color:rgba(247,241,236,.92);}
.vault-quote small{display:block;margin-top:5px;font-size:11px;color:#C9A87A;}

/* 課程星圖：迷霧鎖＝整排 grayscale＋灰底條（12條清單⑦⑧：照樣渲染完整，看得到吃不到） */
.lockwrap{filter:grayscale(.9);opacity:.38;pointer-events:none;}
.lockbar{background:rgba(230,237,245,.07);border-radius:10px;padding:9px 12px;font-size:12.5px;color:#8ea1b6;margin-top:10px;line-height:1.75;}
.lockbar b{color:#cfdcea;}
.linknote{background:rgba(230,169,58,.10);border-radius:10px;padding:9px 12px;color:#E8C89A;margin-top:12px;font-weight:600;font-size:12.5px;line-height:1.7;}

/* 甜蜜路徑（09-14 方案B）：狀態軸當主角＋路線一行＋四站摺疊；定義句收進「?」 */

/* 引力場：圈層＝他跟你的距離（越內圈越近），一點＝一個客戶，停 14 天描虛線 */

<script>
/* ═══ 私人教練席 v5（正式版）═══
   設計真相＝demo-pro-v5.html（2026-09-11 三分頁拍板＋09-14 甜蜜路徑方案B）。
   這支只做「demo 假資料 → S 真資料」的轉接，版面一片不動：
   - LOG＝checkinLog 裡有對象的筆（一片薄片＝一次出手）
   - stage＝打卡新標準（這個客戶走到哪）；舊筆沒 stage 欄用 entryStage() 從 reaction 推回
   - 分數＝calcMuscleScores/calcDimScores5；金額＝revenueLog；金庫＝note 裡的「」原話
   - 人設照最強兩維自動判、狀態照 revenueLog 判（教練拍板可改＝下次 1v1 的事，不編後端沒有的欄位） */
var PRO_WORKSHOPS = ["超引力-顧問課", "超引力-公眾演說"];
var S = null, WID = null, REC = null;

var STAGES = [
  {k:"none", zh:"沒反應", full:"他沒什麼反應", c:"#5d7692", t:"#8ea1b6", tint:"rgba(125,144,163,.18)", h:30},
  {k:"A", zh:"想靠近", full:"他想靠近了", c:"#e8734a", t:"#f08a63", tint:"rgba(232,115,74,.22)", h:52},
  {k:"T", zh:"願意說", full:"他願意說了", c:"#33c495", t:"#5fd8b0", tint:"rgba(51,196,149,.22)", h:74},
  {k:"P", zh:"要找你", full:"他要找你了", c:"#4b9bf0", t:"#7ab5f5", tint:"rgba(75,155,240,.22)", h:96},
  {k:"I", zh:"認定你", full:"他認定你了", c:"#e6a93a", t:"#eec06a", tint:"rgba(230,169,58,.22)", h:118}
];
function stageIdx(k){ for (var i=0;i<STAGES.length;i++) if (STAGES[i].k===k) return i; return -1; }
var PALV = {
  A:{c:"#e8734a",t:"#f08a63",tint:"rgba(232,115,74,.22)"},
  T:{c:"#33c495",t:"#5fd8b0",tint:"rgba(51,196,149,.22)"},
  P:{c:"#4b9bf0",t:"#7ab5f5",tint:"rgba(75,155,240,.22)"},
  I:{c:"#e6a93a",t:"#eec06a",tint:"rgba(230,169,58,.22)"}
};
var DIMS_V = {A:{name:"吸引肌肉"},T:{name:"信任肌肉"},P:{name:"專業肌肉"},I:{name:"推進肌肉"}};
var DIM_EN = {A:"ATTRACT",T:"TRUST",P:"PROFESSIONAL",I:"IMPACT"};
var REL = ["客戶", "同事", "朋友", "家人"];
var SOFT_REL = ["家人", "朋友"];

/* 分頁：預設客戶管理（每天打開的理由是「今天該動誰」）；舊網址 path/body 對映過來 */
var PANE = "crm";
try {
  var _p0 = new URLSearchParams(location.search).get("pane");
  if (_p0 === "path") _p0 = "crm";
  if (_p0 === "body") _p0 = "out";
  if (["crm","map","out"].indexOf(_p0) > -1) PANE = _p0;
} catch (e) {}

function el(id){ return document.getElementById(id); }
function esc_(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function md_(t){ return esc_(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>"); }

/* ── 出手紀錄層：checkinLog → LOG（只收有對象的筆；陌生人不進客戶管理）──
   stage：新筆直接帶（打卡標準＝這個客戶走到哪）；舊筆從 reaction 推回——
   沒特別/空＝none，其餘先落在「用哪塊肌肉」那一維（誠實近似，教練看得懂）。 */
function entryStage(e){
  if (e.stage && stageIdx(e.stage) > -1) return e.stage;
  if (!e.reaction || e.reaction === "沒特別") return "none";
  var dim = e.muscle && MUSCLES[e.muscle] ? MUSCLES[e.muscle].dim : (e.dim || "");
  return stageIdx(dim) > -1 ? dim : "none";
}
function buildLog(){
  return (S.checkinLog || []).filter(function(e){ return e.target && e.target !== "陌生人"; })
    .map(function(e){
      var mk = e.muscle && MUSCLES[e.muscle] ? e.muscle : "";
      return { muscle: mk, dimKey: mk ? MUSCLES[mk].dim : (e.dim || ""), lbl: mk || e.dim || "?",
               target: e.target, rel: e.rel || "客戶", stage: entryStage(e),
               date: normDate(e.date), note: e.note || "" };
    })
    .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
}
var LOG = [];

/* 改觀句金庫：只收「」框起來的客戶原話（見證不代擬的制度版——沒框就不是引言，不進） */
function buildVault(){
  var out = [];
  LOG.slice().reverse().forEach(function(e){
    if (!/「.+」/.test(e.note)) return;
    var st = STAGES[stageIdx(e.stage)];
    out.push({ q: e.note.replace(/^「|」$/g, ""), who: e.target,
               tag: e.stage === "none" ? "還沒反應的那筆" : "走到「" + st.zh + "」那天" });
  });
  return out;
}

/* ── 甜蜜路徑：最強兩維定人設（六選一，職稱真相＝字典01）×三狀態定下一步 ──
   站點文案：強項站＝這一步你本來就順手；弱項站＝工具上場不硬練（別補弱）。 */
var PERSONAS = {
  AT:{name:"社群關係經營者", tag:"人自然往你靠，聊著聊著就成交——社群養粉×轉介紹成交"},
  AP:{name:"知識型意見領袖", tag:"講出來的東西有人追——知識內容×課程產品"},
  AI:{name:"舞台成交講師",   tag:"站上台就有魅力——演講亮相×現場收單"},
  PT:{name:"深度信賴顧問",   tag:"慢熱但黏著度極高——深度服務×口碑轉介紹"},
  IT:{name:"人脈成交操盤者", tag:"關係深、敢開口——人脈深耕×結果說話"},
  IP:{name:"B2B 提案顧問",   tag:"專業說話、直接成交——專業提案×企業成交"}
};
var ST_STRONG = {
  A:{short:"曝光",   tool:"內容曝光・讓人靠過來",  role:"帶流量",   note:"人會自己靠過來——這一步你本來就順手，照跑就好。"},
  T:{short:"深聊",   tool:"一對一聊到底",          role:"養信任",   note:"先聽他的事，別急著講方案——這一步你本來就順手。"},
  P:{short:"方法",   tool:"把你的解法講清楚",      role:"方法感",   note:"讓他看見你就是那個解法——這一步你本來就順手。"},
  I:{short:"開口",   tool:"當面確認・開口收單",    role:"替你開口", note:"帶他確認他要的結果——這一步你本來就順手。"}
};
var ST_WEAK = {
  A:{short:"引薦",   tool:"請成交過的人引薦",           role:"帶流量",   note:"流量讓別人替你帶——請老客戶開口，比自己硬曝光省力。"},
  T:{short:"兌現",   tool:"小承諾準時兌現",             role:"養信任",   note:"信任用兌現堆——說到做到的小事，比長聊更省力。"},
  P:{short:"一頁紙", tool:"一頁「我是怎麼幫到人的」",   role:"方法感",   note:"方法感用一頁紙給，不硬講理論——聊得來的人一看，就知道你是那個解法。"},
  I:{short:"報名表", tool:"限時報名表單",               role:"替你開口", note:"截止日替你開口，不用自己催。"}
};
var PHASES = [
  {k:"run",    zh:"① 跑通", line:"用兩個強項，拿到第一筆穩定成交"},
  {k:"opt",    zh:"② 優化", line:"補上第三塊，堵住漏水那格"},
  {k:"create", zh:"③ 創造", line:"練最後一塊，開第二條路徑"}
];
/* 人設：量過的維照分數排、沒量的墊後；量不滿兩維＝還沒有人設（誠實空狀態） */
function personaNow(){
  var d5 = calcDimScores5(S);
  var measured = DORD.filter(function(k){ return d5[k] != null; })
                     .sort(function(a,b){ return d5[b] - d5[a]; });
  if (measured.length < 2) return null;
  var rest = DORD.filter(function(k){ return measured.indexOf(k) < 0; });
  var order = measured.concat(rest);
  var top2 = order.slice(0, 2);
  var key = top2.slice().sort().join("");
  var p = PERSONAS[key] || PERSONAS.AT;
  var chain = order.map(function(k, i){
    var src = i < 2 ? ST_STRONG[k] : ST_WEAK[k];
    return { dim: k, strong: i < 2, short: src.short, tool: src.tool, role: src.role, note: src.note };
  });
  return { code: top2.join("+"), name: p.name, tag: p.tag, chain: chain, d5: d5, order: order };
}
/* 三狀態：有成交紀錄＝優化、還沒＝跑通；「創造」是教練拍板的事，系統不自動宣稱 */
function phaseNow(){ return (S.revenueLog || []).length ? "opt" : "run"; }

/* ── 薄片原語（同 member 的 slRow，只換預設色）── */
function slRow(items, opt){
  opt = opt || {};
  var vals = items.map(function(it){
    return '<span style="color:' + (it.state==="now" ? (PALV[it.dimKey]||{}).t || "#eaf1fa" : "#5d7692") + ';">' + (it.vTop||"") + '</span>';
  }).join("");
  var slices = items.map(function(it){
    var p = PALV[it.dimKey] || {c:"#5d7692",t:"#8ea1b6",tint:"rgba(125,144,163,.18)"};
    var cls = "sl " + it.state, sty = "height:" + it.h + "px;";
    if (it.state==="now") {
      if (it.dimKey==="I") cls += " gold";
      else sty += "background:" + p.c + ";box-shadow:0 0 14px " + p.c + "66;";
    } else if (it.state==="past") sty += "background:" + p.tint + ";";
    if (it.state==="todo" && it.hot) sty += "border-color:#C6603A;";
    return '<div class="' + cls + '" style="' + sty + '"' + (it.onclick ? ' onclick="' + it.onclick + '"' : '') + '></div>';
  }).join("");
  var lbls = items.map(function(it){
    var p = PALV[it.dimKey] || {};
    return '<span class="' + (it.state==="todo" ? "dim" : "") + '">'
      + (it.lbl2 ? '<i style="color:' + (it.state==="todo" ? "#5d7692" : p.t||"#8ea1b6") + ';">' + it.lbl2 + '</i>' : '')
      + it.lbl + '</span>';
  }).join("");
  /* 斜角呼吸位：skewX(-12deg) 會把最高那片的右上角往外推 h*tan12°，
     不留位子就會被切掉。從最高片自己算，別再一處一處補 padding-right。 */
  var gut = Math.ceil(Math.max.apply(null, items.map(function(it){ return it.h; })) * 0.2126);
  return '<div class="slw" style="--sg:' + gut + 'px;">'
    + (opt.vals ? '<div class="slv">' + vals + '</div>' : '')
    + '<div class="srow">' + slices + '</div>'
    + (opt.noLbl ? '' : '<div class="slbl">' + lbls + '</div>')
    + '</div>';
}

/* ── 客戶軌跡：一片＝一次出手（時間序），顏色＝用哪塊肌肉、高度＝他走到哪 ── */
var RUNH = {none:18, A:34, T:50, P:66, I:82};
function clientRun(name){
  return LOG.filter(function(e){ return e.target===name; });
}
function runRowHTML(name){
  var run = clientRun(name);
  var slices = run.map(function(e, i){

function clientHi(name){

function clientList(){

}
function weeksSpan(name){

function stallDays(name){

/* 引力場：圈層＝圈層階梯（越內圈越近）。每圈只掛最該動的 7 顆（卡住優先），其餘收進「+N」 */
var GRING = {none:{r:158,zh:"沒反應"}, A:{r:132,zh:"想靠近"}, T:{r:100,zh:"願意說"}, P:{r:68,zh:"要找你"}, I:{r:38,zh:"認定你"}};

  var rings = ["A","T","P","I"].map(function(k){
    var s = STAGES[stageIdx(k)], d = GRING[k].r * 2;
    return '<div class="gring" style="width:' + d + 'px;height:' + d + 'px;border-color:' + s.c + '66;">'
      + '<i style="color:' + s.t + ';">' + s.zh + '</i></div>';
  }).join("");
  var byRing = {none:[], A:[], T:[], P:[], I:[]};
  clientList().forEach(function(c){
    var hi = clientHi(c.name), s = STAGES[hi];
    var hiK = s.k, soft = SOFT_REL.indexOf(c.rel) > -1;
    if (soft && hi > 2) hiK = "T"; /* 家人朋友的引力停在「願意說」圈——踩煞車 */
    var stall = !soft && hi < 4 && stallDays(c.name) >= 14;
    byRing[hiK].push({name:c.name, hi:hi, s:s, stall:stall});
  });
  var CAP = 7, orbit = "";
  Object.keys(byRing).forEach(function(k){
    var arr = byRing[k];
    arr.sort(function(a,b){ return b.stall - a.stall; });
    var vis = arr.slice(0, CAP), more = arr.length - vis.length;
    var slots = vis.length + (more > 0 ? 1 : 0), r = GRING[k].r;
    vis.forEach(function(d, i){
      var a = (GSTART[k] + i * (360 / slots)) * Math.PI / 180;
      var x = Math.round(Math.cos(a) * r), y = Math.round(Math.sin(a) * r);
      var sty = 'left:calc(50% + ' + x + 'px);top:calc(50% + ' + y + 'px);'
        + (d.stall ? 'border-color:' + d.s.c + ';color:' + d.s.t + ';' : 'background:' + (d.hi===0 ? "#5d7692" : d.s.c) + ';');
      orbit += '<div class="gdot' + (d.stall ? " stall" : "") + '" style="' + sty + '" data-recfor="' + esc_(d.name) + '">' + esc_(d.name.slice(0,1)) + '</div>';
    });
    if (more > 0) {
      var a2 = (GSTART[k] + vis.length * (360 / slots)) * Math.PI / 180;
      var x2 = Math.round(Math.cos(a2) * r), y2 = Math.round(Math.sin(a2) * r);
      var cc = k==="none" ? "#5d7692" : STAGES[stageIdx(k)].c;

      orbit += '<div class="gmore" style="left:calc(50% + ' + x2 + 'px);top:calc(50% + ' + y2 + 'px);border-color:' + cc + '88;color:' + ct + ';">+' + more + '</div>';

    + '<div class="gfield">' + rings + '<div class="gme">你</div><div class="gorbit">' + orbit + '</div></div>'
    + '<div class="glegend">這張就是你的<b>燈塔</b>——他的水溫幾度、該養還是該收，看這裡（L7 整堂教你讀它）。越內圈＝離你越近、水溫越熱，位置只看他的<b>真實反應</b>。<b>虛線＝停超 14 天，水溫在涼</b>——卡住的優先掛出來，每圈最多 7 顆，其餘收進 <b>+N</b>；完整名單就在下面的客戶卡。點一個人，直接記下這一步。</div></div>';

  });
  var out = "";
  STAGES.slice(1).forEach(function(s){
    if (n[s.k]) out += '<span class="fbc" style="color:' + s.t + ';background:' + s.tint + ';">' + s.full + ' <b>×' + n[s.k] + '</b></span>';
  });
  return out || '<span class="fbc">這個維度還沒有人給過反應</span>';
}

/* ═══ render ═══ */
var ANIM = true; /* 進頁/切分頁時薄片從基線長上來一次；頁內重繪（點星圖等）不重播 */
function render(){
  el("joinday").textContent = S.lineId === "DEMO" ? "DEMO" : "第 " + daysSinceJoin(S) + " 天";
  var h = REC ? recHTML() : (PANE==="crm" ? crmHTML() : PANE==="out" ? outHTML() : mapHTML());
  el("bd").innerHTML = h;
  if (REC) bindRec();
  if (ANIM) {
    ANIM = false;
    document.querySelectorAll("#bd .sl").forEach(function(s){
      var hv = s.style.height;
      s.style.transition = "none"; s.style.height = "0px";
      void s.offsetHeight; /* 強制 reflow，讓 0→目標高吃到 .4s transition */
      s.style.transition = ""; s.style.height = hv;
    });
  }
  /* 名字是使用者資料——事件走 data 屬性綁，不進 inline onclick */
  document.querySelectorAll("#bd [data-recfor]").forEach(function(n){
    n.onclick = function(){ openRecFor(n.getAttribute("data-recfor")); };
  });
  var fr = el("firstRec"); if (fr) fr.onclick = openRec;
  var rf = el("recFocus"); if (rf) rf.onclick = openRec;
  document.querySelectorAll(".nv").forEach(function(b){
    b.className = "nv" + (b.getAttribute("data-pane")===PANE ? " on" : "");
    b.onclick = function(){
      REC = null; PANE = b.getAttribute("data-pane"); ANIM = true; window.scrollTo(0,0); render();
      track("screen_view", { screen: PANE, seat: "pro" });   // 切分頁不換網址，不自己發就看不到
    };
  });
}

/* ── demo 模式（?demo=1，跟 member/visitor 同慣例）：假資料全在前端、不寫 Sheet。

             dim: mk.charAt(0), muscle: mk, pts: 1, date: ago(i), week: weekStr(new Date(ago(i))),
             target: target, rel: rel, reaction: stage === "none" ? "沒特別" : "明顯有",
             note: note || "", stage: stage };

      ck("A1", 16, "周姐",   "客戶", "none", "只回「謝謝分享」"),
      ck("T2", 5,  "妹妹",   "家人", "T",    "她說了工作上的委屈"),
      ck("A2", 26, "陳老闆", "客戶", "A"),
      ck("T1", 22, "陳老闆", "客戶", "T"),
      ck("P1", 16, "陳老闆", "客戶", "P"),
      ck("I2", 9,  "陳老闆", "客戶", "I",    "當場簽了年約"),
      ck("I1", 20, "Amy",   "客戶", "I",    "介紹來的，一次就成")
    ],
    revenueLog: [
      { workshopId: PRO_WORKSHOPS[0], date: ago(9),  amount: 180000, note: "陳老闆・年約", A:0,T:0,P:0,I:0 },
      { workshopId: PRO_WORKSHOPS[0], date: ago(20), amount: 60000,  note: "Amy・介紹成交", A:0,T:0,P:0,I:0 }

    ]

async function boot() {
  var qs = new URLSearchParams(location.search);
  if (qs.get("demo") === "1") {
    postToSheet = function(){ return Promise.resolve(); };   // demo 不寫 Sheet
    TASKS = []; S = demoStatePro_(); WID = PRO_WORKSHOPS[0];
    LOG = buildLog();
    /* 截圖驗收捷徑（同 demo-pro-v5 慣例）：?rec=2&who=張總&stage=P／?selL=5／?drill=1 */
    if (qs.get("rec")) REC = { who: qs.get("who")||"張總", rel: qs.get("rel")||"客戶", stage: qs.get("stage"),
                               note: qs.get("note")||"", mile: qs.get("mile")==="1", step: +qs.get("rec"),
                               mk: qs.get("mk")||focusMuscle()||"A1" };
    if (qs.get("drill")) OPEN_DRILL = true;
    if (qs.get("selL")) SEL_L = +qs.get("selL");
    el("nav").classList.remove("hide");
    render();
    return;
  }
  /* 同 member.html：外部瀏覽器走「用 LINE 開啟」的橋，不推去打 LINE 密碼。 */
  var uid = await resolveLineId("bd");
  if (!uid) return;
  var d = await loadBootstrap(uid, "");
  if (!d) { el("bd").innerHTML = '<div class="loading">讀不到資料，請稍後再試。</div>'; return; }
  if (d.tasks) TASKS = d.tasks;
  if (d.workshops) WORKSHOPS = d.workshops;
  var st = d.student || {};
  S = { lineId: st.lineId || uid, name: st.name || "", team: st.team || "",
        checkinLog: d.checkins || [], revenueLog: d.revenue || [], evalLog: d.evals || [] };
  var enrolledPro = (d.enrollments || []).filter(function(e){ return e.lineId === S.lineId && PRO_WORKSHOPS.indexOf(e.workshopId) > -1; });
  WID = enrolledPro.length ? enrolledPro[0].workshopId : PRO_WORKSHOPS[0];
  LOG = buildLog();
  el("nav").classList.remove("hide");
  render();
  track("screen_view", { screen: PANE, seat: "pro" });
}
boot();
</script>
