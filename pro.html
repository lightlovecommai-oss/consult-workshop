<style>
/* ═══ 私教學員層・科技版 ═══
   只給 PRO_WORKSHOPS（超引力-顧問課／超引力-公眾演說）的新私教學員，另開一支檔案、
   不動 dashboard.html——天麗跟舊私教學員繼續看原本那支，一個像素都不動。
   視覺真相＝productkit 30-App介面規範：深底才准用科技霓虹四色（common.js 那組錯在暖底上，
   這裡是唯一「用對的」地方）。畫面結構真相＝「v3 館優先」設計稿的 renderPro()，
   但這裡全部換成真資料：12 小肌群讀 calcMuscleScores()、關係軌跡讀真的 e.reaction、
   成果讀 marketValidation()/revenueLog——設計稿裡都是示範資料。 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0c131e;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#eaf1fa;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:#0c131e;padding-bottom:84px;}

.tb{background:#131f2b;padding:16px 16px 13px;position:sticky;top:0;z-index:30;border-bottom:1px solid #2a3a4d;}
.tb-n{color:#eaf1fa;font-size:17px;font-weight:700;letter-spacing:.02em;}
.hall{font-size:11px;font-weight:600;color:#e8734a;border:1px solid rgba(232,115,74,.5);padding:2px 8px;border-radius:20px;margin-left:8px;white-space:nowrap;}
.tb-d{margin-left:auto;font-size:13px;color:#7d90a3;white-space:nowrap;}
.tb-r{display:flex;align-items:center;}
.tb-s{font-size:13px;color:#8ea1b6;margin-top:4px;}
.tb-sel{background:transparent;border:1px solid #2a3a4d;color:#eaf1fa;border-radius:20px;padding:6px 12px;font-size:13px;font-family:inherit;}

.bd{padding:16px;}
.cd{background:#131f2b;border-radius:20px;padding:18px 16px;margin-bottom:14px;}
.cw{background:#182634;border-radius:14px;padding:18px 16px;margin-bottom:14px;}
.pill{font-size:13px;font-weight:600;color:#e8734a;background:rgba(232,115,74,.14);padding:5px 12px;border-radius:20px;display:inline-block;}
.rule{height:1px;background:#2a3a4d;margin:16px 0;}

/* L1-L8 路徑 */
.lrow{display:flex;gap:4px;}
.lcell{flex:1;text-align:center;border-radius:9px;padding:10px 2px;}
.lcell-n{font-size:13px;font-weight:700;}
.lcell-l{font-size:13px;margin-top:4px;}

/* 關係軌跡 */
.pc-t{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.pc-n{font-size:15px;font-weight:700;color:#eaf1fa;}
.pc-tag{font-size:13px;color:#7d90a3;border:1px solid #2a3a4d;padding:2px 9px;border-radius:20px;}
.pc-src{margin-left:auto;font-size:13px;color:#7d90a3;}
.arc{display:flex;gap:2px;margin-bottom:10px;}
.node{flex:1;text-align:center;}
.dot{width:27px;height:27px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1px solid #2a3a4d;color:#7d90a3;}
.dot.on{border-color:transparent;color:#0c131e;}
.nl{font-size:13px;color:#7d90a3;}
.nl.on{color:#eaf1fa;}
/* 呼吸節點：DORD 順序下一個還沒點亮的維度，虛線邊＋維度色＋緩脈動 */
.dot.nx{border-style:dashed;animation:ndpulse 2s ease-in-out infinite;}
@keyframes ndpulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.arc-note{border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.75;background:rgba(234,241,250,.05);color:#8ea1b6;}
.arc-note.soft{background:rgba(51,196,149,.1);color:#33c495;}
.empty{font-size:13px;color:#7d90a3;line-height:1.85;text-align:center;padding:8px 4px;}

/* 12 小肌群 */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mc{background:#182634;border-radius:10px;padding:10px;}
.mc.none{opacity:.5;}
.mc-top{display:flex;align-items:baseline;gap:5px;margin-bottom:6px;}
.mc-k{font-size:13px;font-weight:700;}
.mc-n{font-size:13px;color:#eaf1fa;}
.mc-v{margin-left:auto;font-size:13px;font-weight:700;color:#eaf1fa;font-variant-numeric:tabular-nums;}
.mc-bar{height:3px;background:#2a3a4d;border-radius:2px;overflow:hidden;}

/* 口袋卡（L1-L4 打基礎的提示・回家演練） */
.pk-g{font-size:13px;font-weight:700;margin:14px 2px 6px;}
.pk-r{width:100%;display:flex;align-items:center;gap:8px;background:#182634;border:0;border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer;font-family:inherit;text-align:left;min-height:44px;color:#eaf1fa;}
.pk-code{font-size:13px;font-weight:700;flex-shrink:0;}
.pk-nm{font-size:15px;}
.pk-ar{margin-left:auto;font-size:13px;color:#7d90a3;}
.pk-bd{background:#182634;border-radius:0 0 10px 10px;margin:-10px 0 6px;padding:2px 12px 13px;}
.pk-lb{font-size:13px;color:#7d90a3;margin:11px 0 4px;}
.pk-w{font-size:13px;color:#8ea1b6;line-height:1.7;}
.pk-say{font-size:15px;color:#eaf1fa;line-height:1.9;}
.pk-say b{color:#e8734a;}
.pk-bl{display:inline-block;min-width:34px;border-bottom:1px solid #7d90a3;height:1em;vertical-align:baseline;}
.pk-exr{display:flex;gap:8px;font-size:13px;line-height:1.7;padding:3px 0;}
.pk-exk{flex-shrink:0;color:#7d90a3;}
.pk-exv{color:#8ea1b6;}

/* 成果 */
.stat-row{display:flex;align-items:baseline;gap:10px;background:#182634;border-radius:12px;padding:13px;margin-bottom:8px;}
.stat-l{font-size:13px;color:#7d90a3;margin-bottom:4px;}
.stat-v{font-size:22px;font-weight:700;color:#e8734a;line-height:1;font-variant-numeric:tabular-nums;}
.stat-r{margin-left:auto;font-size:13px;color:#7d90a3;text-align:right;line-height:1.5;}

/* 練習（低摩擦記錄流程，跟會員層同一招，這裡是私教學員唯一會產生對方反應資料的地方） */
.mv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #2a3a4d;}
.mv:first-child{border-top:0;}
.mv-ic{width:32px;height:32px;border-radius:10px;background:#0f1a25;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.mv-n{font-size:15px;color:#eaf1fa;}
.mv-s{font-size:13px;color:#7d90a3;margin-top:2px;}
.mv-b{margin-left:auto;background:#e8734a;color:#0c131e;font-size:13px;font-weight:700;padding:8px 15px;border-radius:20px;border:0;cursor:pointer;flex-shrink:0;font-family:inherit;min-height:40px;}

.rec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rec-bk{background:none;border:0;color:#8ea1b6;font-size:22px;cursor:pointer;padding:0 4px 0 0;line-height:1;font-family:inherit;min-height:44px;}
.rec-n{font-size:15px;font-weight:700;color:#eaf1fa;}
.rec-m{font-size:13px;color:#8ea1b6;margin-top:2px;}
.how{background:#131f2b;border-radius:14px;padding:13px 14px;margin-bottom:14px;font-size:15px;color:#eaf1fa;line-height:1.9;}
.how b{color:#e8734a;}
.q{font-size:15px;font-weight:700;color:#eaf1fa;margin-bottom:11px;}
.qs{font-size:13px;color:#7d90a3;font-weight:400;margin-left:6px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.op{font-size:13px;padding:11px 16px;border-radius:20px;border:1px solid #2a3a4d;background:#131f2b;color:#eaf1fa;cursor:pointer;font-family:inherit;min-height:44px;}
.op.on{background:#e8734a;border-color:#e8734a;color:#0c131e;font-weight:600;}
.op.warm{background:#182634;}
.op.new{color:#7d90a3;border-style:dashed;}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bo{padding:15px 10px;border-radius:14px;border:1px solid #2a3a4d;background:#131f2b;cursor:pointer;text-align:center;font-family:inherit;min-height:44px;}
.bo.on{border-color:#e8734a;background:rgba(232,115,74,.14);}
.bo-e{font-size:22px;line-height:1;margin-bottom:5px;}
.bo-t{font-size:13px;color:#eaf1fa;}
.opt-wrap{margin-top:15px;border-top:1px solid #2a3a4d;padding-top:14px;}
.opt-l{font-size:13px;font-weight:700;color:#eaf1fa;margin-bottom:4px;}
.opt-h{font-size:13px;color:#7d90a3;margin-bottom:9px;line-height:1.7;}
.ta{width:100%;background:#131f2b;border:1px solid #2a3a4d;border-radius:14px;padding:11px;font-size:17px;color:#eaf1fa;font-family:inherit;line-height:1.6;min-height:64px;resize:vertical;}
.ta:focus{outline:none;border-color:#e8734a;}
.sub{width:100%;background:#e8734a;color:#0c131e;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:15px;font-family:inherit;min-height:44px;}
.sub[disabled]{background:#2a3a4d;color:#7d90a3;}
.ok{text-align:center;padding:10px 0 4px;}
.ok-e{font-size:32px;margin-bottom:14px;}
.ok-t{font-size:28px;color:#eaf1fa;margin-bottom:12px;line-height:1.4;}
.ok-s{font-size:13px;color:#8ea1b6;line-height:1.95;}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;background:#131f2b;border-top:1px solid #2a3a4d;display:flex;padding:8px 0 max(11px,env(safe-area-inset-bottom));}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:#7d90a3;background:none;border:0;cursor:pointer;padding:5px 0;font-family:inherit;min-height:44px;}
.nv.on{color:#e8734a;}
.nv-i{height:22px;display:flex;align-items:center;justify-content:center;}
.nv-i svg{display:block;}
.hide{display:none;}
.loading{text-align:center;padding:56px 20px;color:#8ea1b6;font-size:15px;}
.spin{width:30px;height:30px;border:3px solid #2a3a4d;border-top-color:#e8734a;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg);}}
:focus-visible{outline:2px solid #e8734a;outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<body>
<div class="app">
  <div class="tb">
    <div class="tb-r">
      <div class="tb-n">超引力成交學</div>
      <span class="hall">私人教練席</span>
      <div class="tb-d" id="joinday">—</div>
    </div>
    <div class="tb-s" id="wssub">超引力成交學 · L1–L8</div>
  </div>
  <div class="bd" id="bd">
    <div class="loading"><div class="spin"></div>載入你的體格…</div>
  </div>
</div>

<div class="nav hide" id="nav">
  <button class="nv on" data-p="path" onclick="go('path')"><span class="nv-i"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4.5" cy="19" r="1.7" fill="currentColor" stroke="none"/><path d="M7 19h6a3.5 3.5 0 0 0 0-7h-2a3.5 3.5 0 0 1 0-7h6"/><circle cx="19.5" cy="5" r="1.7" fill="currentColor" stroke="none"/></svg></span>軌跡</button>
  <button class="nv" data-p="body" onclick="go('body')"><span class="nv-i"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 19.5v-5.5M9.2 19.5v-9M14.8 19.5v-6.5M20.5 19.5v-12"/></svg></span>體格</button>
  <button class="nv" data-p="out" onclick="go('out')"><span class="nv-i"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span>覆盤</button>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="atpi-core.js"></script>
<script src="common.js"></script>
<script src="judgement.js"></script>
<script src="pocket-cards.js"></script>
<script>
/* ═══ 私教學員層（科技版）══
   跟會員層(member.html)一樣用低摩擦兩下記錄（對誰／反應），差在這裡 12 格全開、
   照上升空間最大的練，不是只練一塊。ATPI 是人的屬性不分 workshop，體格/關係軌跡讀全域資料；
   只有「路徑」的 L1-L8 進度是照這支課程（超引力-顧問課／超引力-公眾演說）算。 */
var PRO_WORKSHOPS = ["超引力-顧問課", "超引力-公眾演說"];
var S = null, WID = null, PANE = "path";
var REC = null;

var REACT = [
  {e:"😌", t:"沒特別", v:0}, {e:"🙂", t:"有一點", v:1},
  {e:"😃", t:"明顯有", v:2}, {e:"🤩", t:"超乎預期", v:3}
];
var REL = ["工作", "客戶", "家人", "朋友"];
var SOFT_REL = ["家人", "朋友"];
var TDIM = {A:"#e8734a", T:"#33c495", P:"#4b9bf0", I:"#e6a93a"};

function el(id){ return document.getElementById(id); }
function esc_(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function md_(t){ return esc_(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }

async function boot() {
  var qs = new URLSearchParams(location.search);
  var uid = qs.get("id");
  if (!uid) {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      uid = (await liff.getProfile()).userId;
    } catch (e) {
      el("bd").innerHTML = '<div class="loading">請從 LINE 進入，或在網址加上 ?id=你的 LINE userId</div>';
      return;
    }
  }
  var d = await loadBootstrap(uid, "");
  if (!d) { el("bd").innerHTML = '<div class="loading">讀不到資料，請稍後再試。</div>'; return; }
  if (d.tasks) TASKS = d.tasks;
  if (d.workshops) WORKSHOPS = d.workshops;
  var st = d.student || {};
  S = { lineId: st.lineId || uid, name: st.name || "", team: st.team || "",
        checkinLog: d.checkins || [], revenueLog: d.revenue || [], evalLog: d.evals || [] };
  var enrolledPro = (d.enrollments || []).filter(function(e){ return e.lineId === S.lineId && PRO_WORKSHOPS.indexOf(e.workshopId) > -1; });
  WID = enrolledPro.length ? enrolledPro[0].workshopId : PRO_WORKSHOPS[0];
  el("nav").classList.remove("hide");
  render();
}

function go(p){ PANE = p; REC = null;
  Array.prototype.forEach.call(document.querySelectorAll(".nv"), function(b){ b.classList.toggle("on", b.getAttribute("data-p") === p); });
  window.scrollTo(0, 0); render();
}
function render(){
  el("joinday").textContent = "第 " + daysSinceJoin(S) + " 天";
  el("wssub").textContent = (WID || "超引力成交學") + " · L1–L8";
  if (REC) { el("bd").innerHTML = recHTML(); bindRec(); return; }
  var h = PANE === "path" ? pathHTML() : PANE === "body" ? bodyHTML() : outHTML();
  el("bd").innerHTML = h;
  bindPane();
}

/* ══ 路徑：兩門課的 L 結構完全不同，真相＝productkit 15-課程梳理-L1-L12對到大包裝.md ══
   超引力-顧問課＝鍛鍊段L1-L4(一課一塊肌肉：L1吸引/L2信任/L3專業/L4推進) ＋
                  放大段L5-L8(L5顧問腳本1v1四幕／L6甜蜜路徑／L7導航北極星+燈塔／L8副作用+升單鉤子)。
   超引力-公眾演說＝演說段L9-L13(L9吸引+信任開場／L10專業體驗感／L11推進收單／
                  L12三種銷講稿·待老師拍板／L13大師之路+畢業考核)。
   L1-L4 用真資料算 done/now/lock（該維3個小肌群都量過才算過關）；L5-L8 沒有可拆解成
   小肌群的真資料，L1-4 全過才整塊解鎖，不假裝有細部進度。公眾演說段完全沒有逐字稿可
   對照，只列真的 L 名稱跟段落說明，不假裝算得出進度。 */
function levelState(){
  var scores = calcMuscleScores(S);
  var order = [["L1","A","吸引"], ["L2","T","信任"], ["L3","P","專業"], ["L4","I","推進"]];
  var doneIdx = -1, nowIdx = -1;
  order.forEach(function(l, i){
    var allMeasured = musclesOfDim(l[1]).every(function(mk){ return scores[mk] != null; });
    if (allMeasured && nowIdx < 0) doneIdx = i;
    else if (nowIdx < 0) nowIdx = i;
  });
  if (nowIdx < 0) nowIdx = order.length;
  var lv = order.map(function(l, i){ return { k: l[0], dim: l[1], name: l[2], state: i <= doneIdx ? "done" : i === nowIdx ? "now" : "lock" }; });
  var advanced = [["L5","顧問腳本"], ["L6","甜蜜路徑"], ["L7","導航"], ["L8","副作用"]];
  var advState = doneIdx >= 3 ? "now" : "lock";
  advanced.forEach(function(a){ lv.push({ k: a[0], dim: null, name: a[1], state: advState }); });
  return lv;
}
/* 公眾演說段（L9-L13）沒有逐字稿可對照真進度，只列真的段落結構跟一句話說明，
   狀態一律「lock」（誠實：算不出進度就不要裝）。 */
function speechLevelState(){
  return [
    { k:"L9",  name:"開場",     desc:"A吸引＋T信任・銷講開場",         state:"lock" },
    { k:"L10", name:"體驗感",   desc:"P專業・讓乾貨有體驗感",           state:"lock" },
    { k:"L11", name:"收單",     desc:"I推進・銷講收單",                state:"lock" },
    { k:"L12", name:"三種稿",   desc:"30秒／5分／1.5小時銷講稿（待老師拍板）", state:"lock" },
    { k:"L13", name:"大師之路", desc:"畢業考核",                       state:"lock" }
  ];
}
/* 軌跡分頁＝關係軌跡（第一位）＋每週覆盤演練卡；課表降級搬去「覆盤」分頁。
   練習卡由底下的 pathHTML wrapper 接在最後（CTA 下移）。 */
function weeklyReviewCard(){
  var topic;
  if (WID === "超引力-公眾演說") {
    topic = "這週拆解：跟教練現場定";
  } else {
    var lv = levelState(), now = null;
    for (var i = 0; i < lv.length; i++) { if (lv[i].state === "now") { now = lv[i]; break; } }
    topic = now ? "這週拆解：" + now.k + " " + now.name : "這週拆解：跟教練現場定";
  }
  return '<div class="cd"><div class="pill" style="margin-bottom:12px;">每週覆盤演練</div>'

    var recents = recentTargets();
    h += '<div class="q">對誰？<span class="qs">點一下就好</span></div><div class="opts">'
      + recents.map(function(p){ return '<button class="op' + (REC.who === p.name ? " on" : "") + '" data-who="' + esc_(p.name) + '" data-rel="' + esc_(p.rel) + '">' + esc_(p.name) + '</button>'; }).join("")
      + '<button class="op warm" data-who="陌生人" data-rel="陌生人">陌生人</button>'
      + '<button class="op new" data-newwho="1">＋ 新的人</button></div>';
    if (REC.newRel) {
      h += '<div class="opt-wrap"><div class="opt-l">' + esc_(REC.who) + ' 是？<span class="qs">問這一次就好</span></div>'
        + '<div class="opts">' + REL.map(function(r){ return '<button class="op" data-newrel="' + esc_(r) + '">' + esc_(r) + '</button>'; }).join("") + '</div></div>';
    }
  } else {
    h += '<div class="q">對方有反應嗎？<span class="qs">點一下就好</span></div><div class="big">'
      + REACT.map(function(r){ return '<button class="bo' + (REC.react === r.v ? " on" : "") + '" data-react="' + r.v + '"><div class="bo-e">' + r.e + '</div><div class="bo-t">' + r.t + '</div></button>'; }).join("") + '</div>';
    if (REC.react >= 2) {
      h += '<div class="opt-wrap"><div class="opt-l">發生什麼？<span class="qs">選填</span></div>'
        + '<textarea class="ta" id="recnote" placeholder="他停了一下，開始講他自己的狀況"></textarea></div>';
    }
    h += '<button class="sub" id="recdone"' + (REC.react == null ? " disabled" : "") + '>' + (REC.react == null ? "先選一個" : "記下來") + '</button>';
  }
  return h + '</div>';
}
function bindRec(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-who]"), function(b){
    b.onclick = function(){ REC.who = b.getAttribute("data-who"); REC.rel = b.getAttribute("data-rel") || ""; REC.newRel = false; REC.step = 2; render(); };
  });
  var nw = document.querySelector("[data-newwho]");
  if (nw) nw.onclick = function(){ var n = prompt("這個人怎麼稱呼？（只有你看得到）"); if (n && n.trim()) { REC.who = n.trim().slice(0, 12); REC.newRel = true; render(); } };
  Array.prototype.forEach.call(document.querySelectorAll("[data-newrel]"), function(b){
    b.onclick = function(){ REC.rel = b.getAttribute("data-newrel"); REC.newRel = false; REC.step = 2; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-react]"), function(b){
    b.onclick = function(){ REC.react = Number(b.getAttribute("data-react")); render(); };
  });
  var dn = el("recdone");
  if (dn) dn.onclick = function(){
    var note = (el("recnote") || {}).value || "";
    var r = REACT.find(function(x){ return x.v === REC.react; }) || REACT[0];
    doCheckin(S, REC.task, REC.task.workshopId || WID || "", { reaction: r.t, target: REC.who || "", rel: REC.rel || "", note: note.trim() });
    REC.step = 3; render();
  };
}
function closeRec(){ REC = null; render(); }
function bindPane(){
  var pool = practicePool(), mk = focusMuscle(), m = MUSCLES[mk];
  var box = document.getElementById("practiceBox");
  if (box) box.onclick = openRec;
}

/* 軌跡頁最底下接一張「今天練這塊」卡（CTA 下移），串進低摩擦記錄流程 */
var _pathHTML = pathHTML;
pathHTML = function(){
  var mk = focusMuscle(), m = MUSCLES[mk], j = JUDGEMENT[mk] || {};
  var isWeakest = weakestMuscles(calcMuscleScores(S), 1).indexOf(mk) > -1;
  var practiceCard = '<div class="cw" id="practiceBox" style="cursor:pointer;">'
    + '<div style="display:flex;align-items:center;gap:9px;"><span class="pill">今天練這塊</span>'
    + '<span style="margin-left:auto;font-size:13px;color:#7d90a3;">' + (isWeakest ? "這季主力" : "") + '</span></div>'
    + '<div style="font-size:22px;font-weight:600;color:#eaf1fa;margin-top:10px;">' + esc_(m.name) + '</div>'
    + '<div style="font-size:15px;color:#8ea1b6;margin-top:8px;line-height:1.9;">' + esc_((j.homework || "").replace(/\*\*/g, "")) + '</div>'
    + '<button class="sub">練溝通</button></div>';
  return _pathHTML() + practiceCard;
};

boot();
</script>
