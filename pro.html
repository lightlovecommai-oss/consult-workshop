<style>
/* ⟦視覺tokens⟧ 由 productkit/_tools/gen_視覺tokens_css.py 產生，請勿手改——改值去 3-教材/_圖產生器/視覺tokens.json */
:root {
  --skew: -12deg;          /* 樞紐釘基線 50% 100%，一張圖裡所有片同角同軸 */
  --slice-r: 9px;
  /* 三態沒有任何一態是實色——紅線：I 原版金不鋪大面積、一張圖實色最多兩片 */
  --slice-now: .2;        /* 現在這站，另加深版描邊 */
  --slice-now-w: 3.5px;
  --slice-now-lift: 1.16;
  --slice-done: .5;       /* 走過了 */
  --slice-todo-w: 2.5px;    /* 還沒到＝虛線 */
  --slice-todo-a: .35;
  --slice-todo-dash: 8px 8px;
  --slice-base: .13;       /* 退場＝灰階打底，不准改虛線（虛線已經是「還沒到」）*/
}
/* ⟦/視覺tokens⟧ */
/* ═══ 私人教練席 v5・三分頁版（2026-09-14 demo-pro-v5 驗過轉正）═══
   三分頁：①客戶管理＝引力場＋客戶卡（排序＝今天該動誰）＋COACH SIGNAL＋這週議程
   ②課程地圖＝甜蜜路徑（最強兩維定人設×三狀態定下一步）＋這季主力＋課程星圖＋演說段
   ③市場數字＝三個數字＋肌肉牆＋改觀句金庫（只收客戶原話，見證不代擬的制度版）
   打卡標準＝「這個客戶走到哪」（圈層 none/A/T/P/I）；舊紀錄沒有 stage 欄，
   用 entryStage() 從 reaction 推回（沒特別/空→none，其餘→那塊肌肉的維度）。
   資料全真：分數讀 calcMuscleScores/calcDimScores5、軌跡讀 checkinLog、金額讀 revenueLog；
   demo（?demo=1）才用示意資料。圈層用語拍板版：沒反應→想靠近→願意說→要找你→認定你。 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0c131e;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#eaf1fa;-webkit-font-smoothing:antialiased;}
/* 席位色：金＝我在私教席（骨架、數字、強調字），行動色橘只留給「要按的」。
   變數名跟 member／visitor 同一套（會員藍／體驗綠／私教金）。 */
body{--sd:#e6a93a;--st:rgba(230,169,58,.14);}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:84px;}

/* 席位橫幅（pro＝咖啡金識別＋掃描線） */
.tb{background:linear-gradient(135deg,#4A1B0C,#6B3018);padding:16px 20px 14px;position:relative;overflow:hidden;}
.tb:after{content:"";position:absolute;left:0;right:0;top:0;height:1.5px;background:linear-gradient(90deg,transparent,#E8C89A,transparent);animation:scan 3.2s ease-in-out infinite;}
@keyframes scan{0%{top:0;opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{top:100%;opacity:0;}}
.tb-k{display:flex;align-items:center;font-size:11px;letter-spacing:3px;font-weight:700;color:#E8C89A;}
.tb-d{margin-left:auto;font-size:12px;color:rgba(247,241,236,.6);letter-spacing:.5px;}
.tb-r{display:flex;align-items:center;gap:10px;margin-top:9px;}
.tb-n{font-size:19px;font-weight:900;color:#F7F1EC;}
.tb-s{font-size:12.5px;color:rgba(247,241,236,.65);margin-top:5px;}
.hall{font-size:12px;font-weight:700;color:#E8C89A;background:rgba(232,200,154,.12);border:1px solid rgba(232,200,154,.45);padding:3px 10px;border-radius:20px;margin-left:auto;white-space:nowrap;}
.aa-btn{margin-left:10px;font-size:13px;font-weight:800;letter-spacing:0;color:#E8C89A;background:rgba(232,200,154,.12);border:1px solid rgba(232,200,154,.45);border-radius:14px;padding:3px 10px;cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap;position:relative;z-index:1;}

.bd{padding:20px 20px 16px;}
.cd{background:#131f2b;border:1px solid #1d2c3c;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.28);}
.hero{background:linear-gradient(160deg,#0c131e 0%,#152233 100%);border:1px solid rgba(75,155,240,.25);border-radius:18px;padding:20px 18px 18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(12,19,30,.45);}
.sec{font-size:12px;font-weight:700;color:#8ea1b6;letter-spacing:2px;margin:0 0 12px;}
.sec b{color:#eaf1fa;font-size:13px;letter-spacing:1px;}
.kick{display:flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:2px;color:#E8C89A;margin-bottom:8px;}
.big-t{font-size:22px;font-weight:900;line-height:1.5;color:#F7F1EC;}
.big-t em{font-style:normal;color:var(--sd);text-shadow:0 0 12px rgba(230,169,58,.45);}
.sub-t{font-size:15px;color:#8ea1b6;margin-top:7px;line-height:1.85;}
.sub-t b{color:#cfdcea;}
.rule4{height:2px;background:linear-gradient(90deg,#e8734a,#33c495,#4b9bf0,#e6a93a);box-shadow:0 0 8px rgba(232,115,74,.35);border-radius:2px;margin-top:16px;}

/* ═ 薄片原語・科技版：形狀跟 member/visitor 完全同（同一個 --skew、基線共軸、三態），
   只換色——實色＝霓虹＋發光、淡填＝霓虹 22% 透明、虛線＝深藍灰。
   I 金紅線的深底落法：不鋪實，改 18% 金底＋實線金描邊＋發光。 ═ */
.slw{--sg:0px;}
.srow{display:flex;align-items:flex-end;gap:7px;border-bottom:2px solid rgba(234,241,250,.20);padding:6px calc(4px + var(--sg,0px)) 0 4px;}
.sl{flex:1;border-radius:6px 6px 0 0;transform:skewX(var(--skew));transform-origin:50% 100%;position:relative;transition:height .4s cubic-bezier(.4,0,.2,1);}
/* 滿格軌（2026-09-15）：只有 MUSCLE MAP 那兩排會傳 full——那兩排才有「滿格」這件事。
   科技底是深色，軌要用亮色壓一層，暖版那邊的墨色在這裡看不見。 */
.sl::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fh,0px);background:rgba(234,241,250,.07);border-radius:6px 6px 0 0;z-index:-1;}
.sl.todo{background:transparent!important;border:1.5px dashed #526c88;border-bottom:0;}
.sl.sel{outline:2px solid #E8C89A;outline-offset:2px;animation:selpop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes selpop{0%{transform:skewX(var(--skew)) scale(.92);}60%{transform:skewX(var(--skew)) scale(1.08);}100%{transform:skewX(var(--skew)) scale(1);}}
.sl.now.gold{background:rgba(230,169,58,.18)!important;border:2px solid #e6a93a;border-bottom:0;box-shadow:0 0 14px rgba(230,169,58,.45);}
.slbl{display:flex;gap:7px;padding:7px calc(4px + var(--sg,0px)) 0 4px;}
.slbl span{flex:1;text-align:center;font-size:12px;font-weight:700;color:#cfdcea;line-height:1.45;}
.slbl span i{display:block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:1px;}
.slbl span.dim{color:#5d7692;font-weight:600;}
.slv{display:flex;gap:7px;padding:0 calc(4px + var(--sg,0px)) 0 4px;}
.slv span{flex:1;text-align:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}

/* 客戶卡（CRM 主角）：一張卡＝一個人的軌跡。
   run 列＝出手順序：顏色＝用哪塊肌肉、高度＝他走到哪；最後一片實色發光。
   右內距 30px＝斜切呼吸位（最高 82px × tan12° ≈ 17px）。 */
.cl{background:#131f2b;border:1px solid #1d2c3c;border-radius:18px;padding:16px 30px 14px 16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;}
.cl:active{box-shadow:0 2px 8px rgba(0,0,0,.35);}
.cl-hd{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.cl-av{width:38px;height:38px;border-radius:50%;color:#0c131e;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.cl-n{font-size:16px;font-weight:800;color:#F7F1EC;}
.cl-m{font-size:12.5px;color:#7d90a3;margin-top:2px;}
.cl-st{margin-left:auto;font-size:12px;font-weight:800;padding:4px 11px;border-radius:20px;flex-shrink:0;}
.runrow{border-bottom:2px solid rgba(234,241,250,.20);display:flex;align-items:flex-end;gap:6px;padding:8px 2px 0;overflow-x:auto;}
.runrow .sl{flex:0 0 42px;}
.runlbl{display:flex;gap:6px;padding:6px 2px 0;overflow-x:auto;}
.runlbl span{flex:0 0 42px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#5d7692;}
/* 教練判讀＝pro 的產品，長在每張卡上 */
.read{display:flex;gap:9px;margin-top:12px;border-top:1px dashed rgba(93,118,146,.35);padding-top:11px;font-size:13.5px;line-height:1.8;color:#cfdcea;}
.read .cv{width:24px;height:24px;border-radius:50%;background:rgba(232,200,154,.15);border:1px solid rgba(232,200,154,.5);color:#E8C89A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px;}
.read b{color:#e6a93a;}
.cl-go{margin-top:10px;text-align:right;font-size:13px;font-weight:800;color:#E8C89A;}
/* 分組標題：卡片只開四張，標題就是「為什麼今天是這張」。顏色只上在這裡，卡片裡一片不動 */
.cl-grp{font-size:12.5px;font-weight:800;letter-spacing:1.5px;margin:20px 0 9px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px;}
.cl-grp i{font-style:normal;font-size:11.5px;font-weight:600;color:#7d90a3;letter-spacing:0;}
/* 其餘的人收起來——不是不重要，是今天不用動他。完整名單在上面的引力場 */
.cl-more{display:block;width:100%;background:transparent;border:1px dashed #2a3c50;border-radius:14px;color:#8ea1b6;font-size:13.5px;font-weight:700;padding:14px;cursor:pointer;font-family:inherit;min-height:44px;margin-bottom:12px;}
.cl-more:active{transform:scale(.99);}

/* 教練在場條 */
.coach{display:flex;align-items:center;gap:10px;background:rgba(12,19,30,.5);border:1px solid rgba(232,200,154,.25);border-radius:14px;padding:11px 13px;margin-bottom:14px;}
.coach-av{width:34px;height:34px;border-radius:50%;background:rgba(232,200,154,.15);border:1px solid rgba(232,200,154,.5);color:#E8C89A;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.coach-n{font-size:13.5px;font-weight:700;color:#F7F1EC;}
.coach-s{font-size:11.5px;color:rgba(247,241,236,.55);margin-top:1px;}
.coach-nx{margin-left:auto;text-align:right;font-size:11px;color:rgba(247,241,236,.55);line-height:1.6;flex-shrink:0;text-decoration:none;}
.coach-nx b{display:block;font-size:12.5px;color:#E8C89A;}

/* 席位路徑（全貌感常駐）：pro＝最後一站，CTA 換成骨層句不是升級 */
.seatpath{background:transparent;border:1.5px solid rgba(232,200,154,.5);border-radius:16px;padding:13px 14px 12px;margin:18px 0 4px;}
.sp-cta{margin-top:10px;border-top:1px dashed rgba(232,200,154,.35);padding-top:10px;text-align:center;font-size:13.5px;font-weight:700;color:#E8C89A;line-height:1.7;}
.sp-row{display:flex;align-items:flex-end;gap:6px;border-bottom:2px solid rgba(234,241,250,.20);padding:2px 2px 0;}
.sp{border-radius:5px 5px 0 0;transform:skewX(var(--skew));transform-origin:50% 100%;}
.sp.past{background:rgba(51,196,149,.22);}
.sp.past.p2{background:rgba(75,155,240,.22);}
.sp.now{background:rgba(230,169,58,.18);border:2px solid #e6a93a;border-bottom:0;box-shadow:0 0 14px rgba(230,169,58,.45);}
.sp-lbl{display:flex;gap:6px;padding:6px 2px 0;font-size:11.5px;font-weight:700;}
.sp-goal{flex:1.6;align-self:center;font-size:12px;color:#8ea1b6;line-height:1.6;padding:0 2px 4px 8px;}
.sp-goal b{color:#E8C89A;}
.sp-here{font-size:10px;font-weight:800;letter-spacing:.5px;color:#e6a93a;white-space:nowrap;}

/* 主行動鈕（CTA 三層：練習鈕＝磚橘柔漸層，深底照樣成立） */
.gobtn{display:block;width:100%;background:linear-gradient(135deg,#C6603A 0%,#AF5433 100%);box-shadow:0 4px 12px rgba(198,96,58,.30);color:#fff;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:700;text-align:center;cursor:pointer;font-family:inherit;min-height:56px;margin-top:18px;}
.gobtn:active{transform:scale(.98);}
.howq{margin-top:14px;background:rgba(230,237,245,.06);border-left:3px solid var(--sd);border-radius:0 12px 12px 0;padding:12px 14px;}
.howq-k{font-size:12px;color:#7d90a3;margin-bottom:5px;}
.howq-t{font-size:15px;line-height:1.8;color:#cfdcea;}
.howq-t b{color:#e6a93a;}
.drill-tg{width:100%;background:none;border:0;color:#E8C89A;font-weight:700;font-size:13.5px;padding:12px 0 2px;cursor:pointer;font-family:inherit;min-height:44px;text-align:center;}
/* 練習鈕＝柔漸層（CTA 三層：錢鈕漸層一頁一顆／練習柔漸層）。
   這頁的錢鈕讓給最下面的升單卡，「記下反應」是練習動作不是掏錢。 */
.softbtn{display:block;width:100%;background:rgba(232,200,154,.12);border:1px solid rgba(232,200,154,.45);border-radius:16px;color:#E8C89A;font-size:16px;font-weight:800;padding:16px;text-align:center;cursor:pointer;font-family:inherit;min-height:56px;margin-top:18px;}
.softbtn:active{transform:scale(.98);}
/* 小肌肉切換：12 塊自己挑要練哪塊。系統推薦的那顆掛一點，不是幫你決定 */
.mkpick{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 2px;}
.mkp{font-family:inherit;font-size:12.5px;font-weight:800;border-radius:9px;padding:7px 10px;min-height:32px;cursor:pointer;background:transparent;border:1px solid #2a3c50;color:#8ea1b6;letter-spacing:.5px;}
.mkp.rec::after{content:"●";font-size:7px;vertical-align:super;margin-left:3px;}
/* 這塊肌肉在客戶身上留下什麼——邊練邊長出來的數字 */
.fstat{display:flex;gap:8px;margin-top:12px;}
.fstat>div{flex:1;background:rgba(230,237,245,.05);border:1px solid #1d2c3c;border-radius:12px;padding:10px 8px;text-align:center;}
.fstat b{display:block;font-size:21px;font-weight:900;color:#eaf1fa;font-variant-numeric:tabular-nums;line-height:1.2;}
.fstat i{font-style:normal;font-size:11px;color:#7d90a3;font-weight:600;}
.fwho{font-size:12.5px;color:#7d90a3;margin-top:9px;line-height:1.7;}
.fwho b{color:#cfdcea;font-weight:700;}

/* 課綱三行：八堂都看得到（全貌感），鎖住的只有教材跟作業 */
.olt{font-size:19px;font-weight:900;line-height:1.5;margin-top:12px;color:#F7F1EC;}
.ol{margin-top:11px;}
.ol div{display:flex;gap:9px;font-size:13.5px;line-height:1.8;color:#cfdcea;padding:5px 0;border-top:1px solid #1d2c3c;}
.ol div:first-child{border-top:0;}
.ol i{font-style:normal;flex:0 0 76px;color:#7d90a3;font-size:12px;font-weight:700;padding-top:2px;}
.mk{display:inline-block;font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 7px;margin:2px 4px 2px 0;border:1px solid;}
.mats{display:flex;gap:7px;margin-top:12px;}
.mat{flex:1;text-align:center;font-size:11.5px;font-weight:700;border-radius:11px;padding:9px 4px;border:1px solid #1d2c3c;background:rgba(230,237,245,.04);color:#7d90a3;line-height:1.55;text-decoration:none;display:block;}
.mat.on{color:#cfdcea;border-color:#2a3c50;}
.mat b{display:block;font-size:15px;margin-bottom:2px;}
/* 學習單抽屜 */
.ov{position:fixed;inset:0;background:rgba(6,10,16,.74);display:none;align-items:flex-end;justify-content:center;z-index:120;padding:14px;}
.ov.on{display:flex;}
.sheet{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:#101b26;border:1px solid #2a3c50;border-radius:20px;padding:18px 16px 22px;}
.sh-top{display:flex;align-items:flex-start;gap:10px;}
.sh-t{font-size:18px;font-weight:900;line-height:1.5;flex:1;}
.sh-x{background:transparent;border:0;color:#7d90a3;font-size:22px;cursor:pointer;font-family:inherit;padding:0 4px;line-height:1;min-height:44px;min-width:44px;}
.sh-m{font-size:12.5px;color:#7d90a3;margin-top:5px;line-height:1.7;}
.hw{margin-top:16px;}
.hw-l{font-size:14px;font-weight:800;color:#E8C89A;margin-bottom:5px;}
.hw-h{font-size:12.5px;color:#7d90a3;line-height:1.75;margin-bottom:7px;}
.hw textarea,.hw input[type=text]{width:100%;background:#0c131e;border:1px solid #2a3c50;border-radius:12px;color:#eaf1fa;font-family:inherit;font-size:16px;padding:11px;line-height:1.75;resize:vertical;}
.hw textarea{min-height:92px;}
.hw-c{font-size:12px;color:#7d90a3;text-align:right;margin-top:4px;font-variant-numeric:tabular-nums;}
.hw-c.ok{color:#33c495;}
.q3box{background:rgba(230,237,245,.05);border-left:3px solid #4b9bf0;border-radius:0 12px 12px 0;padding:12px 13px;font-size:13.5px;line-height:1.9;color:#cfdcea;white-space:pre-wrap;margin-bottom:9px;}
.hw-msg{font-size:13.5px;text-align:center;margin-top:10px;min-height:19px;}

.drill{margin-top:8px;border-top:1px dashed rgba(93,118,146,.35);}
.dr{padding:10px 2px 9px;border-bottom:1px dashed rgba(93,118,146,.25);}
.dr:last-child{border-bottom:0;}
.dr-k{font-size:11.5px;color:#7d90a3;font-weight:700;letter-spacing:1.5px;margin-bottom:3px;}
.dr-v{font-size:14px;line-height:1.85;color:#cfdcea;}
.dr-v b{color:var(--sd);}
.pk-say{font-size:14px;color:#cfdcea;line-height:1.9;}
.pk-say b{color:#e6a93a;}
.pk-bl{display:inline-block;min-width:34px;border-bottom:1px solid #5d7692;height:1em;vertical-align:baseline;}
/* 口袋卡抽屜（星圖「口袋卡」按下去看的就是這堂的卡本身，不跳 Skool） */
button.mat{font-family:inherit;cursor:pointer;width:100%;}
.pkc{margin-top:15px;padding-top:14px;border-top:1px solid #1d2c3c;}

.ladder{margin-top:6px;} /* 最高片 118px 的斜角呼吸位 */
.ladder .sl{cursor:pointer;}

/* 完成頁 */
.ok{text-align:center;padding:10px 0 4px;}

@keyframes cpop{0%{transform:scale(0);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.mile{margin-top:14px;background:rgba(230,169,58,.10);border:1.5px solid rgba(230,169,58,.5);border-radius:12px;padding:11px 13px;font-size:14.5px;font-weight:700;text-align:left;color:#F7F1EC;}

.echo{background:rgba(230,237,245,.06);border-left:3px solid var(--sd);border-radius:0 12px 12px 0;padding:11px 13px;margin-top:12px;font-size:14px;line-height:1.75;text-align:left;color:#cfdcea;}
.echo span{display:block;font-size:12px;color:#7d90a3;margin-top:4px;}

@keyframes bfade{from{opacity:0;}to{opacity:1;}}

/* 課程星圖：迷霧鎖＝整排 grayscale＋灰底條（12條清單⑦⑧：照樣渲染完整，看得到吃不到） */

.qmark{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1px solid #3d5268;color:#5d7692;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;letter-spacing:0;}

.phx{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;white-space:nowrap;}
.phx .pdot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
/* 2026-09-18 減色：路徑軸原本 done 綠／now 金／todo 灰＝光是「走到哪」就三個色，
   再加上 ATPI 四色，整張卡七種顏色在搶。軸統一走金，只靠亮度分前後。 */
.phx.done{color:#8ea1b6;}
.phx.done .pdot{background:rgba(232,200,154,.10);border:1.5px solid rgba(232,200,154,.45);color:#E8C89A;}

.pbar.todo{background:transparent;border-top:2px dashed #526c88;}

.miniroute{font-size:13.5px;color:#cfdcea;margin-top:12px;line-height:1.9;}

.pers{display:flex;align-items:center;gap:12px;margin:16px 0 2px;}

.fp-e{font-size:12.5px;color:#8ea1b6;margin-top:3px;line-height:1.7;}

.fp-c{display:inline-block;font-size:11px;font-weight:700;color:#E8C89A;background:rgba(232,200,154,.12);border:1px solid rgba(232,200,154,.4);border-radius:20px;padding:2px 9px;margin-top:5px;}

/* 引力場：圈層＝他跟你的距離（越內圈越近），一點＝一個客戶，停 14 天描虛線 */
.gfield{position:relative;height:330px;margin-top:4px;}
.gring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed;}
.gring i{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;letter-spacing:1px;background:#131f2b;padding:0 6px;white-space:nowrap;}
.gme{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4A1B0C,#6B3018);border:2px solid #e6a93a;box-shadow:0 0 18px rgba(230,169,58,.55);color:#E8C89A;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2;}
.gorbit{position:absolute;inset:0;animation:gspin 80s linear infinite;} /* 星系慢轉；點反向轉保持正面 */
@keyframes gspin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes gspinrev{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(-360deg);}}
.gdot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;color:#0c131e;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:1;cursor:pointer;animation:gspinrev 80s linear infinite;}
.gdot.stall{background:transparent!important;border:2px dashed;}
.gmore{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;background:#131f2b;border:1.5px solid;z-index:1;animation:gspinrev 80s linear infinite;}
.glegend{font-size:12px;color:#7d90a3;line-height:1.8;margin-top:6px;}
.glegend b{color:#cfdcea;font-weight:700;}
.empty{font-size:13px;color:#7d90a3;line-height:1.85;text-align:center;padding:8px 4px;}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;background:rgba(15,25,38,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;padding:8px 0 max(11px,env(safe-area-inset-bottom));}

.nv{flex:1;text-align:center;font-size:13px;color:#7d90a3;background:none;border:0;cursor:pointer;padding:8px 0;font-family:inherit;min-height:44px;font-weight:600;}

.hide{display:none;}

@keyframes nctPulse{0%,100%{box-shadow:0 6px 22px rgba(230,169,58,.45),0 0 0 1px rgba(255,255,255,.35) inset;}50%{box-shadow:0 6px 28px rgba(230,169,58,.75),0 0 0 1px rgba(255,255,255,.55) inset;}}
@media (max-width:420px){.next-cta{right:12px;bottom:14px;padding:11px 16px;font-size:14.5px;}}

/* 讀取頁：教練席開門（咖啡漸層＋四色依序脈動） */
.loading{text-align:center;padding:56px 20px;color:#8ea1b6;font-size:15px;line-height:1.9;}

.boot-t{font-size:19px;font-weight:700;color:#F7F1EC;margin-top:14px;line-height:1.6;}
.boot-s{font-size:13px;color:rgba(247,241,236,.6);margin-top:8px;}

.boot-dots span{width:11px;height:11px;border-radius:50%;animation:bpulse 1.2s ease-in-out infinite;}
@keyframes bpulse{0%,100%{transform:scale(.7);opacity:.45;}50%{transform:scale(1.15);opacity:1;}}
:focus-visible{outline:2px solid #C6603A;outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ═══ 私人教練席 v5（正式版）═══
   設計真相＝demo-pro-v5.html（2026-09-11 三分頁拍板＋09-14 甜蜜路徑方案B）。
   這支只做「demo 假資料 → S 真資料」的轉接，版面一片不動：
   - LOG＝checkinLog 裡有對象的筆（一片薄片＝一次出手）
   - stage＝打卡新標準（這個客戶走到哪）；舊筆沒 stage 欄用 entryStage() 從 reaction 推回

   - 人設照最強兩維自動判、狀態照 revenueLog 判（教練拍板可改＝下次 1v1 的事，不編後端沒有的欄位） */
/* PRO_WORKSHOPS 在 common.js（席位路由那一段）＝全站唯一一份，這裡只是用它 */
var S = null, WID = null, REC = null;

var STAGES = [
  {k:"none", zh:"沒反應", full:"他沒什麼反應", c:"#5d7692", t:"#8ea1b6", tint:"rgba(125,144,163,.18)", h:30},
  {k:"A", zh:"想靠近", full:"他想靠近了", c:"#e8734a", t:"#f08a63", tint:"rgba(232,115,74,.22)", h:52},
  {k:"T", zh:"願意說", full:"他願意說了", c:"#33c495", t:"#5fd8b0", tint:"rgba(51,196,149,.22)", h:74},
  {k:"P", zh:"要找你", full:"他要找你了", c:"#4b9bf0", t:"#7ab5f5", tint:"rgba(75,155,240,.22)", h:96},
  {k:"I", zh:"認定你", full:"他認定你了", c:"#e6a93a", t:"#eec06a", tint:"rgba(230,169,58,.22)", h:118}
];
function stageIdx(k){ for (var i=0;i<STAGES.length;i++) if (STAGES[i].k===k) return i; return -1; }
var PALV = {
  A:{c:"#e8734a",t:"#f08a63",tint:"rgba(232,115,74,.22)"},

/* ── 出手紀錄層：checkinLog → LOG（只收有對象的筆；陌生人不進客戶管理）──

/* 人設：量過的維照分數排、沒量的墊後；量不滿兩維＝還沒有人設（誠實空狀態） */
function personaNow(){
  var d5 = calcDimScores5(S);
  var measured = DORD.filter(function(k){ return d5[k] != null; })
                     .sort(function(a,b){ return d5[b] - d5[a]; });
  if (measured.length < 2) return null;
  var rest = DORD.filter(function(k){ return measured.indexOf(k) < 0; });
  var order = measured.concat(rest);
  var top2 = order.slice(0, 2);
  var key = top2.slice().sort().join("");
  var p = PERSONAS[key] || PERSONAS.AT;
  var chain = order.map(function(k, i){
    var src = i < 2 ? ST_STRONG[k] : ST_WEAK[k];
    return { dim: k, strong: i < 2, short: src.short, tool: src.tool, role: src.role, note: src.note };
  });
  return { code: top2.join("+"), name: p.name, tag: p.tag, chain: chain, d5: d5, order: order };
}

function slRow(items, opt){

    } else if (it.state==="past") sty += "background:" + p.tint + ";";
    if (it.state==="todo" && it.hot) sty += "border-color:#C6603A;";
    return '<div class="' + cls + '" style="' + sty + '"' + (it.onclick ? ' onclick="' + it.onclick + '"' : '') + '></div>';
  }).join("");
  var lbls = items.map(function(it){
    var p = PALV[it.dimKey] || {};
    return '<span class="' + (it.state==="todo" ? "dim" : "") + '">'
      + (it.lbl2 ? '<i style="color:' + (it.state==="todo" ? "#5d7692" : p.t||"#8ea1b6") + ';">' + it.lbl2 + '</i>' : '')
      + it.lbl + '</span>';
  }).join("");
  /* 斜角呼吸位：--skew（-12°）會把最高那片的右上角往外推 h*tan12°，
     不留位子就會被切掉。從最高片自己算，別再一處一處補 padding-right。 */
  var gut = Math.ceil(Math.max.apply(null, items.map(function(it){ return it.h; })) * 0.2126);
  return '<div class="slw" style="--sg:' + gut + 'px;">'
    + (opt.vals ? '<div class="slv">' + vals + '</div>' : '')
    + '<div class="srow">' + slices + '</div>'
    + (opt.noLbl ? '' : '<div class="slbl">' + lbls + '</div>')
    + '</div>';
}

/* COACH SIGNAL 規則：非家人朋友＋同一圈停 ≥14 天＋還沒認定你（v1 不宣稱教練已讀） */

/* 引力場：圈層＝圈層階梯（越內圈越近）。每圈只掛最該動的 7 顆（卡住優先），其餘收進「+N」 */
var GRING = {none:{r:158,zh:"沒反應"}, A:{r:132,zh:"想靠近"}, T:{r:100,zh:"願意說"}, P:{r:68,zh:"要找你"}, I:{r:38,zh:"認定你"}};
var GSTART = {none:-90, A:-58, T:-26, P:6, I:38};
function gravityHTML(){
  var rings = ["A","T","P","I"].map(function(k){
    var s = STAGES[stageIdx(k)], d = GRING[k].r * 2;
    return '<div class="gring" style="width:' + d + 'px;height:' + d + 'px;border-color:' + s.c + '66;">'
      + '<i style="color:' + s.t + ';">' + s.zh + '</i></div>';
  }).join("");
  var byRing = {none:[], A:[], T:[], P:[], I:[]};
  clientList().forEach(function(c){
    var hi = clientHi(c.name), s = STAGES[hi];
    var hiK = s.k, soft = SOFT_REL.indexOf(c.rel) > -1;
    if (soft && hi > 2) hiK = "T"; /* 家人朋友的引力停在「願意說」圈——踩煞車 */
    var stall = !soft && hi < 4 && stallDays(c.name) >= 14;
    byRing[hiK].push({name:c.name, hi:hi, s:s, stall:stall});
  });
  var CAP = 7, orbit = "";
  Object.keys(byRing).forEach(function(k){
    var arr = byRing[k];
    arr.sort(function(a,b){ return b.stall - a.stall; });
    var vis = arr.slice(0, CAP), more = arr.length - vis.length;
    var slots = vis.length + (more > 0 ? 1 : 0), r = GRING[k].r;
    vis.forEach(function(d, i){
      var a = (GSTART[k] + i * (360 / slots)) * Math.PI / 180;
      var x = Math.round(Math.cos(a) * r), y = Math.round(Math.sin(a) * r);
      var sty = 'left:calc(50% + ' + x + 'px);top:calc(50% + ' + y + 'px);'
        + (d.stall ? 'border-color:' + d.s.c + ';color:' + d.s.t + ';' : 'background:' + (d.hi===0 ? "#5d7692" : d.s.c) + ';');
      orbit += '<div class="gdot' + (d.stall ? " stall" : "") + '" style="' + sty + '" data-recfor="' + esc_(d.name) + '">' + esc_(d.name.slice(0,1)) + '</div>';
    });
    if (more > 0) {
      var a2 = (GSTART[k] + vis.length * (360 / slots)) * Math.PI / 180;
      var x2 = Math.round(Math.cos(a2) * r), y2 = Math.round(Math.sin(a2) * r);
      var cc = k==="none" ? "#5d7692" : STAGES[stageIdx(k)].c;
      var ct = k==="none" ? "#7d90a3" : STAGES[stageIdx(k)].t;
      orbit += '<div class="gmore" style="left:calc(50% + ' + x2 + 'px);top:calc(50% + ' + y2 + 'px);border-color:' + cc + '88;color:' + ct + ';">+' + more + '</div>';
    }
  });
  return '<div class="cd"><div class="sec">GRAVITY FIELD · <b>引力場</b></div>'
    + '<div class="gfield">' + rings + '<div class="gme">你</div><div class="gorbit">' + orbit + '</div></div>'
    + '<div class="glegend">這張就是你的<b>燈塔</b>——他的水溫幾度、該養還是該收，看這裡（L7 整堂教你讀它）。越內圈＝離你越近、水溫越熱，位置只看他的<b>真實反應</b>。<b>虛線＝停超 14 天，水溫在涼</b>——卡住的優先掛出來，每圈最多 7 顆，其餘收進 <b>+N</b>。下面的卡片只開<b>今天該動的四張</b>，其他人收在「其他 N 人」裡。點一個人，直接記下這一步。</div></div>';
}
/* 客戶卡排序＝今天該動誰：卡住的最上＞「要找你」離成交最近＞其他＞家人朋友墊底（不往成交排） */
function clientOrder(c){
  if (SOFT_REL.indexOf(c.rel) > -1) return 3;
  if (coachSignal(c)) return 0;
  if (clientHi(c.name) === 3) return 1;

/* 卡片只開四張（2026-09-18 拍板）：離錢最近 ×2、做得很好 ×1、需要跟進 ×1，其餘收進「其他 N 人」。
   十個客戶就是十張五層卡，滑到底也認不出今天該動誰——收起來不是藏，是讓四張有機會被看見。
   規則全用現成訊號算，不新增欄位。家人朋友一律不進四格：現有設計刻意讓他們不往成交排
   （clientOrder 墊底、SOFT_READ 踩煞車），選進「離錢最近」等於打自己臉。 */
var CL_GROUPS = [
  {k:"money",  zh:"離錢最近", c:"#4b9bf0", hint:"推一步就會動的"},
  {k:"good",   zh:"做得很好", c:"#e6a93a", hint:"成的也要知道為什麼成"},
  {k:"follow", zh:"需要跟進", c:"#e8734a", hint:"水溫在涼，帶去演練"}

function crmBuckets(cs){
  var pick = {money:[], good:[], follow:[]}, used = {};
  var hard = cs.filter(function(c){ return SOFT_REL.indexOf(c.rel) < 0; });
  function take(k, arr, n){
    arr.forEach(function(c){
      if (pick[k].length >= n || used[c.name]) return;
      used[c.name] = 1; pick[k].push(c);
    });
  }
  /* 跟進先挑：用的是 coachSignal——跟 WEEKLY 議程同一把尺，
     不會出現「議程說要帶去演練、上面卡片卻沒選他」 */
  take("follow", hard.filter(function(c){ return coachSignal(c); })
                     .sort(function(a,b){ return stallDays(b.name) - stallDays(a.name); }), 1);
  take("good",   hard.filter(function(c){ return clientHi(c.name) === 4; })

/* 這塊肌肉在客戶身上留下什麼：推過幾個人、上次幾天前、有幾個因此往前走一圈。
   全部從打卡紀錄算（buildLog 已存 muscle／target／stage／date），不新增欄位、不動 Sheet。
   「往前走一圈」＝用這塊的那一筆，把他推到了他自己的新高——LOG 已按日期排序，所以邊走邊比就好。 */
function muscleField(mk){

  LOG.forEach(function(e){
    var prev = hi[e.target] || 0, now = stageIdx(e.stage);

    if (now > prev) hi[e.target] = now;
  });

function findTask(mk){
  var t = (typeof TASKS !== "undefined" ? TASKS : []).find(function(x){
    return x.cadence === "daily" && taskMuscles_(x.muscle).indexOf(mk) > -1 && (!WID || x.workshopId === WID);
  });
  return t || fallbackMove(mk);
}

function pickStage(k){
  var ta = el("recnote");
  if (ta) REC.note = ta.value;
  REC.stage = k; render();
  var t = el("recnote"); if (t && REC.note) t.value = REC.note;
}
function fwHTML(){
  var cols = ["#e8734a","#33c495","#4b9bf0","#e6a93a"], out = "";
  for (var i=0;i<12;i++){
    var a = Math.PI*2*i/12, r = 44 + (i%2)*16;
    out += '<span class="fw" style="background:' + cols[i%4] + ';--dx:' + Math.round(Math.cos(a)*r) + 'px;--dy:' + Math.round(Math.sin(a)*r) + 'px;animation-delay:' + (0.15 + (i%3)*0.08) + 's;"></span>';
  }
  return out;
}
function bindRec(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-who]"), function(b){
    b.onclick = function(){ REC.who = b.getAttribute("data-who"); REC.rel = b.getAttribute("data-rel") || "客戶"; REC.adding = false; REC.step = 2; render(); };
  });
  var aw = el("addWho");
  if (aw) aw.onclick = function(){ REC.adding = true; if (!REC.rel) REC.rel = "客戶"; render(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-newrel]"), function(b){
    b.onclick = function(){
      var w = el("recwho"); if (w) REC.whoDraft = w.value;
      REC.rel = b.getAttribute("data-newrel"); render();
    };
  });
  var nd = el("newWhoDone");
  if (nd) nd.onclick = function(){
    var w = el("recwho");
    var n = w ? w.value.trim() : "";
    if (!n) { if (w) w.focus(); return; }
    REC.who = n.slice(0, 12); REC.adding = false; REC.step = 2; render();
  };
  var dn = el("recDone"), sk = el("recSkip");
  function done(skipNote){
    var ta = el("recnote");
    REC.note = (!skipNote && ta) ? ta.value.trim() : "";
    var am = el("recamt");
    REC.amt = am && am.value ? Math.max(0, parseInt(am.value, 10) || 0) : 0;
    REC.mile = REC.stage!=="none" && stageIdx(REC.stage) > clientHi(REC.who);
    /* 寫真資料：doCheckin 帶 stage（後端 Sheet 加欄前，重新載入會退回 entryStage 推算）；
       reaction 同步帶（跨頁相容：member/報表照舊讀 reaction），stage=I 有金額再記一筆成交 */
    var task = findTask(REC.mk);
    doCheckin(S, task, WID || "", {
      reaction: REC.stage === "none" ? "沒特別" : "明顯有",
      target: REC.who || "", rel: REC.rel || "", note: REC.note, stage: REC.stage
    });
    if (REC.amt) addRevenue(S, REC.amt, (REC.who ? REC.who + "・" : "") + (REC.note || "打卡成交"), WID || "");
    LOG = buildLog();
    REC.step = 3; window.scrollTo(0,0); render();
  }
  if (dn) dn.onclick = function(){ done(false); };
  if (sk) sk.onclick = function(){ done(true); };
}

    + '<div class="vault-q">成交是副作用——<b>他先因為你變好</b>。</div>'

function dimDetailHTML(k, scores, fm){
  var ks = MORD.filter(function(mk){ return MUSCLES[mk].dim===k; });

        var v = scores[mk];

        return {h: Math.round(18 + (v-1)/4*70), state: mk===fm ? "now" : "past",
                dimKey:k, vTop:pctFromEval(v), lbl:MUSCLES[mk].name, lbl2:mk};
      }), {vals:true, full:88})
    + '<div class="fbchips">' + fbChips(k) + '</div></div>';

function fbChips(dim){
  var n = {};
  LOG.forEach(function(e){
    if (e.dimKey===dim && e.stage && e.stage!=="none") n[e.stage] = (n[e.stage]||0) + 1;
  });
  var out = "";
  STAGES.slice(1).forEach(function(s){
    if (n[s.k]) out += '<span class="fbc" style="color:' + s.t + ';background:' + s.tint + ';">' + s.full + ' <b>×' + n[s.k] + '</b></span>';
  });
  return out || '<span class="fbc">這個維度還沒有人給過反應</span>';
}

var ANIM = true; /* 進頁/切分頁時薄片從基線長上來一次；頁內重繪（點星圖等）不重播 */
function render(){
  el("joinday").textContent = S.lineId === "DEMO" ? "DEMO" : "第 " + daysSinceJoin(S) + " 天";
  var h = REC ? recHTML() : (PANE==="crm" ? crmHTML() : PANE==="out" ? outHTML() : mapHTML());
  el("bd").innerHTML = h;
  if (REC) bindRec();
  if (ANIM) {
    ANIM = false;
    document.querySelectorAll("#bd .sl").forEach(function(s){
      var hv = s.style.height;
      s.style.transition = "none"; s.style.height = "0px";
      void s.offsetHeight; /* 強制 reflow，讓 0→目標高吃到 .4s transition */
      s.style.transition = ""; s.style.height = hv;
    });
  }
  /* 名字是使用者資料——事件走 data 屬性綁，不進 inline onclick */
  document.querySelectorAll("#bd [data-recfor]").forEach(function(n){
    n.onclick = function(){ openRecFor(n.getAttribute("data-recfor")); };
  });
  var cm = el("clMore");
  if (cm) cm.onclick = function(){
    el("clRest").hidden = false;
    cm.remove();   /* 展開就不收回去——收合鈕在這裡只會多一個沒人按的狀態 */
  };
  var fr = el("firstRec"); if (fr) fr.onclick = openRec;
  var rf = el("recFocus"); if (rf) rf.onclick = openRec;
  document.querySelectorAll(".nv").forEach(function(b){
    b.className = "nv" + (b.getAttribute("data-pane")===PANE ? " on" : "");
    b.onclick = function(){
      REC = null; PANE = b.getAttribute("data-pane"); ANIM = true; window.scrollTo(0,0); render();
      track("screen_view", { screen: PANE, seat: "pro" });   // 切分頁不換網址，不自己發就看不到
    };
  });
}

/* ── demo 模式（?demo=1，跟 member/visitor 同慣例）：假資料全在前端、不寫 Sheet。
   內容照 demo-pro-v5 的示意劇本：五個客戶、兩筆成交、12 塊全量。 ── */
function demoStatePro_(){
  function ago(i){ var d = new Date(Date.now() - i * 86400000); return todayStr(d); }
  function ck(mk, i, target, rel, stage, note){
    return { workshopId: PRO_WORKSHOPS[0], taskKey: "m_" + mk.toLowerCase(), cadence: "daily",
             dim: mk.charAt(0), muscle: mk, pts: 1, date: ago(i), week: weekStr(new Date(ago(i))),
             target: target, rel: rel, reaction: stage === "none" ? "沒特別" : "明顯有",
             note: note || "", stage: stage };
  }
  function ev(mk, sc, src){ return { muscle: mk, score: sc, source: src, date: ago(7), week: "" }; }
  return {
    lineId: "DEMO", name: "Kevin", team: "",
    checkinLog: [
      ck("I1", 1,  "張總",   "客戶", "P",    "「你幫我把數字拉出來看。」"),
      ck("P2", 3,  "張總",   "客戶", "P"),
      ck("P1", 8,  "張總",   "客戶", "T"),
      ck("T2", 12, "張總",   "客戶", "T"),
      ck("T1", 2,  "林經理", "客戶", "A",    "他說先看看資料，改天約"),
      ck("A2", 6,  "林經理", "客戶", "A"),
      ck("A1", 16, "周姐",   "客戶", "none", "只回「謝謝分享」"),
      ck("T2", 5,  "妹妹",   "家人", "T",    "她說了工作上的委屈"),
      ck("A2", 26, "陳老闆", "客戶", "A"),
      ck("T1", 22, "陳老闆", "客戶", "T"),
      ck("P1", 16, "陳老闆", "客戶", "P"),
      ck("I2", 9,  "陳老闆", "客戶", "I",    "當場簽了年約"),
      ck("I1", 20, "Amy",   "客戶", "I",    "介紹來的，一次就成")
    ],
    revenueLog: [
      { workshopId: PRO_WORKSHOPS[0], date: ago(9),  amount: 180000, note: "陳老闆・年約", A:0,T:0,P:0,I:0 },
      { workshopId: PRO_WORKSHOPS[0], date: ago(20), amount: 60000,  note: "Amy・介紹成交", A:0,T:0,P:0,I:0 }
    ],
    evalLog: [
      ev("A1",4,"coach"), ev("A2",3,"self"),  ev("A3",3.5,"coach"),
      ev("T1",4,"coach"), ev("T2",3,"self"),  ev("T3",4.5,"coach"),
      ev("P1",3,"coach"), ev("P2",1.5,"coach"), ev("P3",3,"self"),
      ev("I1",2,"coach"), ev("I2",2.5,"self"), ev("I3",2,"coach")
    ],
    /* 交過 L1、L2＝現在停在 L3；demo 才這樣預設，真資料讀後端 submissions */
    submissions: [ {taskKey:"hw_L1", date:ago(30)}, {taskKey:"hw_L2", date:ago(16)} ]
  };
}

async function boot() {
  var qs = new URLSearchParams(location.search);
  /* ?next=quiz：把好奇的訪客順著導去影響力健檢；跟 demo 是獨立開關，可單獨掛。 */
  var _nq = el("nextQuizCta");
  if (qs.get("next") === "quiz" && _nq) { _nq.classList.remove("hide"); }
  if (qs.get("demo") === "1") {
    postToSheet = function(){ return Promise.resolve(); };   // demo 不寫 Sheet
    TASKS = []; S = demoStatePro_(); WID = PRO_WORKSHOPS[0];
    LOG = buildLog();
    /* 截圖驗收捷徑（同 demo-pro-v5 慣例）：?rec=2&who=張總&stage=P／?selL=5／?drill=1 */
    if (qs.get("rec")) REC = { who: qs.get("who")||"張總", rel: qs.get("rel")||"客戶", stage: qs.get("stage"),
                               note: qs.get("note")||"", mile: qs.get("mile")==="1", step: +qs.get("rec"),
                               mk: qs.get("mk")||focusMuscle()||"A1" };
    if (qs.get("drill")) OPEN_DRILL = true;
    if (qs.get("selL")) SEL_L = +qs.get("selL");
    el("nav").classList.remove("hide");
    render();
    return;
  }
  /* 同 member.html：外部瀏覽器走「用 LINE 開啟」的橋，不推去打 LINE 密碼。 */
  var uid = await resolveLineId("bd");
  if (!uid) return;
  var d = await loadBootstrap(uid, "");
  if (!d) { el("bd").innerHTML = '<div class="loading">讀不到資料，請稍後再試。</div>'; return; }
  /* 走錯房間就自己走出去（判斷在 common.js 的 seatEscape_／expectedPage_）：
     主畫面捷徑鎖在加入時的那一頁，課程結束改回會員席之後，捷徑還是天天開這一頁。 */
  if (seatEscape_(uid, d, "pro.html")) return;
  if (d.tasks) TASKS = d.tasks;
  if (d.workshops) WORKSHOPS = d.workshops;
  var st = d.student || {};
  S = { lineId: st.lineId || uid, pid: st.pid || "", name: st.name || "", team: st.team || "",
        checkinLog: d.checkins || [], revenueLog: d.revenue || [], evalLog: d.evals || [],
        submissions: d.submissions || [] };
  var enrolledPro = (d.enrollments || []).filter(function(e){ return isMe(e, S) && PRO_WORKSHOPS.indexOf(e.workshopId) > -1; });
  WID = enrolledPro.length ? enrolledPro[0].workshopId : PRO_WORKSHOPS[0];
  LOG = buildLog();
  el("nav").classList.remove("hide");
  render();
  track("screen_view", { screen: PANE, seat: "pro" });
}
boot();
</script>
