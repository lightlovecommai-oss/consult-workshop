<html lang="zh-TW">
<head>

<meta property="og:description" content="影響力健身房練基本功，超引力成交學練變現——12 小肌群全開，從最有感的那塊練起。">

<style>
/* ═══ 私人教練席・暖版（pro v3）═══
   只給 PRO_WORKSHOPS（超引力-顧問課／超引力-公眾演說）的私教學員，另開一支檔案、
   不動 dashboard.html——天麗跟舊私教學員繼續看原本那支，一個像素都不動。
   視覺骨架＝pro-v3-demo.html（暖底 #F7F1EC＋咖啡漸層識別線＋金 #E8C89A），
   但這裡全部是真資料：12 小肌群讀 calcMuscleScores()、關係軌跡讀真的 e.reaction、
   成果讀 marketValidation()/revenueLog——demo 裡都是示範資料，這裡一筆都不編。
   四維色一律 DIMS[k].color（填色）／dimTextColor(k)（文字，I 必用深版）。 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#F7F1EC;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#4A1B0C;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:84px;}

/* 頂欄：咖啡漸層＝教練席識別線 */
.tb{background:linear-gradient(135deg,#4A1B0C,#6B3018);padding:16px 16px 13px;position:sticky;top:0;z-index:30;}
.tb-n{color:#F7F1EC;font-size:17px;font-weight:700;letter-spacing:.02em;}
.hall{font-size:11px;font-weight:700;color:#E8C89A;border:1px solid rgba(232,200,154,.55);padding:2px 8px;border-radius:20px;margin-left:8px;white-space:nowrap;letter-spacing:1px;}
.tb-d{margin-left:auto;font-size:13px;color:rgba(247,241,236,.65);white-space:nowrap;}
.tb-r{display:flex;align-items:center;}
.tb-s{font-size:13px;color:rgba(247,241,236,.75);margin-top:4px;}

.bd{padding:16px;}
.cd{background:#fff;border-radius:16px;padding:17px 16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(74,27,12,.05);}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;color:#8a6a1e;background:#F3E7CF;border-radius:20px;padding:4px 12px;}
.sec{font-size:13px;font-weight:700;color:#6E4A3C;margin-bottom:11px;}
.muted{font-size:13px;color:#8A7266;}
.rule4{height:2px;border-radius:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);margin-top:14px;}

/* 門面 hero */
.hero-t{font-size:24px;font-weight:900;line-height:1.35;margin-top:10px;}
.hero-s{font-size:14px;color:#6E4A3C;line-height:1.85;margin-top:8px;}

/* L1-L8 路徑 */
.lrow{display:flex;gap:4px;}
.lcell{flex:1;text-align:center;border-radius:9px;padding:8px 2px;}
.lcell-n{font-size:13px;font-weight:700;}
.lcell-l{font-size:12px;margin-top:3px;}

/* 關係軌跡（demo pro-2 骨架） */
.rel{background:#fff;border-radius:16px;padding:15px 16px;box-shadow:0 2px 10px rgba(74,27,12,.05);margin-bottom:10px;cursor:pointer;transition:box-shadow .2s;}
.rel:active{box-shadow:0 1px 4px rgba(74,27,12,.08);}
.rel-hd{display:flex;align-items:center;gap:10px;}
.rel-av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.rel-n{font-size:15px;font-weight:700;}
.rel-m{font-size:12.5px;color:#8A7266;margin-top:1px;}
.rel-arrow{margin-left:auto;color:#C9B8AC;font-size:13px;transition:transform .3s;}
.rel.open .rel-arrow{transform:rotate(90deg);}
.arc{margin-top:13px;position:relative;height:46px;}
.arc-line{position:absolute;left:8px;right:8px;top:14px;height:3px;border-radius:3px;background:#EFE5DC;}
.arc-fill{position:absolute;left:8px;top:14px;height:3px;border-radius:3px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);}
.nd{position:absolute;top:8px;width:15px;height:15px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(74,27,12,.18);}
.nd-l{position:absolute;top:30px;font-size:10px;color:#8A7266;transform:translateX(-30%);white-space:nowrap;}
.nd.next{background:#fff !important;border:2px dashed #C99A4E;animation:ndpulse 1.8s infinite;}
@keyframes ndpulse{0%,100%{box-shadow:0 0 0 0 rgba(201,154,78,.35);}50%{box-shadow:0 0 0 6px rgba(201,154,78,0);}}
.rel-b{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);}
.rel.open .rel-b{max-height:260px;}
.rel-last{margin-top:12px;background:#F7F1EC;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.8;}
.rel-last span{color:#6E4A3C;font-size:12px;font-weight:700;}
.rel-read{margin-top:8px;display:flex;gap:8px;font-size:13px;line-height:1.8;color:#4A1B0C;}
.rel-read .cv{width:22px;height:22px;border-radius:50%;background:#4A1B0C;color:#E8C89A;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px;}
.rel-read b{color:#993C1D;}
.empty{font-size:13px;color:#8A7266;line-height:1.85;text-align:center;padding:8px 4px;}

/* 12 小肌群（demo pro-3 骨架：3 欄一體） */
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.mgc{background:#F7F1EC;border-radius:12px;padding:9px 8px;font-size:11.5px;color:#4A1B0C;line-height:1.5;border:1px solid transparent;}
.mgc.focus{border-color:#C99A4E;background:#FBF4E4;font-weight:700;}
.mgc.none{opacity:.55;}
.mgc .bar{height:4px;border-radius:4px;background:#E6DAD1;margin-top:6px;overflow:hidden;}
.mgc .bf{height:100%;border-radius:4px;}
.mgc .v{font-size:10.5px;color:#8A7266;margin-top:4px;}

/* 甜蜜路徑（demo pro-4：咖啡圓圈編號） */
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;line-height:1.8;}
.step .no{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#4A1B0C;color:#E8C89A;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px;}

/* 覆盤成果 */
.stat-row{display:flex;align-items:baseline;gap:10px;background:#F7F1EC;border-radius:12px;padding:13px;margin-bottom:8px;}
.stat-l{font-size:13px;color:#8A7266;margin-bottom:4px;}
.stat-v{font-size:22px;font-weight:700;color:#993C1D;line-height:1;font-variant-numeric:tabular-nums;}
.stat-r{margin-left:auto;font-size:13px;color:#8A7266;text-align:right;line-height:1.5;}

/* 改觀句・骨層（demo pro-6） */
.bone-card{background:linear-gradient(135deg,#4A1B0C,#6B3018);border-radius:16px;padding:19px 18px;color:#F7F1EC;margin-bottom:14px;}
.bone-k{font-size:12px;letter-spacing:2px;color:#E8C89A;margin-bottom:10px;font-weight:700;}
.bone-q{font-size:16px;line-height:1.9;font-weight:500;}
.bone-q b{color:#E8C89A;}
.bone-quote{margin-top:13px;background:rgba(247,241,236,.08);border-left:3px solid #E8C89A;border-radius:0 10px 10px 0;padding:10px 13px;font-size:14px;line-height:1.85;color:rgba(247,241,236,.92);}
.bone-end{font-size:14px;color:#4A1B0C;line-height:1.9;text-align:center;margin:24px 0 10px;padding:0 8px;}

/* 大按鈕 */
.go{margin-top:14px;width:100%;display:block;text-align:center;text-decoration:none;background:#C6603A;color:#fff;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;min-height:58px;box-shadow:0 6px 18px rgba(198,96,58,.28);transition:transform .15s;}
.go:active{transform:scale(.97);}

/* 口袋卡（L1-L4 打基礎的提示・回家演練） */
.pk-g{font-size:13px;font-weight:700;margin:14px 2px 6px;}
.pk-r{width:100%;display:flex;align-items:center;gap:8px;background:#F7F1EC;border:0;border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer;font-family:inherit;text-align:left;min-height:44px;color:#4A1B0C;}
.pk-code{font-size:13px;font-weight:700;flex-shrink:0;}
.pk-nm{font-size:15px;}
.pk-ar{margin-left:auto;font-size:13px;color:#8A7266;}
.pk-bd{background:#F7F1EC;border-radius:0 0 10px 10px;margin:-10px 0 6px;padding:2px 12px 13px;}
.pk-lb{font-size:13px;color:#8A7266;margin:11px 0 4px;}
.pk-w{font-size:13px;color:#6E4A3C;line-height:1.7;}
.pk-say{font-size:15px;color:#4A1B0C;line-height:1.9;}
.pk-say b{color:#993C1D;}
.pk-bl{display:inline-block;min-width:34px;border-bottom:1px solid #8A7266;height:1em;vertical-align:baseline;}
.pk-exr{display:flex;gap:8px;font-size:13px;line-height:1.7;padding:3px 0;}
.pk-exk{flex-shrink:0;color:#8A7266;}
.pk-exv{color:#6E4A3C;}

/* 練習：低摩擦記錄流程 */
.rec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rec-bk{background:none;border:0;color:#8A7266;font-size:22px;cursor:pointer;padding:0 4px 0 0;line-height:1;font-family:inherit;min-height:44px;}
.rec-n{font-size:15px;font-weight:700;color:#4A1B0C;}
.rec-m{font-size:13px;color:#8A7266;margin-top:2px;}
.how{background:#F7F1EC;border-radius:14px;padding:13px 14px;margin-bottom:14px;font-size:15px;color:#4A1B0C;line-height:1.9;}
.how b{color:#993C1D;}
.q{font-size:15px;font-weight:700;color:#4A1B0C;margin-bottom:11px;}
.qs{font-size:13px;color:#8A7266;font-weight:400;margin-left:6px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.op{font-size:13px;padding:11px 16px;border-radius:20px;border:1px solid #E6DAD1;background:#fff;color:#4A1B0C;cursor:pointer;font-family:inherit;min-height:44px;}
.op.on{background:#C6603A;border-color:#C6603A;color:#fff;font-weight:600;}
.op.warm{background:#F7F1EC;}
.op.new{color:#8A7266;border-style:dashed;}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bo{padding:15px 10px;border-radius:14px;border:1px solid #E6DAD1;background:#fff;cursor:pointer;text-align:center;font-family:inherit;min-height:44px;}
.bo.on{border-color:#C6603A;background:#FDF3EC;}
.bo-e{font-size:22px;line-height:1;margin-bottom:5px;}
.bo-t{font-size:13px;color:#4A1B0C;}
.opt-wrap{margin-top:15px;border-top:1px solid #EFE5DC;padding-top:14px;}
.opt-l{font-size:13px;font-weight:700;color:#4A1B0C;margin-bottom:4px;}
.opt-h{font-size:13px;color:#8A7266;margin-bottom:9px;line-height:1.7;}
.ta{width:100%;background:#fff;border:1px solid #E6DAD1;border-radius:14px;padding:11px;font-size:17px;color:#4A1B0C;font-family:inherit;line-height:1.6;min-height:64px;resize:vertical;}
.ta:focus{outline:none;border-color:#C6603A;}
.sub{width:100%;background:#C6603A;color:#fff;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:15px;font-family:inherit;min-height:44px;box-shadow:0 4px 14px rgba(198,96,58,.22);}
.sub[disabled]{background:#E6DAD1;color:#8A7266;box-shadow:none;}
.ok{text-align:center;padding:10px 0 4px;}
.ok-e{font-size:32px;margin-bottom:14px;}
.ok-t{font-size:26px;color:#4A1B0C;margin-bottom:12px;line-height:1.4;font-weight:700;}
.ok-s{font-size:13px;color:#6E4A3C;line-height:1.95;}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;background:#fff;border-top:1px solid #E6DAD1;display:flex;padding:8px 0 max(11px,env(safe-area-inset-bottom));}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:#8A7266;background:none;border:0;cursor:pointer;padding:5px 0;font-family:inherit;min-height:44px;}
.nv.on{color:#993C1D;font-weight:700;}
.nv-i{height:22px;display:flex;align-items:center;justify-content:center;}
.nv-i svg{display:block;}
.hide{display:none;}

/* 讀取頁：教練席開門（咖啡漸層＋四色依序脈動，不跟 member 一樣） */
.loading{text-align:center;padding:56px 20px;color:#6E4A3C;font-size:15px;line-height:1.9;}
.boots{padding:34px 4px;}
.boot-card{background:linear-gradient(135deg,#4A1B0C,#6B3018);border-radius:20px;padding:46px 24px 42px;text-align:center;box-shadow:0 10px 30px rgba(74,27,12,.25);}
.boot-k{font-size:12px;letter-spacing:4px;color:#E8C89A;font-weight:700;}
.boot-t{font-size:19px;font-weight:700;color:#F7F1EC;margin-top:14px;line-height:1.6;}
.boot-s{font-size:13px;color:rgba(247,241,236,.6);margin-top:8px;}
.boot-dots{display:flex;justify-content:center;gap:12px;margin-top:26px;}
.boot-dots span{width:11px;height:11px;border-radius:50%;animation:bpulse 1.2s ease-in-out infinite;}
@keyframes bpulse{0%,100%{transform:scale(.7);opacity:.45;}50%{transform:scale(1.15);opacity:1;}}
/* ── 三頁大demo搬入（2026-09-04 老師指示：先把相近元素放一起，之後再整合）──
   dp- 前綴＝demo-pro.html 搬進來的板塊，深底科技 HUD 樣式自帶暗卡底，資料全是示意。 */
.dp-blk{position:relative;margin-bottom:14px;}
.dp-tag{position:absolute;top:-9px;right:0;font-size:10px;font-weight:700;letter-spacing:1px;color:#0c131e;background:#e6a93a;border-radius:10px;padding:2px 8px;z-index:5;}
.dp-mock{font-size:10px;color:#7d90a3;background:rgba(234,241,250,.08);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:2px;}
.dp-cd{background:#131f2b;border-radius:16px;padding:17px 16px;border:1px solid #1d2c3c;color:#eaf1fa;}
.dp-sec{font-size:12px;font-weight:700;letter-spacing:2px;color:#7d90a3;margin-bottom:12px;}
.dp-sec b{color:#eaf1fa;}
.dp-num{font-variant-numeric:tabular-nums;}
.dp-tb{background:linear-gradient(135deg,#4A1B0C,#6B3018);margin:0 -16px;padding:20px 16px 18px;position:relative;overflow:hidden;}
.dp-tb:after{content:"";position:absolute;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,#E8C89A,transparent);animation:dpscan 3.2s ease-in-out infinite;top:0;}
@keyframes dpscan{0%{top:0;opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{top:100%;opacity:0;}}
.dp-tb-k{font-size:11px;letter-spacing:4px;color:#E8C89A;font-weight:700;}
.dp-tb-t{font-size:24px;font-weight:900;color:#F7F1EC;margin-top:8px;}
.dp-tb-s{font-size:13px;color:rgba(247,241,236,.65);margin-top:6px;line-height:1.7;}
.dp-tb-coach{display:flex;align-items:center;gap:10px;margin-top:14px;background:rgba(12,19,30,.35);border:1px solid rgba(232,200,154,.25);border-radius:14px;padding:10px 13px;}
.dp-tb-av{width:34px;height:34px;border-radius:50%;background:rgba(232,200,154,.15);border:1px solid rgba(232,200,154,.5);color:#E8C89A;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.dp-tb-cn{font-size:13.5px;font-weight:700;color:#F7F1EC;}
.dp-tb-cs{font-size:11.5px;color:rgba(247,241,236,.55);margin-top:1px;}
.dp-tb-nx{margin-left:auto;text-align:right;font-size:11px;color:rgba(247,241,236,.55);line-height:1.6;flex-shrink:0;}
.dp-tb-nx b{display:block;font-size:12.5px;color:#E8C89A;}
.dp-hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.dp-hc{background:#182634;border-radius:10px;padding:9px 8px;font-size:11px;color:#eaf1fa;line-height:1.5;position:relative;}
.dp-hc .bar{height:3px;border-radius:3px;background:#2a3a4d;margin-top:6px;overflow:hidden;}
.dp-hc .bf{height:100%;border-radius:3px;}
.dp-hc .v{font-size:10px;color:#7d90a3;margin-top:4px;}
.dp-hc.lockon{background:#1a2434;}
.dp-hc.lockon:before,.dp-hc.lockon:after{content:"";position:absolute;width:9px;height:9px;border:1.5px solid #e6a93a;}
.dp-hc.lockon:before{top:-2px;left:-2px;border-right:0;border-bottom:0;}
.dp-hc.lockon:after{bottom:-2px;right:-2px;border-left:0;border-top:0;}
.dp-hc.lockon .v{color:#e6a93a;font-weight:700;}
.dp-fp{position:relative;padding-left:24px;}
.dp-fp:before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:2px;background:linear-gradient(180deg,#e8734a,#33c495,#4b9bf0,#e6a93a);border-radius:2px;box-shadow:0 0 8px rgba(232,115,74,.35);}
.dp-wp{position:relative;padding:8px 0 8px 4px;font-size:13.5px;line-height:1.8;color:#eaf1fa;}
.dp-wp:before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;background:#0c131e;border:2px solid #7d90a3;}
.dp-wp.lit:before{border-color:#33c495;background:#33c495;box-shadow:0 0 8px rgba(51,196,149,.6);}
.dp-wp small{display:block;font-size:11.5px;color:#7d90a3;margin-top:2px;}
.dp-gauge{display:flex;gap:8px;}
.dp-gg{flex:1;background:#182634;border-radius:12px;padding:12px;text-align:center;}
.dp-gg-v{font-size:20px;font-weight:700;color:#e8734a;line-height:1.2;}
.dp-gg-l{font-size:10.5px;color:#7d90a3;margin-top:4px;line-height:1.5;}
.dp-vault{background:linear-gradient(135deg,#4A1B0C,#6B3018);border:1px solid rgba(232,200,154,.35);border-radius:16px;padding:19px 18px;color:#F7F1EC;position:relative;overflow:hidden;}
.dp-vault:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(232,200,154,.12),transparent);animation:dpsheen 4.5s ease-in-out infinite;}
@keyframes dpsheen{0%,55%{left:-60%;}85%,100%{left:120%;}}
.dp-vault-k{font-size:11px;letter-spacing:3px;color:#E8C89A;font-weight:700;}
.dp-vault-q{font-size:16px;line-height:1.9;margin-top:10px;}
.dp-vault-q b{color:#E8C89A;}
.dp-vault-quote{margin-top:13px;background:rgba(247,241,236,.08);border-left:3px solid #E8C89A;border-radius:0 10px 10px 0;padding:10px 13px;font-size:14px;line-height:1.85;color:rgba(247,241,236,.92);}
.dp-vault-quote small{display:block;margin-top:5px;font-size:11px;color:#C9A87A;}
:focus-visible{outline:2px solid #C6603A;outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="app">
  <div class="tb">
    <div class="tb-r">
      <div class="tb-n">超引力成交學</div>
      <span class="hall">私人教練席</span>
      <div class="tb-d" id="joinday">—</div>
    </div>
    <div class="tb-s" id="wssub">超引力成交學 · L1–L8</div>

/* ══ 路徑：兩門課的 L 結構完全不同，真相＝productkit 15-課程梳理-L1-L12對到大包裝.md ══
   超引力-顧問課＝鍛鍊段L1-L4(一課一塊肌肉：L1吸引/L2信任/L3專業/L4推進) ＋
                  放大段L5-L8(L5顧問腳本1v1四幕／L6甜蜜路徑／L7導航北極星+燈塔／L8副作用+升單鉤子)。
   超引力-公眾演說＝演說段L9-L13(L9吸引+信任開場／L10專業體驗感／L11推進收單／
                  L12三種銷講稿·待老師拍板／L13大師之路+畢業考核)。
   L1-L4 用真資料算 done/now/lock（該維3個小肌群都量過才算過關）；L5-L8 沒有可拆解成
   小肌群的真資料，L1-4 全過才整塊解鎖，不假裝有細部進度。公眾演說段完全沒有逐字稿可
   對照，只列真的 L 名稱跟段落說明，不假裝算得出進度。 */
function levelState(){
  var scores = calcMuscleScores(S);
  var order = [["L1","A","吸引"], ["L2","T","信任"], ["L3","P","專業"], ["L4","I","推進"]];
  var doneIdx = -1, nowIdx = -1;
  order.forEach(function(l, i){
    var allMeasured = musclesOfDim(l[1]).every(function(mk){ return scores[mk] != null; });
    if (allMeasured && nowIdx < 0) doneIdx = i;
    else if (nowIdx < 0) nowIdx = i;
  });
  if (nowIdx < 0) nowIdx = order.length;
  var lv = order.map(function(l, i){ return { k: l[0], dim: l[1], name: l[2], state: i <= doneIdx ? "done" : i === nowIdx ? "now" : "lock" }; });
  var advanced = [["L5","顧問腳本"], ["L6","甜蜜路徑"], ["L7","導航"], ["L8","副作用"]];
  var advState = doneIdx >= 3 ? "now" : "lock";
  advanced.forEach(function(a){ lv.push({ k: a[0], dim: null, name: a[1], state: advState }); });
  return lv;
}
/* 公眾演說段（L9-L13）沒有逐字稿可對照真進度，只列真的段落結構跟一句話說明，
   狀態一律「lock」（誠實：算不出進度就不要裝）。 */
function speechLevelState(){
  return [
    { k:"L9",  name:"開場",     desc:"A吸引＋T信任・銷講開場",         state:"lock" },
    { k:"L10", name:"體驗感",   desc:"P專業・讓乾貨有體驗感",           state:"lock" },
    { k:"L11", name:"收單",     desc:"I推進・銷講收單",                state:"lock" },
    { k:"L12", name:"三種稿",   desc:"30秒／5分／1.5小時銷講稿（待老師拍板）", state:"lock" },
    { k:"L13", name:"大師之路", desc:"畢業考核",                       state:"lock" }
  ];
}
/* 門面：真名字＋教練在場的一句話（不放假的 1v1 日期——沒有後端欄位就不編） */
function heroHTML(){
  return '<div style="margin:2px 2px 18px;">'

/* 軌跡分頁＝門面＋關係軌跡＋每週覆盤演練卡；課表降級搬去「覆盤」分頁。
   練習卡由底下的 pathHTML wrapper 接在最後（CTA 下移）。 */

/* ══ 關係軌跡：持續存在的功能（不是驗收才出現），讀真的 e.reaction，
   soft(家人/朋友)一樣只到「願意說」不推向成交——規則跟 member.html 一致，這裡不因為
   是私教學員就拿掉煞車。══ */
function relTargets(){
  var byTarget = {};
  S.checkinLog.forEach(function(e){
    if (!e.target || e.target === "陌生人" || !e.reaction) return;
    var ms = logMuscles_(e); if (!ms.length) return;
    var t = byTarget[e.target] || (byTarget[e.target] = { dims: {}, n: 0, first: "", last: "", rel: "", lastNote: "", lastReaction: "" });
    ms.forEach(function(mk){ t.dims[MUSCLES[mk].dim] = true; });
    if (e.rel && !t.rel) t.rel = e.rel;
    t.n++;
    var d = normDate(e.date);
    if (!t.first || d < t.first) t.first = d;
    if (d >= t.last) { t.last = d; t.lastNote = e.note || ""; t.lastReaction = e.reaction || ""; }
  });
  return Object.keys(byTarget).sort(function(a, b){ return byTarget[b].n - byTarget[a].n; }).slice(0, 4).map(function(n){ return { name: n, t: byTarget[n] }; });
}
function weeksSpan_(a, b){
  if (!a || !b) return 1;
  var ms = new Date(b) - new Date(a);
  return Math.max(1, Math.floor(ms / 6048e5) + 1);
}
function archArcSection(){
  var targets = relTargets();
  var h = '<div class="sec" style="margin:2px 3px 10px;">你的關係軌跡——長時間，看得見在動</div>';
  if (!targets.length) {
    h += '<div class="cd"><div class="empty">開練時記下「對誰」，這裡就會把片刻串成一條線——只有練習頁記過反應的對象才會出現在這裡。</div></div>';
    return h;
  }
  h += targets.map(function(x){
    var t = x.t, soft = SOFT_REL.indexOf(t.rel) > -1;
    /* soft 關係只走到 T（願意說）就到站——節點只畫 A/T，煞車不拿掉 */
    var dords = soft ? ["A", "T"] : DORD;
    var pos = soft ? [4, 34] : [4, 34, 60, 86];
    var lastLit = -1;
    dords.forEach(function(d, i){ if (t.dims[d]) lastLit = i; });
    var nextGiven = false, nodes = "";
    dords.forEach(function(d, i){
      var on = !!t.dims[d];
      var nx = !on && !nextGiven;
      if (nx) nextGiven = true;
      if (on) {
        nodes += '<div class="nd" style="left:' + pos[i] + '%;background:' + DIMS[d].color + ';"></div>';
      } else if (nx) {
        nodes += '<div class="nd next" style="left:' + pos[i] + '%;border-color:' + DIMS[d].color + ';"></div>';
      } else {
        nodes += '<div class="nd" style="left:' + pos[i] + '%;background:#E6DAD1;"></div>';
      }
      nodes += '<div class="nd-l" style="left:' + pos[i] + '%;">' + DIM_SHORT[d] + '</div>';
    });
    var fillW = lastLit < 0 ? 0 : pos[lastLit] + 2;
    var avDim = lastLit >= 0 ? dords[lastLit] : null;
    var avBg = avDim ? DIMS[avDim].color : "#8A7266";
    var note = soft
      ? (t.dims.T ? '這段不用走完——他願意跟你說真話，就已經是你要的了。' : '慢慢來。這段的終點不是成交，是他願意跟你說真話。')
      : (t.dims.A && t.dims.T && !t.dims.P ? '他已經願意跟你說話了。下一步是**讓他要找你**。'
        : t.dims.A && !t.dims.T ? '才剛開始。別急著講產品，下一步是**讓他願意說**。'
        : '節點依**對方的反應**點亮，不是「我練過這一維」。繼續記，會看到它往哪走。');
    var lastLine = t.lastNote ? esc_(t.lastNote) : '對方反應：' + esc_(t.lastReaction);
    return '<div class="rel" onclick="this.classList.toggle(\'open\')">'
      + '<div class="rel-hd">'
      + '<div class="rel-av" style="background:' + avBg + ';">' + esc_(x.name.slice(0, 1)) + '</div>'
      + '<div><div class="rel-n">' + esc_(x.name) + '</div>'
      + '<div class="rel-m">' + (t.rel ? esc_(t.rel) + ' · ' : '') + '記了 ' + t.n + ' 筆 · 跨 ' + weeksSpan_(t.first, t.last) + ' 週</div></div>'
      + '<div class="rel-arrow">›</div></div>'
      + '<div class="arc"><div class="arc-line"></div>'
      + '<div class="arc-fill" style="width:' + fillW + '%;"></div>' + nodes + '</div>'
      + '<div class="rel-b">'
      + '<div class="rel-last"><span>最近一筆 · </span>' + lastLine + '</div>'
      + '<div class="rel-read"><div class="cv">教</div><div>' + md_(note) + '</div></div>'
      + '</div></div>';
  }).join("");
  h += '<div style="font-size:12.5px;color:#8A7266;text-align:center;margin:4px 0 16px;">最多同時看 4 個人——深，比多重要。</div>';
  return h;
}

/* ══ 12 小肌群：全開，照上升空間最大的練（跟會員層相反——會員層不給看這個）。
   demo pro-3 骨架：3 欄 12 格一體、這季主力金框。分數＝真的 calcMuscleScores()，
   「還沒量」誠實顯示、不給預設值。 ══ */
function bodyHTML(){
  var scores = calcMuscleScores(S);
  var focus = weakestThree(S)[0] || null;
  var measured = MORD.filter(function(k){ return scores[k] != null; }).length;
  var h = '<div class="cd">'
    + '<div style="display:flex;align-items:center;" class="sec">12 塊小肌群——全開，跟教練一起看'
    + '<span style="margin-left:auto;font-weight:400;color:#8A7266;">' + measured + ' / 12 已量</span></div>'
    + '<div class="mg">' + MORD.map(function(mk){
        var m = MUSCLES[mk], v = scores[mk], d = m.dim;
        var isFocus = mk === focus;
        var cls = "mgc" + (isFocus ? " focus" : "") + (v == null ? " none" : "");
        return '<div class="' + cls + '">'
          + '<span style="color:' + dimTextColor(d) + ';font-weight:700;">' + mk + '</span> ' + esc_(m.name)
          + '<div class="bar"><div class="bf" style="width:' + (v == null ? 0 : (v - 1) / 4 * 100) + '%;background:' + DIMS[d].color + ';"></div></div>'
          + '<div class="v">' + (v == null ? '還沒量' : v.toFixed(1) + (isFocus ? ' · 這季主力' : '')) + '</div></div>';
      }).join("") + '</div>'
    + '<div style="font-size:12.5px;color:#8A7266;margin-top:10px;line-height:1.7;">分數是跟教練一起校準的——低分不是問題，是<b style="color:#993C1D;">先練這塊最有感</b>。這一層 12 格全開，照上升空間最大的練。</div></div>';
  h += demoP3_();
  h += sweetProHTML();
  h += demoP4_();
  return h;
}

/* ══ 甜蜜路徑（pro 版）：同 member.html sweetPathHTML 的來源（atpi-core.js COMBO_PATH 查表），
   差在這裡四步全開不迷霧——你已經買了完整的路。分數不足兩維時給同一句空狀態，不放示意。 ══ */
function sweetProHTML(){
  var d5 = calcDimScores5(S);
  var ms = DORD.filter(function(k){ return d5[k] != null; });
  var h = '<div class="cd"><div class="pill" style="margin-bottom:12px;">甜蜜路徑</div>';
  if (ms.length >= 2) {
    var sorted5 = ms.sort(function(a, b){ return d5[b] - d5[a]; });
    var top2 = sorted5.slice(0, 2);
    var combo = COMBO_PATH[top2.slice().sort().join("")];
    var steps = (combo.flow || "").split("\n").filter(function(x){ return x.trim(); });
    h += '<div style="font-size:15px;color:#4A1B0C;line-height:1.9;">你最強的兩塊：<b style="color:#993C1D;">'
      + esc_(DIMS[top2[0]].name) + ' × ' + esc_(DIMS[top2[1]].name) + '</b>——'
      + '這個組合的變現甜蜜路徑是<b style="color:#993C1D;">「' + esc_(combo.title) + '」</b>，四步全開：</div>'
      + '<div style="margin-top:6px;">' + steps.map(function(st, i){
          return '<div class="step"><span class="no">' + (i + 1) + '</span>'
            + '<span>' + esc_(st.replace(/^[①②③④]\s*/, "")) + '</span></div>';
        }).join("") + '</div>';
  } else {
    h += '<div class="empty">把體格量起來，你的變現甜蜜路徑就會浮出來——最強兩塊的組合，就是你最省力的那條路。</div>';
  }
  return h + '</div>';
}

/* ══ 覆盤分頁：課程進度（降級卡）→ 口袋卡 → 本月數字 → 成果（市場驗證，獨立顯示
   不乘進分數，會員層看不到這頁）→ 預約場邊教練 → 改觀句骨層卡收尾。 ══ */
function lcellHTML_(l){
  var bg = l.state === "done" ? "#C6603A" : l.state === "now" ? "#FDF3EC" : "#F7F1EC";
  var fg = l.state === "done" ? "#fff" : l.state === "now" ? "#993C1D" : "#8A7266";
  return '<div class="lcell" style="background:' + bg + ';"><div class="lcell-n" style="color:' + fg + ';">' + l.k + '</div>'
    + '<div class="lcell-l" style="color:' + fg + ';">' + esc_(l.name) + '</div></div>';
}
function courseProgressCard(){
  if (WID === "超引力-公眾演說") {
    /* 完全保留 L9–L13 誠實列法：算不出進度就不裝 */
    var slv = speechLevelState();
    var srow = slv.map(function(l){
      return '<div class="lcell" style="background:#F7F1EC;"><div class="lcell-n" style="color:#8A7266;">' + l.k + '</div>'
        + '<div class="lcell-l" style="color:#8A7266;">' + esc_(l.name) + '</div></div>';
    }).join("");
    return '<div class="cd"><div class="pill" style="margin-bottom:12px;">超引力-公眾演說 · L9–L13</div>'
      + '<div class="lrow">' + srow + '</div>'
      + '<div style="font-size:13px;color:#8A7266;margin-top:12px;line-height:1.8;">' + slv.map(function(l){ return l.k + ' ' + esc_(l.desc); }).join('<br>') + '</div>'
      + '<div class="empty" style="margin-top:12px;">這門課還沒有逐字稿可以對照真進度，這裡先列真的課綱結構，算不出進度就不裝。</div></div>';
  }
  var lv = levelState();
  var base = lv.slice(0, 4), adv = lv.slice(4);
  var allDone = base.every(function(l){ return l.state === "done"; });
  var advLock = adv[0].state === "lock";
  var h = '<div class="cd"><div class="pill" style="margin-bottom:12px;">超引力-顧問課 · L1–L8</div>'
    + '<div style="font-size:13px;color:#8A7266;margin-bottom:6px;">技巧底盤 L1–L4</div>';
  if (allDone) {
    h += '<div style="font-size:13px;color:#5C7464;background:#DCE7DE;border-radius:9px;padding:9px 12px;">技巧底盤 L1–L4 ✓ 四塊肌肉都量過了</div>';
  } else {
    h += '<div class="lrow">' + base.map(lcellHTML_).join("") + '</div>';
  }
  h += '<div style="font-size:13px;color:#8A7266;margin:12px 0 6px;">應用主軸 L5–L8</div>'
    + '<div class="lrow"' + (advLock ? ' style="opacity:.45;"' : '') + '>' + adv.map(lcellHTML_).join("") + '</div>';
  if (advLock) h += '<div style="font-size:13px;color:#8A7266;margin-top:10px;line-height:1.7;">先把技巧底盤量完，應用主軸就開了</div>';
  return h + '</div>';
}
/* 本月數字：從 checkinLog 算三個真數字，沒有的就是 0，不編假資料 */
function monthStatsCard(){
  var mo = normDate(new Date()).slice(0, 7);
  var n = 0, good = 0, who = {};
  S.checkinLog.forEach(function(e){
    if (normDate(e.date).slice(0, 7) !== mo) return;
    n++;
    if (e.reaction === "明顯有" || e.reaction === "超乎預期") good++;
    if (e.target && e.target !== "陌生人") who[e.target] = true;
  });
  var cells = [["本月片刻", n], ["明顯有以上", good], ["記錄過的對象", Object.keys(who).length]];
  return '<div class="cd"><div class="pill" style="margin-bottom:12px;">本月數字</div>'
    + '<div style="display:flex;gap:8px;">' + cells.map(function(c){
        return '<div style="flex:1;background:#F7F1EC;border-radius:12px;padding:13px;text-align:center;">'
          + '<div class="stat-l">' + c[0] + '</div><div class="stat-v">' + c[1] + '</div></div>';
      }).join("") + '</div></div>';
}
/* ══ 口袋卡：L1-L4 打基礎的提示（內容真相＝productkit 口袋卡教材，pocket-cards.js 是鏡像）。
   一張卡＝技巧／解決誤區／語句／三場景，點開看。進階卡(adv)不出——老師裁定它只當
   演練的補充教材，不進回家演練。 ══ */
var PK_OPEN = null;
function togglePk_(i){ PK_OPEN = PK_OPEN === i ? null : i; render(); }
function pkColor_(d){ return d === "B" ? "#993C1D" : dimTextColor(d); }
function pkSay_(s){
  return esc_(s).replace(/&lt;br\s*\/?&gt;/g, "<br>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/＿+/g, '<span class="pk-bl"></span>');
}
function pkCardHTML_(c, i){
  var col = pkColor_(c.dim), open = PK_OPEN === i;
  var h = '<button class="pk-r" onclick="togglePk_(' + i + ')">'
    + '<span class="pk-code" style="color:' + col + ';">' + esc_(c.code) + '</span>'
    + '<span class="pk-nm">' + esc_(c.name) + '</span>'
    + '<span class="pk-ar">' + (open ? "收合 ▴" : "點開 ▾") + '</span></button>';
  if (open) {
    h += '<div class="pk-bd">'
      + '<div class="pk-lb">解決誤區</div><div class="pk-w">' + esc_(c.wrong) + '</div>'
      + '<div class="pk-lb">語句</div><div class="pk-say">' + pkSay_(c.say) + '</div>'
      + '<div class="pk-lb">三場景範例</div>'
      + c.ex.map(function(x){
          var skip = /跳過/.test(x[1]);
          return '<div class="pk-exr"' + (skip ? ' style="opacity:.45;"' : '') + '><span class="pk-exk">'
            + esc_(x[0]) + '</span><span class="pk-exv">' + esc_(x[1]) + '</span></div>';
        }).join("")
      + '</div>';
  }
  return h;
}
function pocketCardsHTML(){
  var groups = [["L0", null, "先修 · 兩個基本動作"], ["L1", "A"], ["L2", "T"], ["L3", "P"], ["L4", "I"]];
  var h = '<div class="cd"><div class="pill" style="margin-bottom:10px;">口袋卡</div>'
    + '<div style="font-size:13px;color:#8A7266;line-height:1.8;margin-bottom:2px;">L1–L4 打基礎的提示——上課練完，回家練那一招。每張卡＝語句＋三場景範例，點開看。</div>';
  groups.forEach(function(g){
    var set = [];
    PKCARDS.forEach(function(c, i){ if (c.L === g[0] && !c.adv) set.push([c, i]); });
    if (!set.length) return;
    var col = pkColor_(set[0][0].dim);
    var title = g[2] || (g[0] + " · " + ((DIMS[g[1]] || {}).name || g[1]));
    h += '<div class="pk-g" style="color:' + col + ';">' + esc_(title) + '</div>'
      + set.map(function(p){ return pkCardHTML_(p[0], p[1]); }).join("");
  });
  return h + '</div>';
}
function outHTML(){
  var h = courseProgressCard();
  h += pocketCardsHTML();
  h += monthStatsCard();
  var mv = marketValidation(S);
  h += '<div class="cd"><div style="font-size:13px;color:#8A7266;margin-bottom:14px;">會員層看不到這一頁</div>'
    + '<div class="stat-row"><div><div class="stat-l">成交回報</div><div class="stat-v">' + S.revenueLog.length + ' 筆</div></div></div>'
    + '<div class="stat-row"><div><div class="stat-l">累計金額</div><div class="stat-v">' + Math.round(mv.amount / 10000 * 10) / 10 + ' 萬</div></div>'
    + '<div class="stat-r">對齊 300 萬錨點<br>' + (mv.amtAchieve * 100).toFixed(0) + '%</div></div>'
    + '<div class="stat-row"><div><div class="stat-l">市場驗證</div><div class="stat-v">' + mv.pct + '%</div></div>'
    + '<div class="stat-r">獨立顯示<br>不乘進分數</div></div>'
    + '<div style="font-size:13px;color:#8A7266;line-height:1.75;margin-top:6px;">成交是<b style="color:#6E4A3C;">外部驗證變項</b>，獨立顯示、不回饋進能力分數。拿成交回推分數、再用分數預測成交＝循環論證。</div>'
    + (!S.revenueLog.length ? '<div class="empty" style="margin-top:8px;">還沒有成交紀錄。這裡會隨你回報成交自動更新。</div>' : '')
    + '</div>';
  h += demoP6_();
  h += '<a class="go" href="https://time.atpifit.com">預約場邊教練覆盤 →</a>'
    + '<div style="font-size:13px;color:#8A7266;text-align:center;margin-top:8px;">場邊教練陪跑・一週一次拆解</div>';
  /* 改觀句・骨層卡（骨層三問：這一格就是「為什麼」）。沒有後端欄位存改觀句，
     所以放的是邀請不是假引言——月覆盤說出來的那句，教練記在這裡。 */
  h += '<div class="bone-card" style="margin-top:18px;">'
    + '<div class="bone-k">這三個月，你的想法動了什麼？</div>'
    + '<div class="bone-q">技巧會忘，改觀不會。這裡只放<b>你自己說出來的那句</b>。</div>'
    + '<div class="bone-quote">下次月覆盤，把你最有感的那句說出來——教練幫你記在這裡。</div></div>';
  h += demoP7_();
  h += '<div class="bone-end">影響力的盡頭不是成交，<br>是有人因為你變好。</div>';
  return h;
}

/* ══ 練習：低摩擦兩下記錄（跟會員層同一招），照上升空間最大的小肌群派 ══ */
function practicePool(){
  var pool = weakestMuscles(calcMuscleScores(S), 12);
  return pool.length ? pool : ["A1", "A2", "A3"];
}
function focusMuscle(){ var pool = practicePool(); return pool[(S.pick || 0) % pool.length]; }
function focusTaskInfo(){
  var mk = focusMuscle();
  var t = TASKS.find(function(x){ return x.cadence === "daily" && taskMuscles_(x.muscle).indexOf(mk) > -1 && (!WID || x.workshopId === WID); });
  return { muscle: mk, task: t || fallbackMove(mk) };
}
function openRec(){
  var info = focusTaskInfo();
  REC = { muscle: info.muscle, task: info.task, who: null, rel: null, react: null, step: 1 };
  window.scrollTo(0, 0); render();
}
function knownTargets(){
  var map = {};
  S.checkinLog.slice().reverse().forEach(function(e){
    if (!e.target || e.target === "陌生人") return;
    if (!map[e.target]) map[e.target] = { name: e.target, rel: e.rel || "", n: 0 };
    if (e.rel && !map[e.target].rel) map[e.target].rel = e.rel;
    map[e.target].n++;
  });
  return map;
}
function recentTargets(){
  var m = knownTargets();
  return Object.keys(m).sort(function(a, b){ return m[b].n - m[a].n; }).slice(0, 4).map(function(k){ return m[k]; });
}
function recHTML(){
  var m = MUSCLES[REC.muscle], j = JUDGEMENT[REC.muscle] || {}, t = REC.task, c = DIMS[m.dim].color;
  var h = '<div class="cd"><div class="rec-hd"><button class="rec-bk" onclick="closeRec()">‹</button>'
    + '<div><div class="rec-n">' + esc_(t.name) + '</div><div class="rec-m">' + esc_(m.name) + '・' + esc_(DIM_RESULT[m.dim]) + '</div></div></div>';

  if (REC.step === 3) {
    var good = REC.react >= 2;
    return '<div class="cd"><div class="ok"><div class="ok-e">' + (good ? "🌱" : "🌾") + '</div>'
      + '<div class="ok-t">' + (good ? "他接住了。" : "你講了。<br>他今天沒回應。") + '</div>'
      + '<div class="ok-s">' + (good ? '這就是<b style="color:#993C1D;">' + esc_(m.name) + '在動</b>——記進了關係軌跡。' : '沒回應也是資料，記進去了。') + '</div></div>'
      + '<button class="sub" onclick="closeRec()">回路徑</button></div>';
  }
  if (t.desc || j.homework) h += '<div class="how">' + md_(t.desc || j.homework) + '</div>';
  /* 口袋卡提示：這塊小肌群有卡就帶出語句——L1-L4 打基礎的提示，開口前先看一眼 */
  var pk = PKCARDS.filter(function(x){ return x.code === REC.muscle && !x.adv; })[0];
  if (pk) {
    h += '<div class="how" style="border-left:3px solid ' + c + ';">'
      + '<div style="font-size:13px;color:#8A7266;margin-bottom:5px;">口袋卡 · ' + esc_(pk.name) + '</div>'
      + '<div class="pk-say">' + pkSay_(pk.say) + '</div></div>';
  }

  if (REC.step === 1) {
    var recents = recentTargets();
    h += '<div class="q">對誰？<span class="qs">點一下就好</span></div><div class="opts">'
      + recents.map(function(p){ return '<button class="op' + (REC.who === p.name ? " on" : "") + '" data-who="' + esc_(p.name) + '" data-rel="' + esc_(p.rel) + '">' + esc_(p.name) + '</button>'; }).join("")
      + '<button class="op warm" data-who="陌生人" data-rel="陌生人">陌生人</button>'
      + '<button class="op new" data-newwho="1">＋ 新的人</button></div>';
    if (REC.newRel) {
      h += '<div class="opt-wrap"><div class="opt-l">' + esc_(REC.who) + ' 是？<span class="qs">問這一次就好</span></div>'
        + '<div class="opts">' + REL.map(function(r){ return '<button class="op" data-newrel="' + esc_(r) + '">' + esc_(r) + '</button>'; }).join("") + '</div></div>';
    }
  } else {
    h += '<div class="q">對方有反應嗎？<span class="qs">點一下就好</span></div><div class="big">'
      + REACT.map(function(r){ return '<button class="bo' + (REC.react === r.v ? " on" : "") + '" data-react="' + r.v + '"><div class="bo-e">' + r.e + '</div><div class="bo-t">' + r.t + '</div></button>'; }).join("") + '</div>';
    if (REC.react >= 2) {
      h += '<div class="opt-wrap"><div class="opt-l">發生什麼？<span class="qs">選填</span></div>'
        + '<textarea class="ta" id="recnote" placeholder="他停了一下，開始講他自己的狀況"></textarea></div>';
    }
    h += '<button class="sub" id="recdone"' + (REC.react == null ? " disabled" : "") + '>' + (REC.react == null ? "先選一個" : "記下來") + '</button>';
  }
  return h + '</div>';
}
function bindRec(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-who]"), function(b){
    b.onclick = function(){ REC.who = b.getAttribute("data-who"); REC.rel = b.getAttribute("data-rel") || ""; REC.newRel = false; REC.step = 2; render(); };
  });
  var nw = document.querySelector("[data-newwho]");
  if (nw) nw.onclick = function(){ var n = prompt("這個人怎麼稱呼？（只有你看得到）"); if (n && n.trim()) { REC.who = n.trim().slice(0, 12); REC.newRel = true; render(); } };
  Array.prototype.forEach.call(document.querySelectorAll("[data-newrel]"), function(b){
    b.onclick = function(){ REC.rel = b.getAttribute("data-newrel"); REC.newRel = false; REC.step = 2; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-react]"), function(b){
    b.onclick = function(){ REC.react = Number(b.getAttribute("data-react")); render(); };
  });
  var dn = el("recdone");
  if (dn) dn.onclick = function(){
    var note = (el("recnote") || {}).value || "";
    var r = REACT.find(function(x){ return x.v === REC.react; }) || REACT[0];
    doCheckin(S, REC.task, REC.task.workshopId || WID || "", { reaction: r.t, target: REC.who || "", rel: REC.rel || "", note: note.trim() });
    REC.step = 3; render();
  };
}
function closeRec(){ REC = null; render(); }
function bindPane(){
  var box = document.getElementById("practiceBox");
  if (box) box.onclick = openRec;
}

/* 軌跡頁最底下接一張「今天練這塊」卡（CTA 下移），串進低摩擦記錄流程 */
var _pathHTML = pathHTML;
pathHTML = function(){
  var mk = focusMuscle(), m = MUSCLES[mk], j = JUDGEMENT[mk] || {};
  var isWeakest = weakestMuscles(calcMuscleScores(S), 1).indexOf(mk) > -1;
  var practiceCard = '<div class="cd" id="practiceBox" style="cursor:pointer;">'
    + '<div style="display:flex;align-items:center;gap:9px;"><span class="pill">今天練這塊</span>'
    + '<span style="margin-left:auto;font-size:13px;color:#8A7266;">' + (isWeakest ? "這季主力" : "") + '</span></div>'
    + '<div style="font-size:22px;font-weight:700;color:#4A1B0C;margin-top:10px;">' + esc_(m.name) + '</div>'
    + '<div style="font-size:15px;color:#6E4A3C;margin-top:8px;line-height:1.9;">' + esc_((j.homework || "").replace(/\*\*/g, "")) + '</div>'
    + '<button class="sub">練溝通</button></div>';
  return _pathHTML() + practiceCard;
};

boot();
