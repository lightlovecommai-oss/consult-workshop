<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>影響力健身房</title>
<meta name="apple-mobile-web-app-title" content="影響力健身房">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E6DACF">
<link rel="apple-touch-icon" href="icon3-180.png">
<link rel="icon" type="image/png" href="icon3-192.png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:title" content="影響力健身房">
<meta property="og:description" content="影響力是肌肉，只會越練越強。四大肌肉．十二小肌群，可量測、可練、練了會變現。">
<meta property="og:image" content="https://app.atpifit.com/og-image.png">
<meta property="og:url" content="https://app.atpifit.com/member.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://app.atpifit.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* ═══ 會員模式・溫暖版 ═══
   視覺規範唯一真相＝productkit 30-App介面規範（字級四級／色層四階／圓角間距／禁止清單）。
   參考實作＝demo.html（互動原型，本檔照它的畫面結構落地，換成真資料）。
   螢幕介面一律無襯線（30-規範 §1 🔴）——不用 .srf、不進宋體。 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#EFE6DE;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#4A1B0C;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:#EFE6DE;padding-bottom:84px;}

/* 畫面頭：所有畫面都用同一個，沒有例外（30-規範 §6） */
.tb{background:#E6DACF;padding:16px 16px 13px;position:sticky;top:0;z-index:30;}
.tb-r{display:flex;align-items:center;gap:11px;}
.tb-n{color:#4A1B0C;font-size:17px;font-weight:700;letter-spacing:.02em;}
.tb-d{margin-left:auto;font-size:13px;color:#8A7266;align-self:flex-start;white-space:nowrap;}
.tb-s{font-size:13px;color:#C6603A;margin-top:4px;letter-spacing:.02em;}
.hall{font-size:13px;font-weight:600;color:#993C1D;background:#F0E3DB;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.hall:empty{display:none;}

/* 三館階梯（訂閱制三方案的位置感：你在哪、上一館多什麼） */
.lad{border-radius:14px;border:1px solid #E6DAD1;padding:13px 14px;margin-bottom:9px;display:block;text-decoration:none;}
.lad.here{border-color:#C6603A;background:#fff;}
.lad.next{background:#fff;}
.lad.far{opacity:.75;}
.lad-top{display:flex;align-items:center;gap:8px;}
.lad-n{font-size:15px;font-weight:700;color:#4A1B0C;}
.lad-p{margin-left:auto;font-size:13px;color:#993C1D;font-weight:600;white-space:nowrap;}
.lad-here{font-size:11px;color:#fff;background:#C6603A;padding:2px 8px;border-radius:20px;}
.lad-d{font-size:13px;color:#6E4A3C;line-height:1.75;margin-top:6px;}

.bd{padding:20px 20px 16px;}
.cd{background:#F7F1EC;border-radius:20px;padding:20px 18px;margin-bottom:14px;}
.cw{background:#fff;border-radius:14px;padding:20px 18px;margin-bottom:14px;}

/* 分頁開場：hero 級（跟 join.html 同基因——大標一級＋ATPI 四色線，一頁一個視覺錨點） */
.hero{padding:6px 2px 18px;}
.hero-t{font-size:22px;font-weight:500;line-height:1.5;color:#4A1B0C;}
.hero-s{font-size:15px;color:#6E4A3C;margin-top:7px;line-height:1.85;}
.hero-rule{height:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);border-radius:2px;margin-top:16px;}
.sec{font-size:13px;font-weight:700;color:#6E4A3C;letter-spacing:1px;margin-bottom:14px;}

/* Nike 式首屏：資料是主角（一個大數字）＋一顆主鈕，其他全退居次要 */
.bignum{display:flex;align-items:baseline;gap:10px;margin-top:12px;}
.bignum-v{font-size:54px;font-weight:700;color:#4A1B0C;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
.bignum-l{font-size:13px;color:#6E4A3C;line-height:1.6;}
/* 主行動鈕＝磚橘（24-VI §3.8 2026-09-04 改版：深咖啡退回文字色，白字對比 4.1:1 需 ≥17px/700） */
.gobtn{display:block;width:100%;background:#C6603A;color:#fff;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;font-family:inherit;min-height:56px;box-sizing:border-box;margin-bottom:16px;}
.gobtn:active{transform:scale(.98);}
.gobtn.done{background:#DCE7DE;color:#3E5546;cursor:default;}
.strip{display:flex;align-items:center;gap:10px;padding:2px 3px 20px;}
/* 夥-2（2026-09-04 老師拍板）：跑馬燈改大字 */
.tick{font-size:17px;font-weight:700;color:#4A1B0C;text-align:center;padding:2px 10px 16px;min-height:34px;line-height:1.7;opacity:1;transition:opacity .6s;}
.lockrow{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid #F0E3DB;}
.lockrow-n{font-size:15px;font-weight:600;color:#4A1B0C;}
.lockrow-d{font-size:13px;color:#6E4A3C;margin-top:2px;line-height:1.7;}

/* 12 小肌群地圖（會員層：只看有沒有在練，不給分——分數與判讀是私人教練席的） */
.mm{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mmc{border-radius:12px;padding:10px 11px;background:#fff;border:1px solid #F0E3DB;}
.mmc.dash{border-style:dashed;background:transparent;}
.mmc-n{font-size:13px;font-weight:600;color:#4A1B0C;line-height:1.5;}
.mmc-s{font-size:11px;color:#6E4A3C;margin-top:3px;}
.gr{font-size:17px;font-weight:700;color:#4A1B0C;margin-bottom:6px;}
.tier{font-size:13px;color:#993C1D;background:#F0E3DB;padding:4px 11px;border-radius:20px;vertical-align:2px;margin-left:6px;}
.pill{font-size:13px;font-weight:600;color:#993C1D;background:#F0E3DB;padding:5px 12px;border-radius:20px;display:inline-block;}
.rule{height:1px;background:#E6DAD1;margin:18px 0;}

.stk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fls{display:flex;gap:1px;}
.fl{font-size:13px;line-height:1;}
.fl.off{opacity:.2;filter:grayscale(1);}
.stk-t{font-size:13px;color:#6E4A3C;}
.stk-t b{color:#C6603A;font-weight:700;}

/* 四塊肌肉：緊湊列（跟 demo.html 我頁一致，13px 全用——這是常駐儀表列不是初見大字） */
.mrow{margin-bottom:14px;}
.mrow:last-child{margin-bottom:0;}
.mrow-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.mrow-n{font-size:13px;font-weight:600;color:#4A1B0C;}
.mrow-s{font-size:13px;font-weight:600;}
.mrow-v{margin-left:auto;font-size:13px;color:#4A1B0C;font-variant-numeric:tabular-nums;}
.mrow-bar{height:8px;border-radius:4px;overflow:hidden;}
.mrow-fill{height:8px;border-radius:4px;transition:width .4s;}
.mrow-d{font-size:13px;color:#6E4A3C;margin-top:5px;}
/* 進-3+6 合併左右滑卡：第一屏＝次數（今天就能動）、往左滑＝四塊肌肉（慢慢動） */

.wk{font-size:13px;color:#993C1D;background:#F0E3DB;border-radius:14px;padding:11px 13px;margin-top:12px;line-height:1.75;}

/* 練習：單一焦點卡 */
.foc-hd{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
.foc-badge{margin-left:auto;background:none;border:1px solid #E6DAD1;color:#6E4A3C;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;min-height:40px;}
.foc-why{font-size:15px;color:#6E4A3C;line-height:2.05;}
.tip-t{font-size:22px;font-weight:600;color:#4A1B0C;margin:16px 0;line-height:1.55;}
.tip-h{font-size:15px;color:#5A3A2A;line-height:2.1;}
.tip-q{border-left:3px solid;padding-left:15px;margin:16px 0;font-size:17px;color:#4A1B0C;line-height:1.95;font-weight:500;}
.tip-note{font-size:15px;color:#6E4A3C;line-height:2.05;margin-top:12px;}
.sign{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #E6DAD1;font-size:13px;color:#6E4A3C;}
.done-badge{margin-top:18px;background:#DCE7DE;color:#3E5546;border-radius:14px;padding:15px;text-align:center;font-size:15px;font-weight:600;}
/* 全貌條（24-VI §3.8 第八招）：四大肌肉全圖一次露出、正在練的亮、灰格叫「還沒解鎖」 */
.map4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;}
.m4{border-radius:12px;padding:9px 4px 8px;text-align:center;background:#fff;border:1px solid #F0E3DB;}
.m4.on{border-width:1.5px;}
.m4.off{background:transparent;border-style:dashed;}
.m4-n{font-size:13px;font-weight:600;color:#4A1B0C;}
.m4.off .m4-n{color:#B4A695;}
.m4-s{font-size:11px;margin-top:3px;color:#6E4A3C;}
.m4.off .m4-s{color:#B4A695;}
.map4-note{font-size:13px;color:#6E4A3C;margin-top:10px;line-height:1.8;}
/* 展開版練習腳本（judgement.js DRILL）：找誰→怎麼開口→台詞→重點→怎麼算成功 */
.dr-row{display:flex;gap:10px;margin-top:12px;font-size:15px;color:#4A1B0C;line-height:1.9;}
.dr-l{flex-shrink:0;font-size:13px;font-weight:700;color:#993C1D;background:#F0E3DB;border-radius:20px;padding:2px 10px;height:fit-content;margin-top:4px;}
.win{margin-top:16px;background:#F7F1EC;border-radius:14px;padding:13px 14px;}
.win-t{font-size:13px;font-weight:700;color:#6E4A3C;margin-bottom:8px;}
.win-y{font-size:15px;color:#4A1B0C;line-height:1.85;}
.win-n{font-size:15px;color:#6E4A3C;line-height:1.85;margin-top:8px;padding-top:8px;border-top:1px solid #E6DAD1;}

.week{display:flex;gap:6px;}
.wd{flex:1;text-align:center;}
.wd-b{height:36px;border-radius:14px;background:#F0E3DB;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
.wd-b.on{background:#C6603A;}
.wd-b.todo{background:#fff;border:1.5px dashed #C6603A;cursor:pointer;box-sizing:border-box;}
.wd-l{font-size:13px;color:#6E4A3C;margin-top:6px;}

/* ── 練習頁 v3（2026-09-04 拍板：一次一技巧＋圖鑑14格＋週圓環＋完成時刻）── */
.p3top{display:flex;align-items:center;margin-bottom:18px;}
.p3swap{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid #E6DAD1;background:#fff;color:#8A7266;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:transform .25s;padding:0;}
.p3swap:active{transform:rotate(180deg) scale(.92);}
.p3kick{font-size:13px;color:#8A7266;letter-spacing:2px;margin-bottom:8px;}
.p3big{font-size:40px;font-weight:700;line-height:1.25;letter-spacing:1px;color:#4A1B0C;}
.p3how{font-size:16px;color:#5A3A2A;line-height:1.9;margin-top:12px;}
.p3how b{color:#C6603A;}
.p3q{margin-top:16px;background:linear-gradient(90deg,#FDF3EC,#fff 60%);border-left:6px solid #C6603A;border-radius:8px 16px 16px 8px;padding:14px 16px;box-shadow:0 2px 10px rgba(74,27,12,.05);}
@keyframes slidein{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.p3q-k{font-size:12px;color:#8A7266;margin-bottom:5px;}
.p3q-t{font-size:15px;color:#4A1B0C;line-height:1.8;}
.p3more{margin-top:12px;}
.p3more-h{display:flex;align-items:center;gap:6px;font-size:13.5px;color:#8A7266;cursor:pointer;padding:8px 0;user-select:none;}
.p3more-h .chev{transition:transform .3s;}
.p3more.open .chev{transform:rotate(180deg);}
.p3more-b{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1);}
.p3more.open .p3more-b{max-height:500px;}
.p3mr{display:flex;gap:10px;font-size:13.5px;line-height:1.85;color:#5A3A2A;padding:7px 0;}
.p3mr b{flex-shrink:0;color:#993C1D;font-weight:700;width:78px;}
.p3go{display:block;box-sizing:border-box;margin-top:20px;width:100%;background:#C6603A;color:#fff;border:0;border-radius:18px;padding:18px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;min-height:60px;box-shadow:0 6px 18px rgba(198,96,58,.28);transition:transform .15s;text-align:center;}
.p3go:active{transform:scale(.97);}
.p3go.done{background:#DCE7DE;color:#3E5546;box-shadow:none;cursor:default;}
.p3gos{margin-top:10px;text-align:center;font-size:13px;color:#8A7266;}
.p3map{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.p3c{border-radius:10px;padding:9px 4px;text-align:center;font-size:11.5px;line-height:1.4;color:#8A7266;background:#fff;border:1px solid #EFE5DC;transition:all .4s;}
.p3c.core{grid-column:span 2;font-weight:700;color:#4A1B0C;font-size:13px;}
.p3c.on{border-color:#C6603A;color:#4A1B0C;font-weight:700;}
.p3c.on .p3d{background:#C6603A;}
.p3c.cur{box-shadow:0 0 0 2px rgba(198,96,58,.25);}
.p3d{width:7px;height:7px;border-radius:50%;margin:0 auto 4px;background:#D9C6B8;transition:all .4s;}
.p3c.pop{animation:p3pop .7s cubic-bezier(.34,1.56,.64,1);border-color:#C6603A;box-shadow:0 0 0 4px rgba(198,96,58,.18);color:#4A1B0C;font-weight:700;}
.p3c.pop .p3d{background:#C6603A;transform:scale(1.4);}
@keyframes p3pop{0%{transform:scale(1);}45%{transform:scale(1.18);}100%{transform:scale(1);}}
.p3check{width:64px;height:64px;border-radius:50%;background:#C6603A;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:p3cpop .6s cubic-bezier(.34,1.56,.64,1);position:relative;}
@keyframes p3cpop{0%{transform:scale(0);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.p3fw{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;opacity:0;animation:p3boom .9s ease-out forwards;pointer-events:none;}
@keyframes p3boom{0%{transform:translate(-4px,-4px) scale(.4);opacity:1;}100%{transform:translate(calc(var(--dx) - 4px),calc(var(--dy) - 4px)) scale(1);opacity:0;}}
.p3bone{margin:16px 2px 2px;font-size:15px;color:#4A1B0C;line-height:1.85;text-align:center;animation:p3fade 1s .4s both;}
@keyframes p3fade{from{opacity:0;}to{opacity:1;}}
.p3badge{margin-top:14px;background:#FDF6F0;border:1.5px solid #C99A4E;border-radius:14px;padding:13px;text-align:center;font-size:15px;color:#4A1B0C;font-weight:600;line-height:1.7;}
.p3flip{margin-top:13px;perspective:600px;cursor:pointer;}
.p3fl-in{position:relative;transition:transform .6s;transform-style:preserve-3d;min-height:52px;}
.p3flip.fl .p3fl-in{transform:rotateY(180deg);}
.p3fl-f,.p3fl-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;padding:10px;}
.p3fl-f{background:#F0E3DB;color:#6E4A3C;}
.p3fl-b{background:#4A1B0C;color:#F7F1EC;transform:rotateY(180deg);font-size:15px;font-weight:600;}
.p3wrev{margin-top:12px;border-top:1px solid #F0E3DB;padding-top:4px;}
.p3wrev-h{font-size:13px;color:#8A7266;cursor:pointer;padding:8px 0;user-select:none;display:flex;align-items:center;}
.p3wr{display:flex;gap:9px;font-size:13px;color:#5A3A2A;line-height:1.75;padding:6px 0;border-top:1px dashed #F0E3DB;}
.p3wr b{flex-shrink:0;color:#993C1D;font-weight:700;}

/* 開練流程 */
.rec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rec-bk{background:none;border:0;color:#6E4A3C;font-size:22px;cursor:pointer;padding:0 4px 0 0;line-height:1;font-family:inherit;min-height:44px;}
.rec-n{font-size:15px;font-weight:700;color:#4A1B0C;}
.rec-m{font-size:13px;color:#6E4A3C;margin-top:2px;}
.how{background:#F7F1EC;border-radius:14px;padding:13px 14px;margin-bottom:14px;font-size:15px;color:#4A1B0C;line-height:1.9;}
.how b{color:#993C1D;}
.q{font-size:15px;font-weight:700;color:#4A1B0C;margin-bottom:11px;}
.qs{font-size:13px;color:#6E4A3C;font-weight:400;margin-left:6px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.op{font-size:13px;padding:11px 16px;border-radius:20px;border:1px solid #E6DAD1;background:#fff;color:#4A1B0C;cursor:pointer;font-family:inherit;min-height:44px;}
.op:active{transform:scale(.97);}
.op.on{background:#C6603A;border-color:#C6603A;color:#fff;font-weight:600;}
.op.warm{background:#F7F1EC;}
.op.new{color:#6E4A3C;border-style:dashed;}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bo{padding:15px 10px;border-radius:14px;border:1px solid #E6DAD1;background:#fff;cursor:pointer;text-align:center;font-family:inherit;min-height:44px;}
.bo:active{transform:scale(.97);}
.bo.on{border-color:#C6603A;background:#F3D9CD;}
.bo-e{font-size:22px;line-height:1;margin-bottom:5px;}
.bo-t{font-size:13px;color:#4A1B0C;font-weight:500;}
.opt-wrap{margin-top:15px;border-top:1px solid #F0E3DB;padding-top:14px;}
.opt-l{font-size:13px;font-weight:700;color:#4A1B0C;margin-bottom:4px;}
.opt-h{font-size:13px;color:#6E4A3C;margin-bottom:9px;line-height:1.7;}
.ta{width:100%;background:#F7F1EC;border:1px solid #E6DAD1;border-radius:14px;padding:11px;font-size:17px;color:#4A1B0C;font-family:inherit;line-height:1.6;min-height:64px;resize:vertical;}
.ta:focus{outline:none;border-color:#C6603A;background:#fff;}
.shr{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:13px;color:#4A1B0C;cursor:pointer;min-height:44px;}
.shr-box{width:19px;height:19px;border-radius:5px;border:1.5px solid #C6603A;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;}
.shr-box.on{background:#C6603A;}
/* 15px/600 低於磚橘白字的 AA 大字級門檻，按 24-VI §3.8 用深版 #AF5433（5.07:1） */
.sub{width:100%;background:#AF5433;color:#fff;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:15px;font-family:inherit;min-height:44px;}
.sub[disabled]{background:#D8C9BC;color:#F7F1EC;}
.ok{text-align:center;padding:10px 0 4px;}
.ok-e{font-size:32px;line-height:1;margin-bottom:14px;}
.ok-t{font-size:28px;color:#4A1B0C;margin-bottom:12px;line-height:1.4;}
.ok-s{font-size:15px;color:#5A3A2A;line-height:1.95;}

/* 館：兩層動態流 */
.stat{font-size:15px;color:#4A1B0C;line-height:1.8;}
.stat b{font-size:28px;font-weight:700;color:#C6603A;font-variant-numeric:tabular-nums;vertical-align:-3px;}
.avs{display:flex;flex-shrink:0;}

  }
  return h + '</div>';
}

      + '</div>';
  }
  if (!S.member) h += lockedHTML();

  S.checkinLog.slice().reverse().forEach(function(e){
    if (!e.target || e.target === "陌生人") return;
    if (!map[e.target]) map[e.target] = { name: e.target, rel: e.rel || "", n: 0 };

/* ══════════ 三個月驗收（層 3・關係軌跡搬到這裡，改讀對方反應）══════════
   只挑一個人、不攤開；至少要有兩個不同日子的紀錄才叫「並排」，資料不夠就不出現——
   不是日常功能，是資料夠了才出現的驗收時刻。刻意的煞車（不可拿掉）：
   家人／朋友走到「他願意說」就夠，這裡不推向成交／升單。 */
function reviewCandidate(){
  var byTarget = {};
  S.checkinLog.forEach(function(e){
    if (!e.target || e.target === "陌生人" || !e.reaction) return;
    var t = byTarget[e.target] || (byTarget[e.target] = { entries: [], rel: "" });
    if (e.rel && !t.rel) t.rel = e.rel;
    t.entries.push(e);
  });
  var names = Object.keys(byTarget).filter(function(n){ return byTarget[n].entries.length >= 2; })
    .sort(function(a, b){ return byTarget[b].entries.length - byTarget[a].entries.length; });
  if (!names.length) return null;
  var n = names[0], t = byTarget[n];
  var sorted = t.entries.slice().sort(function(a, b){ return normDate(a.date) < normDate(b.date) ? -1 : 1; });
  var first = sorted[0], last = sorted[sorted.length - 1];
  if (normDate(first.date) === normDate(last.date)) return null;
  return { name: n, rel: t.rel, first: first, last: last, count: t.entries.length };
}
function reviewRowText(e){
  return e.note ? esc_(e.note) : "跟他聊了" + (MUSCLES[logMuscles_(e)[0]] ? esc_(MUSCLES[logMuscles_(e)[0]].name.replace("讓他", "")) : "一些事");

  var soft = SOFT_REL.indexOf(r.rel) > -1;
  var h = '<div class="cw"><div style="margin-bottom:16px;">' + '<span class="pill">紀錄夠了・可以驗收</span></div>'
    + '<div style="font-size:17px;font-weight:600;color:#4A1B0C;line-height:1.7;margin-bottom:18px;">不用看分數。<br>看你自己寫的這兩筆就好。</div>'
    + '<div class="rev-pc"><div class="rev-av">' + esc_(r.name.slice(0,1)) + '</div>'
    + '<div><div class="rev-n">' + esc_(r.name) + (r.rel ? '<span class="tier" style="margin-left:6px;">' + esc_(r.rel) + '</span>' : '') + '</div>'
    + '<div class="rev-s">' + r.count + ' 個片刻・跨了 ' + Math.max(1, Math.round((new Date(normDate(r.last.date)) - new Date(normDate(r.first.date))) / 86400000)) + ' 天</div></div></div>'
    /* 進-2（2026-09-04 老師拍板）：紀錄只有兩件事——我做的動作＋他的回饋，標籤寫明 */
    + '<div class="rev-pair">'
    + '<div class="rev-row"><div class="rev-when">' + esc_(timeAgo(r.first.date)) + '（第一次記下）</div>'
      + '<div class="rev-what"><span style="color:#8A7266;font-weight:700;">我做了：</span>' + reviewRowText(r.first) + '</div>'
      + '<div class="rev-react"><b>對方：</b>' + esc_(echoPhrase_(r.first.reaction)) + '</div></div>'
    + '<div class="rev-row now"><div class="rev-when">' + esc_(timeAgo(r.last.date)) + '（最近一次）</div>'
      + '<div class="rev-what"><span style="color:#8A7266;font-weight:700;">我做了：</span>' + reviewRowText(r.last) + '</div>'
      + '<div class="rev-react"><b>對方：</b>' + esc_(echoPhrase_(r.last.reaction)) + '</div></div>'
    + '</div>';
  if (soft) {
    h += '<div class="fam">這段不用走完——他願意跟你說真話，就已經是你要的了。</div>';
  } else {
    /* 提醒不說服（2026-09-04 老師拍板：話別太多）——一句收尾就好 */
    h += '<div class="rev-insight">從「' + esc_(r.first.reaction) + '」到「' + esc_(r.last.reaction) + '」——這段關係在動。想看下一步，找你的場邊教練。</div>';
  }
  return h + '</div>';
}

/* ══ 分頁 3：進步（四塊肌肉狀態 + 累積 + 驗收）══
   數字露出政策（30-規範 §8）：會員只露分，且格式鎖死——狀態詞在前、分數在後、上次的值同框；
   缺「上次的差」就不准出現數字，退回只給狀態詞。12 個小肌群的分數不在這層打開（那是私教學員才看的）。 */
function dimStatusWord(v){
  if (v == null) return "還沒量";
  if (v < 2.5) return "還沒開始練";
  if (v < 3.75) return "正在長";
  return "已經在長";
}
function dimHistory_(s, mk){
  return (s.evalLog || []).filter(function(e){ return String(e.muscle).toUpperCase() === mk; })
    .sort(function(a, b){ return normDate(a.date) < normDate(b.date) ? -1 : 1; });
}
function dimScoreNowPrev(s, dim){
  var now = {}, prev = {};
  musclesOfDim(dim).forEach(function(mk){
    var hist = dimHistory_(s, mk);
    if (hist.length) now[mk] = hist[hist.length - 1].score;
    if (hist.length >= 2) prev[mk] = hist[hist.length - 2].score;
  });
  var nowVals = Object.keys(now).map(function(k){ return now[k]; });
  var prevVals = Object.keys(prev).map(function(k){ return prev[k]; });
  return {
    now: nowVals.length ? nowVals.reduce(function(a,b){return a+b;},0) / nowVals.length : null,
    prev: prevVals.length ? prevVals.reduce(function(a,b){return a+b;},0) / prevVals.length : null
  };
}
/* ══ 進-4（2026-09-04 老師拍板）：獨立的 12 塊卡退役，併進四塊卡——點大肌肉展開它的 3 塊小肌群。
   30-規範 §8 不變：12 塊給「有沒有在練」不給分數（小肌群分數是私教學員層才打開）。 ══ */
var ME_OPEN = {};
function toggleDim_(k){ if (!S.member) return; ME_OPEN[k] = !ME_OPEN[k]; render(); }
function dimSubHTML_(k){
  var sc = calcMuscleScores(S), fm = focusMuscle();
  return '<div style="margin-top:9px;display:grid;gap:6px;animation:slidein .22s ease;">' + musclesOfDim(k).map(function(mk){
    var m = MUSCLES[mk], n = muscleTrainCount(S, mk);
    var measured = sc[mk] != null, focus = mk === fm;
    var st = focus ? '這季主力' : n > 0 ? '練了 ' + n + ' 次' : measured ? '量過・還沒練' : '還沒量';
    return '<div style="display:flex;align-items:center;gap:7px;font-size:13px;color:#4A1B0C;background:#F7F1EC;border-radius:10px;padding:8px 11px;">'
      + '<span style="width:7px;height:7px;border-radius:50%;background:' + DIMS[k].color + ';flex-shrink:0;"></span>'
      + '<span>' + esc_(m.name) + '</span>'
      + '<span style="margin-left:auto;color:' + (focus ? dimTextColor(k) : '#8A7266') + ';' + (focus ? 'font-weight:700;' : '') + '">' + st + '</span></div>';
  }).join('') + '</div>';
}
function sweetPathHTML(){
  var d5 = calcDimScores5(S);
  var ms = DORD.filter(function(k){ return d5[k] != null; });
  var h = '<div class="cw" style="border:1px solid #E6DAD1;">'
    + '<div class="pill" style="margin-bottom:12px;">私人教練席才開的</div>';
  if (ms.length >= 2) {
    var sorted5 = ms.sort(function(a, b){ return d5[b] - d5[a]; });
    var top2 = sorted5.slice(0, 2), low1 = sorted5[sorted5.length - 1];
    var combo = COMBO_PATH[top2.slice().sort().join("")];
    /* 進-4（2026-09-04 老師拍板）：露出 1-2 步、3-4 步上迷霧——用 UI 解鎖手法替代文字說明。
       文案「下一塊」用正向講（赤字語言禁用：不寫缺/弱/補）。 */
    var steps = (combo.flow || "").split("\n").filter(function(x){ return x.trim(); });
    var stepRow_ = function(st, i, fog){
      return '<div style="display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:#4A1B0C;line-height:1.8;padding:6px 0;'
        + (fog ? 'filter:blur(5px);user-select:none;pointer-events:none;' : '') + '"' + (fog ? ' aria-hidden="true"' : '') + '>'
        + '<span style="flex-shrink:0;width:20px;height:20px;border-radius:50%;background:#F0E3DB;color:#993C1D;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px;">' + (i + 1) + '</span>'
        + '<span>' + esc_(st.replace(/^[①②③④]\s*/, "")) + '</span></div>';
    };
    var open2 = steps.slice(0, 2).map(function(st, i){ return stepRow_(st, i, false); }).join("");
    var fog2 = steps.slice(2).map(function(st, i){ return stepRow_(st, i + 2, true); }).join("");
    h += '<div style="font-size:15px;color:#4A1B0C;line-height:1.9;">你最強的兩塊已經浮出來了：<b>'
      + esc_(DIMS[top2[0]].name) + ' × ' + esc_(DIMS[top2[1]].name) + '</b>。<br>'
      + '這個組合有一條變現甜蜜路徑——<b>「' + esc_(combo.title) + '」</b>：用你已經最順的兩塊，走最省力的那條變現路。</div>'
      + '<div style="margin-top:10px;">' + open2 + '</div>'
      + (fog2
        ? '<div style="position:relative;">' + fog2
          + '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(247,241,236,.2),rgba(247,241,236,.8));border-radius:10px;">'
          + '<span style="background:#4A1B0C;color:#E8C89A;font-size:12.5px;font-weight:700;border-radius:20px;padding:6px 13px;">🔒 後兩步在私人教練席解鎖</span></div></div>'
        : '')
      + '<div style="margin-top:10px;font-size:13px;color:#6E4A3C;line-height:1.85;">你的下一塊拼圖是<b style="color:' + dimTextColor(low1) + ';">' + esc_(DIMS[low1].name) + '</b>——先練它最有感。</div>'
      + '<a class="gobtn" style="margin:13px 0 0;" href="' + BOOK_URL + '">預約教練諮詢，把這條路走完 →</a>';
  } else {
    h += '<div style="font-size:15px;color:#4A1B0C;line-height:1.9;">把體格量起來，你的<b>變現甜蜜路徑</b>就會浮出來——最強兩塊的組合，就是你最省力的那條路。</div>';
  }
  return h + '</div>';
}

function meHTML(){
  /* 進-1（2026-09-04 老師拍板）：365 天倍數句只用正向——影響力是肌肉，只會越練越強，沒有退步句 */
  var h = '<div class="hero"><div class="hero-t">你的進步</div>'
    + '<div class="hero-s">不跟別人比——只跟上次的你比。<br><b style="color:#C6603A;">每天進步 1%，一年後是 37 倍。</b></div>'
    + '<div class="hero-rule"></div></div>';
  h += S.member ? reviewHTML() : "";
  if (!S.member) h += ctaCard('分數是機器算的，<b style="color:#4A1B0C;">看懂它要人</b>。NT$99 讓場邊教練幫你把健檢解開——指出你先練哪塊最有感、下一步怎麼走。');

  /* 進-3+6 合併左右滑卡（2026-09-04 老師：兩張是同方向內容、合一張）：
     第一屏＝這個月的次數（今天就能動）、往左滑＝四塊肌肉狀態（慢慢動）——「先看右邊」變成「先看第一屏」 */
  var mrowsMe = DORD.map(function(k){
    var np = dimScoreNowPrev(S, k), v = np.now;
    var word = dimStatusWord(v);
    var showScore = v != null && np.prev != null;
    var diff = showScore ? Math.round((v - np.prev) * 10) / 10 : 0;
    var open = S.member && ME_OPEN[k];
    return '<div class="mrow"' + (S.member ? ' onclick="toggleDim_(\'' + k + '\')" style="cursor:pointer;"' : '') + '><div class="mrow-top">'
      + '<span class="mrow-n">' + esc_(DIMS[k].name) + '</span>'
      + '<span class="mrow-s" style="color:' + (v == null ? "#8A7266" : dimTextColor(k)) + ';">' + word + '</span>'
      + (showScore ? '<span class="mrow-v">' + v.toFixed(1) + ' / 滿分 5</span>' : '')
      + (S.member ? '<span style="' + (showScore ? '' : 'margin-left:auto;') + 'align-self:center;flex-shrink:0;width:24px;height:24px;border-radius:50%;background:' + (open ? DIMS[k].soft : '#F7F1EC') + ';color:#993C1D;font-size:12px;display:flex;align-items:center;justify-content:center;">' + (open ? '▴' : '▾') + '</span>' : '')
      + '</div>'
      + '<div class="mrow-bar" style="background:' + (v == null ? "transparent" : DIMS[k].soft) + ';' + (v == null ? "border:1px dashed #E6DAD1;" : "") + '">'
      + '<div class="mrow-fill" style="width:' + (v == null ? 0 : pct5(v)) + '%;background:' + DIMS[k].color + ';"></div></div>'
      + (showScore ? '<div class="mrow-d">' + (diff > 0 ? "比上次多了 " + diff : diff < 0 ? "比上次少了 " + Math.abs(diff) : "跟上次一樣") + '</div>' : "")
      + (open ? dimSubHTML_(k) : "")
      + '</div>';
  }).join("");
  var anyMeasured = MORD.some(function(k){ return calcMuscleScores(S)[k] != null; });
  var d5me = calcDimScores5(S);
  var valsMe = DORD.map(function(k){ return d5me[k]; }).filter(function(v){ return v != null; });
  var avgMe = valsMe.length ? valsMe.reduce(function(a, b){ return a + b; }, 0) / valsMe.length : null;
  var ymMe = todayStr().slice(0, 7);
  var monthMe = S.checkinLog.filter(function(e){ return normDate(e.date).slice(0, 7) === ymMe; }).length;
  /* 進-3 v3（2026-09-04 老師拍板）：不左右滑了，第二區直接接在下面直排 */
  var block1 = '<div class="sec">你的進步儀表</div><div style="display:flex;gap:10px;">'
    + '<div style="flex:1;background:#F7F1EC;border-radius:14px;padding:13px;">'
    + '<div style="font-size:13px;color:#6E4A3C;margin-bottom:7px;">這個月練了</div>'
    + '<div style="font-size:28px;font-weight:700;color:#C6603A;line-height:1;font-variant-numeric:tabular-nums;">' + monthMe + '<span style="font-size:13px;color:#8A7266;"> 次</span></div>'
    + '<div style="font-size:13px;color:#6E4A3C;margin-top:6px;">沒練的日子不扣</div></div>'
    + '<div style="flex:1;background:#F7F1EC;border-radius:14px;padding:13px;">'
    + '<div style="font-size:13px;color:#6E4A3C;margin-bottom:7px;">你的肌肉</div>'
    + '<div style="font-size:17px;color:#4A1B0C;line-height:1.2;">' + dimStatusWord(avgMe) + '</div>'
    + '<div style="font-size:13px;color:#6E4A3C;margin-top:6px;">' + (avgMe != null ? avgMe.toFixed(1) + ' / 滿分 5' : '量了就有數字') + '</div></div></div>'
    + '<div style="font-size:13px;color:#6E4A3C;line-height:1.8;margin-top:12px;">次數你今天就能動，肌肉會慢慢跟上——<b style="color:#4A1B0C;">先顧次數。</b></div>';
  var block2 = '<div style="margin-top:16px;border-top:1px solid #F0E3DB;padding-top:14px;"><div class="sec">你的四塊影響力肌肉</div>' + mrowsMe
    + (anyMeasured
      ? '<div class="wk">還沒量不等於 0 分——空的不是零，是這塊還沒測過。</div>'
      : '<div class="wk">還沒量過。<a href="https://quiz.atpifit.com" style="color:#993C1D;font-weight:700;">先做一次 ATPI 測驗 »</a>，或直接開始練——練了就會有數字。</div>')
    + '</div>';
  h += '<div class="cd">' + block1 + block2 + '</div>';

  if (S.member) h += sweetPathHTML();
  /* 進-總 v3（2026-09-04 老師拍板）：位置階梯放最後——看完進步，看見下一席
     2026-09-05 併入 n-7：12 格點亮圖＋續費支點句（withMap 只有進步頁帶） */
  h += ladderHTML(true);
  return h;
}

boot();
</script>
