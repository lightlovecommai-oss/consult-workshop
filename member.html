<style>
/* ═══ 會員模式・溫暖版 ═══
   視覺規範唯一真相＝productkit 30-App介面規範（字級四級／色層四階／圓角間距／禁止清單）。
   參考實作＝demo.html（互動原型，本檔照它的畫面結構落地，換成真資料）。
   螢幕介面一律無襯線（30-規範 §1 🔴）——不用 .srf、不進宋體。 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#EFE6DE;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#4A1B0C;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:#EFE6DE;padding-bottom:84px;}

/* 畫面頭：所有畫面都用同一個，沒有例外（30-規範 §6） */
.tb{background:#E6DACF;padding:16px 16px 13px;position:sticky;top:0;z-index:30;}
.tb-r{display:flex;align-items:center;gap:11px;}
.tb-n{color:#4A1B0C;font-size:17px;font-weight:700;letter-spacing:.02em;}
.tb-d{margin-left:auto;font-size:13px;color:#8A7266;align-self:flex-start;white-space:nowrap;}
.tb-s{font-size:13px;color:#C6603A;margin-top:4px;letter-spacing:.02em;}

.bd{padding:16px;}
.cd{background:#F7F1EC;border-radius:20px;padding:18px 16px;margin-bottom:14px;}
.cw{background:#fff;border-radius:14px;padding:18px 16px;margin-bottom:14px;}
.gr{font-size:17px;font-weight:700;color:#4A1B0C;margin-bottom:6px;}
.tier{font-size:13px;color:#993C1D;background:#F0E3DB;padding:4px 11px;border-radius:20px;vertical-align:2px;margin-left:6px;}
.pill{font-size:13px;font-weight:600;color:#993C1D;background:#F0E3DB;padding:5px 12px;border-radius:20px;display:inline-block;}
.rule{height:1px;background:#E6DAD1;margin:18px 0;}

.stk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fls{display:flex;gap:1px;}
.fl{font-size:13px;line-height:1;}
.fl.off{opacity:.2;filter:grayscale(1);}
.stk-t{font-size:13px;color:#6E4A3C;}
.stk-t b{color:#C6603A;font-weight:700;}

/* 四塊肌肉：緊湊列（跟 demo.html 我頁一致，13px 全用——這是常駐儀表列不是初見大字） */
.mrow{margin-bottom:14px;}
.mrow:last-child{margin-bottom:0;}
.mrow-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.mrow-n{font-size:13px;font-weight:600;color:#4A1B0C;}
.mrow-s{font-size:13px;font-weight:600;}
.mrow-v{margin-left:auto;font-size:13px;color:#4A1B0C;font-variant-numeric:tabular-nums;}
.mrow-bar{height:8px;border-radius:4px;overflow:hidden;}
.mrow-fill{height:8px;border-radius:4px;transition:width .4s;}
.mrow-d{font-size:13px;color:#6E4A3C;margin-top:5px;}

.wk{font-size:13px;color:#993C1D;background:#F0E3DB;border-radius:14px;padding:11px 13px;margin-top:12px;line-height:1.75;}

/* 練習：單一焦點卡 */
.foc-hd{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
.foc-badge{margin-left:auto;background:none;border:1px solid #E6DAD1;color:#6E4A3C;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;min-height:40px;}
.foc-why{font-size:15px;color:#6E4A3C;line-height:2.05;}
.tip-t{font-size:22px;font-weight:600;color:#4A1B0C;margin:16px 0;line-height:1.55;}
.tip-h{font-size:15px;color:#5A3A2A;line-height:2.1;}
.tip-q{border-left:3px solid;padding-left:15px;margin:16px 0;font-size:17px;color:#4A1B0C;line-height:1.95;font-weight:500;}
.tip-note{font-size:15px;color:#6E4A3C;line-height:2.05;margin-top:12px;}
.sign{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #E6DAD1;font-size:13px;color:#6E4A3C;}
.done-badge{margin-top:18px;background:#DCE7DE;color:#3E5546;border-radius:14px;padding:15px;text-align:center;font-size:15px;font-weight:600;}

.week{display:flex;gap:6px;}
.wd{flex:1;text-align:center;}
.wd-b{height:36px;border-radius:14px;background:#F0E3DB;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
.wd-b.on{background:#C6603A;}
.wd-l{font-size:13px;color:#6E4A3C;margin-top:6px;}

/* 開練流程 */
.rec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rec-bk{background:none;border:0;color:#6E4A3C;font-size:22px;cursor:pointer;padding:0 4px 0 0;line-height:1;font-family:inherit;min-height:44px;}
.rec-n{font-size:15px;font-weight:700;color:#4A1B0C;}
.rec-m{font-size:13px;color:#6E4A3C;margin-top:2px;}
.how{background:#F7F1EC;border-radius:14px;padding:13px 14px;margin-bottom:14px;font-size:15px;color:#4A1B0C;line-height:1.9;}
.how b{color:#993C1D;}
.q{font-size:15px;font-weight:700;color:#4A1B0C;margin-bottom:11px;}
.qs{font-size:13px;color:#6E4A3C;font-weight:400;margin-left:6px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.op{font-size:13px;padding:11px 16px;border-radius:20px;border:1px solid #E6DAD1;background:#fff;color:#4A1B0C;cursor:pointer;font-family:inherit;min-height:44px;}
.op:active{transform:scale(.97);}
.op.on{background:#C6603A;border-color:#C6603A;color:#fff;font-weight:600;}
.op.warm{background:#F7F1EC;}
.op.new{color:#6E4A3C;border-style:dashed;}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bo{padding:15px 10px;border-radius:14px;border:1px solid #E6DAD1;background:#fff;cursor:pointer;text-align:center;font-family:inherit;min-height:44px;}
.bo:active{transform:scale(.97);}
.bo.on{border-color:#C6603A;background:#F3D9CD;}
.bo-e{font-size:22px;line-height:1;margin-bottom:5px;}
.bo-t{font-size:13px;color:#4A1B0C;font-weight:500;}
.opt-wrap{margin-top:15px;border-top:1px solid #F0E3DB;padding-top:14px;}
.opt-l{font-size:13px;font-weight:700;color:#4A1B0C;margin-bottom:4px;}
.opt-h{font-size:13px;color:#6E4A3C;margin-bottom:9px;line-height:1.7;}
.ta{width:100%;background:#F7F1EC;border:1px solid #E6DAD1;border-radius:14px;padding:11px;font-size:17px;color:#4A1B0C;font-family:inherit;line-height:1.6;min-height:64px;resize:vertical;}
.ta:focus{outline:none;border-color:#C6603A;background:#fff;}
.shr{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:13px;color:#4A1B0C;cursor:pointer;min-height:44px;}
.shr-box{width:19px;height:19px;border-radius:5px;border:1.5px solid #C6603A;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;}
.shr-box.on{background:#C6603A;}
.sub{width:100%;background:#4A1B0C;color:#F7F1EC;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:15px;font-family:inherit;min-height:44px;}
.sub[disabled]{background:#D8C9BC;color:#F7F1EC;}
.ok{text-align:center;padding:10px 0 4px;}
.ok-e{font-size:32px;line-height:1;margin-bottom:14px;}
.ok-t{font-size:28px;color:#4A1B0C;margin-bottom:12px;line-height:1.4;}
.ok-s{font-size:13px;color:#5A3A2A;line-height:1.95;}

/* 館：兩層動態流 */
.stat{font-size:13px;color:#4A1B0C;line-height:1.8;}
.stat b{font-size:28px;font-weight:700;color:#C6603A;font-variant-numeric:tabular-nums;vertical-align:-3px;}
.avs{display:flex;flex-shrink:0;}
.av{width:26px;height:26px;border-radius:50%;border:2px solid #F7F1EC;margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;}
.av:first-child{margin-left:0;}
.feed-h{font-size:13px;color:#6E4A3C;margin:16px 3px 10px;}
.slim{background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;}
.slim-tag{margin-left:auto;flex-shrink:0;font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;}
.slim-r{font-size:13px;color:#6E4A3C;margin-top:7px;padding-left:39px;}
.card-top{display:flex;align-items:center;gap:9px;}
.card-n{font-size:13px;font-weight:700;color:#4A1B0C;}
.card-b{font-size:11px;color:#993C1D;background:#F0E3DB;padding:2px 8px;border-radius:20px;}
.card-w{font-size:13px;color:#6E4A3C;margin-top:2px;}
.card-body{font-size:13px;color:#4A1B0C;line-height:1.75;margin-top:10px;}
.card-body span{color:#6E4A3C;}
.card-echo{background:#F7F1EC;border-radius:14px;padding:10px 11px;margin-top:8px;font-size:13px;color:#4A1B0C;line-height:1.7;}
.card-echo span{color:#6E4A3C;}
.cheer{display:flex;align-items:center;gap:6px;border:1px solid #E6DAD1;background:#fff;color:#6E4A3C;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;min-height:40px;margin-top:10px;}
.cheer.on{border-color:#C6603A;background:#C6603A;color:#fff;}
.mock{font-size:11px;color:#B4A695;border:1px dashed #D8C9BC;padding:1px 7px;border-radius:20px;margin-left:6px;}
.empty{font-size:13px;color:#6E4A3C;line-height:1.85;text-align:center;padding:8px 4px;}

/* 三個月驗收（層 3・搬進來的關係軌跡） */
.rev-pc{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.rev-av{width:32px;height:32px;border-radius:50%;background:#C6603A;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600;flex-shrink:0;}
.rev-n{font-size:15px;font-weight:700;color:#4A1B0C;}
.rev-s{font-size:13px;color:#6E4A3C;margin-top:2px;}
.rev-pair{display:flex;gap:10px;align-items:stretch;}
.rev-row{flex:1;background:#F0E3DB;border-radius:14px;padding:15px;}
.rev-row.now{background:#DCE7DE;}
.rev-when{font-size:13px;color:#6E4A3C;margin-bottom:9px;}
.rev-what{font-size:15px;color:#4A1B0C;line-height:1.9;}
.rev-react{font-size:13px;color:#6E4A3C;line-height:1.8;margin-top:9px;padding-top:9px;border-top:1px solid #E6DAD1;}
.rev-row.now .rev-react{color:#3E5546;border-top-color:rgba(62,85,70,.18);}
.rev-insight{font-size:15px;color:#5A3A2A;line-height:2.05;margin-top:16px;}
.rev-note{text-align:center;font-size:13px;color:#8A7266;margin-top:13px;line-height:1.8;}
.fam{background:#DCE7DE;border-radius:14px;padding:12px 13px;font-size:13px;color:#3E5546;line-height:1.75;margin-top:14px;}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;background:#F7F1EC;border-top:1px solid #E6DAD1;display:flex;padding:8px 0 max(11px,env(safe-area-inset-bottom));}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:#B4A695;background:none;border:0;cursor:pointer;padding:5px 0;font-family:inherit;min-height:44px;}
.nv.on{color:#C6603A;}
.nv-i{font-size:19px;line-height:1;}
.hide{display:none;}
.loading{text-align:center;padding:56px 20px;color:#6E4A3C;font-size:15px;}
.spin{width:30px;height:30px;border:3px solid #E6DAD1;border-top-color:#C6603A;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg);}}
:focus-visible{outline:2px solid #C6603A;outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

  <div class="tb">

      <svg width="30" height="22" viewBox="-52 -30 104 72" aria-hidden="true"><g fill="none" stroke="#4A1B0C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-36 -22 L36 -22 Q48 -22 48 -10"/><path d="M48 -10 L48 10 Q48 22 36 22"/><path d="M36 22 L-6 22 L-16 36 L-22 22 L-36 22 Q-48 22 -48 10"/><path d="M-48 10 L-48 -10 Q-48 -22 -36 -22"/></g><circle cx="-21" cy="0" r="5" fill="#C6603A"/><circle cx="-7" cy="0" r="5" fill="#6E8B77"/><circle cx="7" cy="0" r="5" fill="#6E8CA8"/><circle cx="21" cy="0" r="5" fill="#C99A4E"/></svg>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
/* ═══ 會員模式 ═══
   關掉的板塊（字典「兩種 TA 的贏法」鐵則②：別拿變現的尺量會員）：
     變現潛力／成交回報／市場驗證／愛的貨幣兌換／全域排行榜。
   核心不同：開練不是打勾，是**記下對方的反應**（低摩擦守則：必填只有兩下點擊）。
   ⚠️ 尚未做的事（有意留白，見交接記錄）：demo.html 有一個 S.member（體驗客／會員）切換，
   決定要不要秀 99 升級頁與社群完整內容——但後端目前沒有「是否已付 99」這個欄位
   （學員分頁只有 lineId/姓名/團隊/enrolled），沒資料可以判斷就不亂猜，這裡先當作已入館
   （跟改版前的行為一致），等後端補欄位再接上這個切換。 */
var S = null, WID = null, PANE = "gym";
var REC = null;   // 開練中 {muscle, task, who, react, note, share}
var HFEED = [];   // 榮譽解鎖真事件（loadHonorFeed，一行式那層的真資料來源）
var GYM_POSTS = []; // 真的分享到館裡貼文（loadGymPosts，有打字那層的真資料來源）

var REACT = [
  {e:"😌", t:"沒特別", v:0},
  {e:"🙂", t:"有一點", v:1},
  {e:"😃", t:"明顯有", v:2},
  {e:"🤩", t:"超乎預期", v:3}
];
/* 關係標籤：家人／朋友走到「願意說」就夠了，不推向成交（字典「刻意的煞車」） */
var REL = ["工作", "客戶", "家人", "朋友"];
var SOFT_REL = ["家人", "朋友"];   // 這兩種走到「願意說」就夠，不推向成交

function el(id){ return document.getElementById(id); }
function esc_(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function md_(t){ return esc_(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function pct5(v){ return Math.max(0, Math.min(100, (v - 1) / 4 * 100)); }
function timeAgo(dateStr){
  var ms = Date.now() - new Date(normDate(dateStr) + "T12:00:00").getTime();
  var days = Math.round(ms / 86400000);
  if (days <= 0) return "今天";
  if (days === 1) return "昨天";
  if (days < 7) return days + " 天前";
  return Math.round(days / 7) + " 週前";
}

/* ── demo 模式（?demo=1）──
   給「還沒接後端」時試互動用：假資料全在前端，開練不寫 Sheet。
   線上後端部署完成後就不需要它，但留著也能當招生示範。 */
var DEMO = false;
function demoState() {
  function ago(i){ var d = new Date(Date.now() - i * 86400000); return todayStr(d); }
  function ck(mk, i, target, rel, reaction, note) {
    return { workshopId:"", taskKey:"m_" + mk.toLowerCase(), cadence:"daily", dim:mk.charAt(0),
             muscle:mk, pts:1, date:ago(i), week:weekStr(new Date(ago(i))),
             target:target || "", rel:rel || "", reaction:reaction || "", note:note || "" };
  }
  return {
    lineId:"DEMO", name:"Amy", team:"",
    /* ?demo=1 預設當會員（跟改版前行為一致）；加 &member=0 可以看體驗客會少什麼 */
    member: new URLSearchParams(location.search).get("member") !== "0",
    /* 體驗客的秘訣輪流靠這個；demo 用 &visits=3 之類的直接指定第幾次上線 */
    visits: Number(new URLSearchParams(location.search).get("visits")) || 1,
    checkinLog:[ ck("T1",1,"陳大哥","工作","明顯有","「我早就感覺到了」"), ck("T2",2,"陳大哥","工作","超乎預期"),
                 ck("P1",3,"陳大哥","工作","有一點"), ck("A2",3,"林小姐","客戶","沒特別"),
                 ck("A1",4,"妹妹","家人","明顯有"), ck("T2",5,"妹妹","家人","超乎預期"),
                 ck("A3",6,"妹妹","家人","有一點"),
                 ck("T1",68,"陳大哥","工作","有一點","跟他講了工作的事，他只回「還好」") ],
    revenueLog:[],
    evalLog:[ {muscle:"A1",score:3,source:"quiz",date:ago(20),week:""},
              {muscle:"A2",score:2,source:"self",date:ago(6),week:""},
              {muscle:"A3",score:2,source:"self",date:ago(6),week:""},
              {muscle:"T1",score:4,source:"self",date:ago(6),week:""},
              {muscle:"T2",score:3,source:"self",date:ago(6),week:""},
              {muscle:"T3",score:5,source:"self",date:ago(6),week:""},
              {muscle:"T1",score:2,source:"self",date:ago(40),week:""},
              {muscle:"T2",score:2,source:"self",date:ago(40),week:""},
              {muscle:"P1",score:3,source:"self",date:ago(6),week:""},
              {muscle:"P2",score:1,source:"coach",date:ago(6),week:""},
              {muscle:"P3",score:3,source:"self",date:ago(6),week:""} ]
  };
}

/* ── 開機 ── */
async function boot() {
  var qs = new URLSearchParams(location.search);
  if (qs.get("demo") === "1") {
    DEMO = true;
    postToSheet = function(){ return Promise.resolve(); };   // demo 不寫 Sheet
    TASKS = []; S = demoState(); WID = "";
    el("nav").classList.remove("hide");
    render();
    return;
  }
  var uid = qs.get("id");
  if (!uid) {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      uid = (await liff.getProfile()).userId;
    } catch (e) {
      el("bd").innerHTML = '<div class="loading">請從 LINE 進入，或在網址加上 ?id=你的 LINE userId</div>';

    }
  }
  var d = await loadBootstrap(uid, "");
  if (!d) { el("bd").innerHTML = '<div class="loading">讀不到資料，請稍後再試。</div>'; return; }
  if (d.tasks) TASKS = d.tasks;
  var st = d.student || {};
  S = { lineId: st.lineId || uid, name: st.name || "", team: st.team || "", member: !!st.paidMember,
        checkinLog: d.checkins || [], revenueLog: d.revenue || [], evalLog: d.evals || [] };
  WID = d.defaultWorkshop || "";
  S.visits = bumpVisitCount_(S.lineId);
  el("nav").classList.remove("hide");
  render();
  loadHonorFeed(20).then(function(events){ HFEED = events || []; if (PANE === "gym") render(); });
  loadGymPosts(6).then(function(posts){ GYM_POSTS = posts || []; if (PANE === "gym") render(); });
}

/* 體驗客的「每次上線一個新秘訣」要跨次開站都記得上次給到第幾個——後端沒有這個欄位
   （純前端偏好，不是需要跨裝置同步的資料），存 localStorage 剛好，記不住就從頭來，不影響正確性。 */

}

/* ══════════ 練習焦點：一季只練一塊（老師 2026-09-01 定案）══════════
   候選池＝最弱 2 塊大肌肉的小肌群（模組 3 規格「最弱2塊大肌肉=6個小肌群，一個推薦＋換一個」）。
   排序：練過的（比較有手感、見效快）排前面，同等再看誰分數低——沒有「6 選 1 硬編表」，
   全部從真資料算，量不到就退回新手起手式 A1→A3。 */
function weakestTwoDimMuscles(s) {
  var scores = calcMuscleScores(s), d5 = calcDimScores5(s);
  var measuredDims = DORD.filter(function(k){
    return musclesOfDim(k).some(function(mk){ return scores[mk] != null; });
  });
  if (!measuredDims.length) return [];
  var pickDims = measuredDims.slice().sort(function(a,b){ return d5[a] - d5[b]; }).slice(0, 2);
  var ms = [];
  pickDims.forEach(function(d){
    musclesOfDim(d).forEach(function(mk){ if (scores[mk] != null) ms.push(mk); });
  });
  return ms.sort(function(a, b){
    var ca = muscleTrainCount(s, a) > 0, cb = muscleTrainCount(s, b) > 0;
    if (ca !== cb) return ca ? -1 : 1;
    return scores[a] - scores[b];
  });
}
function focusPool(){
  var pool = weakestTwoDimMuscles(S);
  return pool.length ? pool : ["A1", "A2", "A3"];
}
/* 體驗客的候選池＝最卡「那一塊大肌肉」的 3 個小肌群（模組2規格：不是最弱2塊、是最弱1塊），
   照 MORD 固定順序（如 T1→T2→T3），輪流靠「上線次數」不是日期——多數人隔幾週才回來，
   按日期發他一定錯過。這條是模組2文件裡標記「整個模組最漂亮的一條」的機制，
   同時解掉時間問題、枯竭問題、界線問題，不能省略。 */
function weakestBigDimMuscles(s){
  var d5 = calcDimScores5(s), scores = calcMuscleScores(s);
  var measuredDims = DORD.filter(function(k){ return musclesOfDim(k).some(function(mk){ return scores[mk] != null; }); });
  var dim = measuredDims.length ? measuredDims.slice().sort(function(a,b){ return d5[a] - d5[b]; })[0] : "A";
  return musclesOfDim(dim);
}
function focusMuscle(){
  if (!S.member) {
    var free = weakestBigDimMuscles(S);
    return free[(S.visits - 1) % free.length];
  }
  var pool = focusPool();
  return pool[(S.pick || 0) % pool.length];
}
/* 體驗客/會員內容差異：
   ①練習——體驗客最卡那一塊大肌肉的3個秘訣按上線次數輪流、沒有「換一個」；
     會員在最弱2塊大肌肉(6個小肌群)裡自己挑、有「換一個」（模組2/3規格的分野，兩邊池子不一樣）
   ②看不到教練解盤卡/三個月驗收卡
   社群完整內容沒做，是因為沒有真的內容/資料可以撐，硬做會變成編假資料，寧可先不做。 */
function ctaCard(t){
  return '<div class="cw" style="border:1px solid #E6DAD1;">'
    + '<div class="pill" style="margin-bottom:12px;">會員才看得到</div>'
    + '<div style="font-size:15px;color:#4A1B0C;line-height:1.9;">' + t + '</div>'
    + '<div style="font-size:13px;color:#6E4A3C;margin-top:11px;line-height:1.8;">想加入的話，私訊你的場邊教練就可以——這裡還沒接線上付款。</div>'
    + '</div>';
}
function focusTaskInfo(){
  var mk = focusMuscle();
  var t = TASKS.find(function(x){
    return x.cadence === "daily" && taskMuscles_(x.muscle).indexOf(mk) > -1 && (!WID || x.workshopId === WID);
  });
  return { muscle: mk, task: t || fallbackMove(mk) };
}
function doneToday_(mk){
  var today = taskDayStr();
  return S.checkinLog.some(function(e){ return e.date === today && logMuscles_(e).indexOf(mk) > -1; });
}
function weekDates_(){
  var now = new Date(), day = now.getDay() || 7;
  var monday = new Date(now); monday.setDate(now.getDate() - (day - 1));
  var out = [];
  for (var i = 0; i < 7; i++) { var d = new Date(monday); d.setDate(monday.getDate() + i); out.push(d); }
  return out;
}

function knownTargets(){
  var map = {};
  S.checkinLog.slice().reverse().forEach(function(e){
    if (!e.target || e.target === "陌生人") return;
    if (!map[e.target]) map[e.target] = { name: e.target, rel: e.rel || "", n: 0 };
    if (e.rel && !map[e.target].rel) map[e.target].rel = e.rel;
    map[e.target].n++;
  });
  return map;
}
function recentTargets(){
  var m = knownTargets();
  return Object.keys(m).sort(function(a, b){ return m[b].n - m[a].n; }).slice(0, 4).map(function(k){ return m[k]; });

/* ══════════ 三個月驗收（層 3・關係軌跡搬到這裡，改讀對方反應）══════════
   只挑一個人、不攤開；至少要有兩個不同日子的紀錄才叫「並排」，資料不夠就不出現——
   不是日常功能，是資料夠了才出現的驗收時刻。刻意的煞車（不可拿掉）：
   家人／朋友走到「他願意說」就夠，這裡不推向成交／升單。 */
function reviewCandidate(){
  var byTarget = {};
  S.checkinLog.forEach(function(e){
    if (!e.target || e.target === "陌生人" || !e.reaction) return;
    var t = byTarget[e.target] || (byTarget[e.target] = { entries: [], rel: "" });
    if (e.rel && !t.rel) t.rel = e.rel;
    t.entries.push(e);
  });
  var names = Object.keys(byTarget).filter(function(n){ return byTarget[n].entries.length >= 2; })
    .sort(function(a, b){ return byTarget[b].entries.length - byTarget[a].entries.length; });
  if (!names.length) return null;
  var n = names[0], t = byTarget[n];
  var sorted = t.entries.slice().sort(function(a, b){ return normDate(a.date) < normDate(b.date) ? -1 : 1; });
  var first = sorted[0], last = sorted[sorted.length - 1];
  if (normDate(first.date) === normDate(last.date)) return null;
  return { name: n, rel: t.rel, first: first, last: last, count: t.entries.length };
}
function reviewRowText(e){
  return e.note ? esc_(e.note) : "跟他聊了" + (MUSCLES[logMuscles_(e)[0]] ? esc_(MUSCLES[logMuscles_(e)[0]].name.replace("讓他", "")) : "一些事");
}
function reviewHTML(){
  var r = reviewCandidate();
  if (!r) return "";
  var soft = SOFT_REL.indexOf(r.rel) > -1;
  var h = '<div class="cw"><div style="margin-bottom:16px;">' + '<span class="pill">紀錄夠了・可以驗收</span></div>'
    + '<div style="font-size:17px;font-weight:600;color:#4A1B0C;line-height:1.7;margin-bottom:18px;">不用看分數。<br>看你自己寫的這兩筆就好。</div>'
    + '<div class="rev-pc"><div class="rev-av">' + esc_(r.name.slice(0,1)) + '</div>'
    + '<div><div class="rev-n">' + esc_(r.name) + (r.rel ? '<span class="tier" style="margin-left:6px;">' + esc_(r.rel) + '</span>' : '') + '</div>'
    + '<div class="rev-s">' + r.count + ' 個片刻・跨了 ' + Math.max(1, Math.round((new Date(normDate(r.last.date)) - new Date(normDate(r.first.date))) / 86400000)) + ' 天</div></div></div>'
    + '<div class="rev-pair">'
    + '<div class="rev-row"><div class="rev-when">' + esc_(timeAgo(r.first.date)) + '（第一次記下）</div>'
      + '<div class="rev-what">' + reviewRowText(r.first) + '</div>'
      + '<div class="rev-react">對方：' + esc_(r.first.reaction) + '</div></div>'
    + '<div class="rev-row now"><div class="rev-when">' + esc_(timeAgo(r.last.date)) + '（最近一次）</div>'
      + '<div class="rev-what">' + reviewRowText(r.last) + '</div>'
      + '<div class="rev-react">對方：' + esc_(r.last.reaction) + '</div></div>'
    + '</div>';
  if (soft) {
    h += '<div class="fam">這段不用走完——他願意跟你說真話，就已經是你要的了。</div>';
  } else {
    h += '<div class="rev-insight">從「' + esc_(r.first.reaction) + '」到「' + esc_(r.last.reaction) + '」，這段關係在動。'
      + '<br>下一步不是再練久一點，<b style="color:#4A1B0C;">是有人在旁邊看你怎麼講</b>——這件事你自己看紀錄看不出來，跟你的場邊教練聊聊。</div>';
  }
  return h + '</div>';
}

/* ══ 分頁 3：進步（四塊肌肉狀態 + 累積 + 驗收）══
   數字露出政策（30-規範 §8）：會員只露分，且格式鎖死——狀態詞在前、分數在後、上次的值同框；
   缺「上次的差」就不准出現數字，退回只給狀態詞。12 個小肌群的分數不在這層打開（那是私教學員才看的）。 */
function dimStatusWord(v){
  if (v == null) return "還沒量";
  if (v < 2.5) return "還沒開始練";
  if (v < 3.75) return "正在長";
  return "已經在長";
}
function dimHistory_(s, mk){
  return (s.evalLog || []).filter(function(e){ return String(e.muscle).toUpperCase() === mk; })
    .sort(function(a, b){ return normDate(a.date) < normDate(b.date) ? -1 : 1; });
}
function dimScoreNowPrev(s, dim){
  var now = {}, prev = {};
  musclesOfDim(dim).forEach(function(mk){
    var hist = dimHistory_(s, mk);
    if (hist.length) now[mk] = hist[hist.length - 1].score;
    if (hist.length >= 2) prev[mk] = hist[hist.length - 2].score;
  });
  var nowVals = Object.keys(now).map(function(k){ return now[k]; });
  var prevVals = Object.keys(prev).map(function(k){ return prev[k]; });
  return {
    now: nowVals.length ? nowVals.reduce(function(a,b){return a+b;},0) / nowVals.length : null,
    prev: prevVals.length ? prevVals.reduce(function(a,b){return a+b;},0) / prevVals.length : null
  };
}
function meHTML(){
  var h = S.member ? reviewHTML() : "";
  if (!S.member) h += ctaCard('教練解盤、三個月驗收都是會員才看得到——那是有人陪你看紀錄，不是自動算出來的分數。');

  h += '<div class="cd"><div style="font-size:13px;font-weight:700;color:#6E4A3C;margin-bottom:16px;">你的四塊溝通肌肉</div>';
  h += DORD.map(function(k){
    var np = dimScoreNowPrev(S, k), v = np.now;
    var word = dimStatusWord(v);
    var showScore = v != null && np.prev != null;
    var diff = showScore ? Math.round((v - np.prev) * 10) / 10 : 0;
    return '<div class="mrow"><div class="mrow-top">'
      + '<span class="mrow-n">' + esc_(DIMS[k].name) + '</span>'
      + '<span class="mrow-s" style="color:' + (v == null ? "#8A7266" : dimTextColor(k)) + ';">' + word + '</span>'
      + (showScore ? '<span class="mrow-v">' + v.toFixed(1) + ' / 滿分 5</span>' : '')
      + '</div>'
      + '<div class="mrow-bar" style="background:' + (v == null ? "transparent" : DIMS[k].soft) + ';' + (v == null ? "border:1px dashed #E6DAD1;" : "") + '">'
      + '<div class="mrow-fill" style="width:' + (v == null ? 0 : pct5(v)) + '%;background:' + DIMS[k].color + ';"></div></div>'
      + (showScore ? '<div class="mrow-d">' + (diff > 0 ? "比上次多了 " + diff : diff < 0 ? "比上次少了 " + Math.abs(diff) : "跟上次一樣") + '</div>' : "")
      + '</div>';
  }).join("");
  var anyMeasured = MORD.some(function(k){ return calcMuscleScores(S)[k] != null; });
  h += anyMeasured
    ? '<div class="wk">還沒量不等於 0 分——空的不是零，是這塊還沒測過。</div>'
    : '<div class="wk">還沒量過。先做一次 ATPI 測驗，或直接開始練——練了就會有數字。</div>';
  h += '</div>';

  var measured = MORD.filter(function(k){ return calcMuscleScores(S)[k] != null; }).length;
  var withReaction = S.checkinLog.filter(function(e){ return e.reaction; }).length;
  h += '<div class="cw"><div style="font-size:13px;font-weight:700;color:#6E4A3C;margin-bottom:14px;">你的累積</div>'
    + [['練了幾次', S.checkinLog.length], ['記下的片刻', withReaction],
       ['連續天數', currentStreak(S)], ['已量小肌群', measured + ' / 12']].map(function(r){
      return '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;">'
        + '<span style="color:#4A1B0C;">' + r[0] + '</span>'
        + '<span style="font-weight:700;color:#C6603A;">' + r[1] + '</span></div>';
    }).join("") + '</div>';
  return h;
}

boot();
</script>
