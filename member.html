<style>
/* ═══ 會員模式 v11（2026-09-14：demo-member-v5 驗過轉正）═══
   畫面真相＝demo-member-v5.html（2026-09-11 大改版拍板：薄片語言／反饋當主角／全貌感常駐），
   這支只做「demo 假資料 → S 真資料」的轉接，版面一片不動。
   ① 視覺＝24-VI §3.9 薄片語言（三態薄片／高度=量·顏色=身分／斜切共軸／I金紅線）
   ② 功能＝客戶反饋當主角：打卡問「他走到哪了」（ATPI 反饋階梯），不問「你做了沒」
   ③ 全貌感常駐：席位路徑條每個分頁都在（現在位置亮、灰格叫還沒解鎖、終點放骨層句） */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#F7F1EC;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#4A1B0C;-webkit-font-smoothing:antialiased;}
/* 席位色：藍＝我在哪一席（骨架、數字、標籤），行動色橘只留給「要按的」。
   member.html 也會渲染體驗席（未付費直開的防呆），所以走變數不寫死。 */
body{--sd:#54718D;--st:#DDE6EE;}
body.seat-v{--sd:#5C7464;--st:#DCE7DE;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:#F7F1EC;padding-bottom:84px;}

/* 席位橫幅：體驗席＝T綠／會員席＝P藍（私教席金在 pro.html 那頭），載入中先咖啡漸層 */
.tb{background:linear-gradient(135deg,#4A1B0C,#6B3018);padding:16px 20px 14px;color:#fff;}
.tb.seat-v{background:linear-gradient(135deg,#5C7464,#6E8B77);}
.tb.seat-m{background:linear-gradient(135deg,#54718D,#6E8CA8);}
.tb-k{display:flex;align-items:center;font-size:11px;letter-spacing:3px;font-weight:700;color:rgba(255,255,255,.85);}
.tb-d{margin-left:auto;font-size:12px;color:rgba(255,255,255,.75);letter-spacing:.5px;white-space:nowrap;}
.tb-r{display:flex;align-items:center;gap:10px;margin-top:9px;}
.tb-n{color:#fff;font-size:19px;font-weight:900;letter-spacing:.02em;}
.tb-s{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:5px;letter-spacing:.02em;}
.hall{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:20px;white-space:nowrap;margin-left:auto;}
.hall:empty{display:none;}
.aa-btn{margin-left:10px;font-size:13px;font-weight:800;letter-spacing:0;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);border-radius:14px;padding:3px 10px;cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap;}

.bd{padding:20px 20px 16px;}
.cd,.cw{background:#fff;border:1px solid #E8DDD3;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(90,60,30,.05);}
.hero{background:linear-gradient(160deg,#fff 0%,#FDF6EF 100%);border:1px solid #E8DDD3;border-radius:18px;padding:20px 18px 18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(90,60,30,.10);}
.sec{font-size:12px;font-weight:700;color:#8A7266;letter-spacing:2px;margin:0 0 12px;}
.sec b{color:var(--sd);font-size:13px;letter-spacing:1px;}
.kick{display:flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:2px;color:#8A7266;margin-bottom:8px;}
.big-t{font-size:22px;font-weight:900;line-height:1.5;}
.big-t em{font-style:normal;color:var(--sd);}
.sub-t{font-size:15px;color:#6E4A3C;margin-top:7px;line-height:1.85;}
.rule4{height:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);border-radius:2px;margin-top:16px;}

/* ═ 薄片原語（§3.9 九條的 CSS 落法）═
   共軸：一律 skewX(-12deg)、origin 釘在基線（底邊）→ 所有片同角同軸。
   三態：.now 實色＝現在/這一個；.past 淡填＝走過/既有；.todo 虛線＝還沒到。
   I 金紅線：實色態不鋪 #C99A4E，改淡底＋深版 #8E682B 描邊（.now.gold）。 */
.slw{--sg:0px;}
.srow{display:flex;align-items:flex-end;gap:7px;border-bottom:2px solid rgba(74,27,12,.22);padding:6px calc(4px + var(--sg,0px)) 0 4px;}
.sl{flex:1;border-radius:6px 6px 0 0;transform:skewX(-12deg);transform-origin:50% 100%;position:relative;transition:height .4s cubic-bezier(.4,0,.2,1);}
/* 滿格軌（2026-09-15）：只有 MUSCLE MAP 那兩排會傳 full——那兩排才有「滿格」這件事。
   階梯／週軌那些排是階段不是分數，不給軌。 */
.sl::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fh,0px);background:rgba(74,27,12,.055);border-radius:6px 6px 0 0;z-index:-1;}
.sl.todo{background:transparent!important;border:1.5px dashed #9C8879;border-bottom:0;}
.sl.now.gold{background:#F1E5CC!important;border:2px solid #8E682B;border-bottom:0;}
.slbl{display:flex;gap:7px;padding:7px calc(4px + var(--sg,0px)) 0 4px;}
.slbl span{flex:1;text-align:center;font-size:12px;font-weight:700;color:#4A1B0C;line-height:1.45;}
.slbl span i{display:block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:1px;}
.slbl span.dim{color:#8A7266;font-weight:600;}
/* 可點的薄片（口袋卡入口）：光暈脈動＋標籤下的「點我」小徽——薄片本身長得不像按鈕，要講出來 */
.sl.tap{cursor:pointer;animation:sltap 1.9s ease-in-out infinite;}
@keyframes sltap{0%,100%{box-shadow:0 0 0 0 var(--tc,rgba(198,96,58,.45));}50%{box-shadow:0 0 0 7px rgba(198,96,58,0);}}
.slbl span em.tapchip{display:inline-block;font-style:normal;font-size:10px;font-weight:800;color:#fff;background:#C6603A;border-radius:9px;padding:1px 7px;margin-top:4px;letter-spacing:.05em;}
.slv{display:flex;gap:7px;padding:0 calc(4px + var(--sg,0px)) 0 4px;}
.slv span{flex:1;text-align:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}

/* 席位路徑＝頁尾次要 CTA（幽靈框描下一階識別色）：整條路一次露出＋按了參觀下一階 */
.seatpath{background:transparent;border:1.5px solid #C99A4E;border-radius:16px;padding:13px 14px 12px;margin:18px 0 4px;cursor:pointer;}
.sp-cta{margin-top:10px;border-top:1px dashed #E8C89A;padding-top:10px;text-align:center;font-size:14px;font-weight:800;color:#8E682B;}
.sp-row{display:flex;align-items:flex-end;gap:6px;border-bottom:2px solid rgba(74,27,12,.22);padding:2px 2px 0;}
.sp{border-radius:5px 5px 0 0;transform:skewX(-12deg);transform-origin:50% 100%;}
.sp.past{background:#DCE7DE;}
.sp.now{background:#6E8CA8;box-shadow:0 2px 8px rgba(110,140,168,.35);}
.sp.now.g{background:#6E8B77;box-shadow:0 2px 8px rgba(110,139,119,.35);}
.sp.todo{border:1.5px dashed #9C8879;border-bottom:0;}
.sp-lbl{display:flex;gap:6px;padding:6px 2px 0;font-size:11.5px;font-weight:700;}
.sp-goal{flex:1.6;align-self:center;font-size:12px;color:#6E4A3C;line-height:1.6;padding:0 2px 4px 8px;}
.sp-goal b{color:#8E682B;}
.sp-here{font-size:10px;font-weight:800;letter-spacing:.5px;color:#54718D;white-space:nowrap;}

/* 主行動鈕（CTA 三層：練習鈕＝磚橘柔漸層／錢鈕＝磚橘→金漸層・一頁一顆） */
.gobtn{display:block;width:100%;background:linear-gradient(135deg,#C6603A 0%,#AF5433 100%);box-shadow:0 4px 12px rgba(198,96,58,.20);color:#fff;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;font-family:inherit;min-height:56px;box-sizing:border-box;margin-top:18px;}
.gobtn:active{transform:scale(.98);}
.gobtn.done{background:var(--st);color:var(--sd);box-shadow:none;cursor:default;}
.gobtn.money{background:linear-gradient(135deg,#C6603A 0%,#C99A4E 100%);text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:0 6px 18px rgba(198,96,58,.28);}
.howq{margin-top:14px;background:#FAF3EA;border-left:3px solid var(--sd);border-radius:0 12px 12px 0;padding:12px 14px;}
.howq-k{font-size:12px;color:#8A7266;margin-bottom:5px;}
.howq-t{font-size:15px;line-height:1.8;}
/* 換一個 ⟳（v3 練-1 拍板：純 icon 無底色無框——次要按鈕不搶眼） */
.p3swap{margin-left:auto;width:36px;height:36px;border:none;background:none;color:#B8A08E;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:transform .25s;padding:0;}
.p3swap:active{transform:rotate(180deg) scale(.92);}

/* 詳解摺疊 */
.drill-tg{width:100%;background:none;border:0;color:var(--sd);font-weight:700;font-size:13.5px;padding:12px 0 2px;cursor:pointer;font-family:inherit;min-height:44px;text-align:center;}
.drill{margin-top:8px;border-top:1px dashed #E8DDD3;}
.dr{padding:10px 2px 9px;border-bottom:1px dashed #F0E3DB;}
.dr:last-child{border-bottom:0;}
.dr-k{font-size:11.5px;color:#8A7266;font-weight:700;letter-spacing:1.5px;margin-bottom:3px;}
.dr-v{font-size:14px;line-height:1.85;}
.dr-v b{color:var(--sd);}

/* 週薄片列＋THIS WEEK 卡＋明天預告卡 */
.wk{margin-top:16px;border-top:1px dashed #E8DDD3;padding-top:12px;}
.wk .slbl span{font-size:11px;}
.wkline{font-size:15px;}
.wkline b{font-size:24px;font-weight:900;color:var(--sd);font-variant-numeric:tabular-nums;margin:0 2px;}
.wkline span{display:block;font-size:12.5px;color:#8A7266;margin-top:2px;}
.tmr{display:flex;align-items:center;gap:14px;}
.tmr-chip{flex-shrink:0;width:52px;height:52px;border-radius:14px;background:var(--st);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:var(--sd);line-height:1.2;}
.tmr-chip span{font-size:10.5px;font-weight:700;color:#8A7266;letter-spacing:1px;}
.tmr-t{font-size:15.5px;font-weight:800;}
.tmr-s{font-size:13px;color:#8A7266;margin-top:3px;line-height:1.7;}

/* 里程碑（慶祝的理由=他前進了） */
.mile{margin-top:14px;background:#FDF6EF;border:1.5px solid #E8C89A;border-radius:12px;padding:11px 13px;font-size:14.5px;font-weight:700;text-align:left;}
.mile span{display:block;font-size:12.5px;color:#8A7266;font-weight:400;margin-top:3px;}
.fwwrap{position:relative;width:64px;height:64px;margin:0 auto;}
.fw{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;animation:fly .9s ease-out both;}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.35);opacity:0;}}

/* 分享到館＋鼓勵 */
.share-tg{display:block;width:100%;margin-top:12px;font-size:13.5px;padding:12px 16px;border-radius:14px;border:1.5px dashed #C9B4A4;background:none;color:#6E4A3C;cursor:pointer;font-family:inherit;min-height:44px;text-align:left;}
.share-tg.on{border:1.5px solid #5C7464;background:#DCE7DE;color:#3E5546;font-weight:600;}
.slim-ft{display:flex;align-items:center;margin-top:9px;}
.cheer{font-size:12.5px;padding:6px 13px;border-radius:16px;border:1px solid #E6DAD1;background:#fff;color:#6E4A3C;cursor:pointer;font-family:inherit;min-height:32px;}
.cheer.on{background:#F3D9CD;border-color:#C6603A;color:#AF5433;font-weight:700;}
.mine-tag{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:1px;color:#54718D;}

/* 開練流程 */
.rec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rec-bk{background:none;border:0;color:#6E4A3C;font-size:22px;cursor:pointer;padding:0 4px 0 0;line-height:1;font-family:inherit;min-height:44px;}
.rec-n{font-size:15px;font-weight:700;}
.rec-m{font-size:13px;color:#6E4A3C;margin-top:2px;}
.q{font-size:15px;font-weight:700;margin:4px 0 11px;}
.qs{font-size:13px;color:#6E4A3C;font-weight:400;margin-left:6px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.op{font-size:13px;padding:11px 16px;border-radius:20px;border:1px solid #E6DAD1;background:#fff;color:#4A1B0C;cursor:pointer;font-family:inherit;min-height:44px;}
.op:active{transform:scale(.97);}
.op.on{background:#C6603A;border-color:#C6603A;color:#fff;font-weight:600;}
.op.warm{background:#F7F1EC;}
.op.new{color:#6E4A3C;border-style:dashed;}
.opt-wrap{margin-top:15px;border-top:1px solid #F0E3DB;padding-top:14px;}
.opt-l{font-size:13px;font-weight:700;color:#4A1B0C;margin-bottom:4px;}
.brake{margin-top:12px;background:#DCE7DE;border-radius:12px;padding:10px 12px;font-size:13px;color:#3E5546;line-height:1.75;}
.ta{width:100%;background:#F7F1EC;border:1px solid #E6DAD1;border-radius:14px;padding:11px;font-size:17px;font-family:inherit;line-height:1.6;min-height:64px;resize:vertical;margin-top:9px;}
.ta:focus{outline:none;border-color:#C6603A;background:#fff;}
.sub{width:100%;background:#AF5433;color:#fff;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:15px;font-family:inherit;min-height:44px;}
.sub[disabled]{background:#D8C9BC;color:#F7F1EC;}
.skip{width:100%;margin-top:8px;background:none;border:0;color:#8A7266;font-size:13px;cursor:pointer;font-family:inherit;min-height:44px;}

/* 反應階梯（打卡第二步的主圖形）：點選哪片，那片實色、之前淡填、之後虛線 */
.ladder{margin-top:6px;padding-right:14px;} /* 最高片 118px 的斜角呼吸位 */
.ladder .sl{cursor:pointer;}
.lad-note{font-size:12.5px;color:#8A7266;margin-top:10px;line-height:1.7;}

/* 完成頁 */
.ok{text-align:center;padding:10px 0 4px;}
.ok-t{font-size:26px;margin:14px 0 10px;line-height:1.4;font-weight:600;}
.ok-s{font-size:15px;color:#5A3A2A;line-height:1.95;}
.p3check{width:64px;height:64px;border-radius:50%;background:#C6603A;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;animation:cpop .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes cpop{0%{transform:scale(0);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.echo{background:#fff;border-left:3px solid var(--sd);border-radius:0 12px 12px 0;padding:11px 13px;margin-top:12px;font-size:14px;line-height:1.75;text-align:left;}
.echo span{display:block;font-size:12px;color:#8A7266;margin-top:4px;}
.bone{margin:16px 2px 2px;font-size:15px;line-height:1.85;text-align:center;animation:bfade 1s .4s both;cursor:pointer;}
@keyframes bfade{from{opacity:0;}to{opacity:1;}}
.tapback{text-align:center;font-size:12.5px;color:#B39C89;margin-top:8px;cursor:pointer;padding:10px;min-height:44px;}
/* 肌肉牆（進步頁主圖形）：4 大肌肉薄片、高度=分、顏色=身分 */
.wall-pot{border-bottom:1px dashed #E8DDD3;padding-bottom:12px;margin-bottom:14px;}
.pot-k{font-size:11.5px;font-weight:700;color:#8A7266;letter-spacing:2px;}
.pot-n{font-size:27px;font-weight:900;color:#8E682B;margin-top:1px;}
.pot-n span{font-size:13px;font-weight:700;color:#B39C89;margin-left:4px;}
.subrow{margin-top:14px;border-top:1px dashed #E8DDD3;padding-top:12px;}
.fbchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.fbc{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#F7F1EC;color:#6E4A3C;}
.fbc b{font-weight:800;}
.wall-note{font-size:12.5px;color:#8A7266;margin-top:10px;line-height:1.7;}
/* 還沒解鎖的量測鉤子（原 v9 .wk 說明框，改名避開週薄片列的 .wk） */
.wknote{font-size:13px;color:#993C1D;background:#F0E3DB;border-radius:14px;padding:11px 13px;margin-top:12px;line-height:1.75;}

/* 反應標籤（夥伴頁 feed 用） */
.rx-st{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;color:#fff;flex-shrink:0;}
.card-b{font-size:11px;color:#993C1D;background:#F0E3DB;padding:2px 8px;border-radius:20px;margin-left:6px;}
.mock{font-size:11px;color:#B4A695;border:1px dashed #D8C9BC;padding:1px 7px;border-radius:20px;margin-left:6px;}
.pill{font-size:13px;font-weight:600;color:#993C1D;background:#F0E3DB;padding:5px 12px;border-radius:20px;display:inline-block;}

.lock-note{font-size:12.5px;color:#8A7266;margin-top:8px;line-height:1.7;}
.cyc-note{font-size:12.5px;color:#8A7266;margin-top:8px;line-height:1.7;text-align:center;}
/* 口袋卡入口鈕：次要鈕（白底描邊），不跟同頁的錢鈕搶——一頁一顆錢鈕的規矩 */
.pocket-go{display:block;width:100%;margin-top:10px;background:#FDF6EF;border:1.5px solid #E8C89A;border-radius:14px;padding:13px;font-size:15px;font-weight:700;color:#AF5433;cursor:pointer;font-family:inherit;min-height:48px;}
.pocket-go:active{transform:scale(.99);}
/* 沒開放的排整排上迷霧（去彩＋降透明），鎖說明改灰底條才看得到 */
.lockwrap{filter:grayscale(.9);opacity:.38;pointer-events:none;}
.lock-note.lk{background:#EFE6DB;border-radius:10px;padding:9px 12px;color:#6E4A3C;margin-top:10px;font-weight:600;}

/* 夥伴頁 */
.hi{font-size:22px;font-weight:900;margin-bottom:8px;}
.gymq{margin-top:14px;text-align:center;font-size:15.5px;font-weight:700;line-height:1.9;color:#6B3018;}
.gymq::before{content:"❝";font-family:Georgia,serif;color:#C99A4E;font-size:26px;display:block;line-height:1;}
.avrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid #F0E3DB;border-radius:14px;margin-bottom:14px;}
.avs{display:flex;flex-shrink:0;}
.av{width:30px;height:30px;border-radius:50%;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px;}

   兩個混用會讓上午那筆昨天的紀錄同時點亮「昨天」跟「今天」兩格、週天數也多算一天。 */
var FOCUS = "A1", DONE_TODAY = false, DONE_CAL = false, IS_MEMBER = true;

   那邊決定去哪一頁、這邊決定到站後掛什麼頭。私教直開 member.html 當會員席看待。 */
var SEAT_FORCE = {"體驗席":false, "體驗客":false, "visitor":false,
                  "會員席":true, "會員":true, "member":true,
                  "私教席":true, "私教":true, "pro":true};
var OPEN_DRILL = false, OPEN_WEEK = false, WALL_FULL = false, POCKET = null, FEED_ALL = false;
var ANIM = true;                 /* 進頁/切分頁薄片從基線長上來一次；頁內重繪不重播 */

function el(id){ return document.getElementById(id); }
function esc_(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function md_(t){ return esc_(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>"); }
function ago(i){ var d = new Date(Date.now() - i * 86400000); return todayStr(d); }

/* ── 出手紀錄層：checkinLog → LOG（member 全收：沒對象/陌生人的筆也算練了）──
   stage：新筆直接帶；舊筆沒 stage 欄用 entryStage() 從 reaction 推回（同 pro）。 */
function entryStage(e){
  if (e.stage && stageIdx(e.stage) > -1) return e.stage;
  if (!e.reaction || e.reaction === "沒特別") return "none";
  var dim = e.muscle && MUSCLES[e.muscle] ? MUSCLES[e.muscle].dim : (e.dim || "");
  return stageIdx(dim) > -1 ? dim : "none";
}
function buildLog(){
  return (S.checkinLog || []).map(function(e){
      var mk = e.muscle && MUSCLES[e.muscle] ? e.muscle : "";
      return { muscle: mk, dimKey: mk ? MUSCLES[mk].dim : (e.dim || ""), lbl: mk || e.dim || "?",
               target: e.target || "", rel: e.rel || "客戶", stage: entryStage(e),
               date: normDate(e.date), note: e.note || "" };
    })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; }); /* 新的在前（chips/最近一筆好取） */
}
function clientHi(name){
  var hi = 0;
  LOG.forEach(function(e){ if (e.target === name) hi = Math.max(hi, stageIdx(e.stage)); });
  return hi;
}
/* 已解鎖影響力：四維都量過才算得出來；沒量滿＝null（誠實顯示 —，不編數字） */
function potNow(){
  var full = DORD.every(function(k){ return D5[k] != null; });
  if (!full) return null;
  var pct = {}; DORD.forEach(function(k){ pct[k] = pctFromEval(D5[k]); });
  return calcPotential(pct).unlocked;
}

/* ── 薄片原語（CSS 版）：一排三態薄片 ── */
function slRow(items, opt){
  opt = opt || {};
  var vals = items.map(function(it){
    return '<span style="color:' + (it.state==="now" ? (PALV[it.dimKey]||{}).t || "#4A1B0C" : "#8A7266") + ';">' + (it.vTop||"") + '</span>';
  }).join("");
  var slices = items.map(function(it){
    var p = PALV[it.dimKey] || {c:"#B4A695",t:"#8A7266",tint:"#EFE6DB"};
    var cls = "sl " + it.state, sty = "height:" + it.h + "px;" + (opt.full ? "--fh:" + opt.full + "px;" : "");
    if (it.state==="now") {
      if (it.dimKey==="I") cls += " gold"; /* I 金紅線：淡底＋深版描邊，不鋪實色 */
      else sty += "background:" + p.c + ";box-shadow:0 2px 8px " + p.c + "44;";
    } else if (it.state==="past") sty += "background:" + p.tint + ";";
    if (it.state==="todo" && it.hot) sty += "border-color:#C6603A;"; /* 今天還沒記：虛線亮行動色邀請點 */
    if (it.tap) { cls += " tap"; sty += "--tc:" + p.c + "73;"; } /* 可點的那片：脈動光暈跟著身分色 */
    return '<div class="' + cls + '" style="' + sty + '"' + (it.onclick ? ' onclick="' + it.onclick + '"' : '') + '></div>';
  }).join("");
  var lbls = items.map(function(it){
    var p = PALV[it.dimKey] || {};
    if (it.hot) return '<span style="color:#AF5433;font-weight:800;">' + it.lbl + '</span>';
    return '<span class="' + (it.state==="todo" ? "dim" : "") + '">'
      + (it.lbl2 ? '<i style="color:' + (it.state==="todo" ? "#8A7266" : p.t||"#8A7266") + ';">' + it.lbl2 + '</i>' : '')
      + it.lbl
      + (it.tap ? '<em class="tapchip">點我</em>' : '') + '</span>';
  }).join("");
  /* 斜角呼吸位：skewX(-12deg) 會把最高那片的右上角往外推 h*tan12°，
     不留位子就會被切掉。從最高片自己算，別再一處一處補 padding-right。 */
  var gut = Math.ceil(Math.max.apply(null, items.map(function(it){ return it.h; })) * 0.2126);
  return '<div class="slw" style="--sg:' + gut + 'px;">'
    + (opt.vals ? '<div class="slv">' + vals + '</div>' : '')
    + '<div class="srow">' + slices + '</div>'
    + (opt.noLbl ? '' : '<div class="slbl">' + lbls + '</div>')
    + '</div>';
}

/* ── 某個人的 ATPI 軌跡（打卡完成頁主圖形）── */
function personPathHTML(name, todayStage){
  var hi = 0;
  LOG.forEach(function(e){ if (e.target===name) hi = Math.max(hi, stageIdx(e.stage)); });
  hi = Math.max(hi, stageIdx(todayStage));
  var items = STAGES.slice(1).map(function(s){
    var i = stageIdx(s.k);
    var state = s.k===todayStage ? "now" : (i < stageIdx(todayStage) || i <= hi && i < stageIdx(todayStage) ? "past" : (i <= hi ? "past" : "todo"));
    if (todayStage==="none") state = i<=hi && hi>0 ? "past" : "todo";
    return {h:s.h-16, state:state, dimKey:s.k, lbl:s.zh, lbl2:s.k};
  });
  return '<div style="background:#fff;border-radius:16px;padding:14px 30px 12px 14px;margin-top:16px;box-shadow:0 8px 30px rgba(74,27,12,.08);text-align:left;">'
    + '<div class="sec">CLIENT PATH · <b>' + esc_(name) + ' 走到哪了</b></div>'
    + slRow(items) + '</div>';
}

/* ═══ 練習頁 ═══ */
function toggleDrill(){ OPEN_DRILL = !OPEN_DRILL; render(); }
function drillHTML(d){
  function row(k, v){ return '<div class="dr"><div class="dr-k">' + k + '</div><div class="dr-v">' + md_(v) + '</div></div>'; }
  return '<div class="drill">'
    + row("練什麼", d.h) + row("找誰", d.who)

    + row("🌱 怎麼算成了", d.win)
    + row("🌾 沒成怎麼辦", d.retry) + '</div>';
}
/* 週薄片列：淡填＝練過・實色＝今天記了・虛線＝還沒到 */
function weekStripHTML(){
  var days = ["一","二","三","四","五","六","日"];
  var dow = (new Date().getDay() + 6) % 7;
  var dset = {}; LOG.forEach(function(e){ dset[e.date] = 1; });
  var dim = MUSCLES[FOCUS].dim;
  var items = days.map(function(d, i){
    var done = i === dow ? DONE_CAL : (dow - i > 0 && !!dset[ago(dow - i)]);
    var state = i === dow ? (done ? "now" : "todo") : (done ? "past" : "todo");
    var open = i === dow && !done && !DONE_TODAY;
    return {h: done ? 26 : 17, state: state, dimKey: dim, lbl: i === dow ? "今天" : d,
            hot: open, onclick: open ? "openRec()" : null};
  });
  return '<div class="wk">' + slRow(items) + '</div>';
}
function toggleWeek(){ OPEN_WEEK = !OPEN_WEEK; render(); }
function weekCardHTML(){
  var dow = (new Date().getDay() + 6) % 7;
  var dset = {}; LOG.forEach(function(e){ dset[e.date] = 1; });
  var n = 0; for (var i = 1; i <= dow; i++) if (dset[ago(i)]) n++;
  if (DONE_CAL) n++;
  return '<div class="cd"><div class="sec">THIS WEEK · <b>這週</b></div>'
    + '<div class="wkline">這週練了<b>' + n + '</b>天。<span>沒練的日子不扣。</span></div>'
    + weekStripHTML()
    + '<button class="drill-tg" onclick="toggleWeek()">週回顧——這週的每一筆 ' + (OPEN_WEEK ? "▴" : "▾") + '</button>'
    + (OPEN_WEEK ? weekListHTML() : '') + '</div>';
}
function weekListHTML(){
  var dow = (new Date().getDay() + 6) % 7, min = ago(dow);
  var days = ["一","二","三","四","五","六","日"];
  var es = LOG.filter(function(e){ return e.date >= min; });
  if (!es.length) return '<div class="wall-note">這週還沒有紀錄——今天記第一筆。</div>';
  return '<div class="drill">' + es.map(function(e){
    var s = STAGES[stageIdx(e.stage)];
    var mn = e.muscle && MUSCLES[e.muscle] ? MUSCLES[e.muscle].name : e.lbl;
    var dl = e.date === ago(0) ? "今天" : "週" + days[(new Date(e.date + "T00:00:00").getDay() + 6) % 7];
    return '<div class="dr"><div class="dr-k">' + dl + ' · ' + esc_(mn) + (e.target ? ' → ' + esc_(e.target) : '') + '</div>'
      + '<div class="dr-v"><span class="fbc" style="color:' + s.t + ';background:' + (s.tint || "#EFE6DB") + ';">' + s.full + '</span>'
      + (e.note ? ' ' + esc_(e.note) : '') + '</div></div>';
  }).join("") + '</div>';
}
/* 明天預告卡 */

/* 簡版膠囊 HUD：分數全真——沒量滿就顯示 —，不編數字 */
function hudHTML(){
  var focusDim = MUSCLES[FOCUS].dim;
  var pot = potNow();

    return {h: v==null ? 10 : Math.round(8 + (v-1)/4*20), state: v==null ? "todo" : (k===focusDim ? "now" : "past"), dimKey:k};

    + '<div class="hud-sl">' + slRow(items, {noLbl:true}) + '</div>'

function todayHTML(){
  var m = MUSCLES[FOCUS], d = DRILL[FOCUS];
  var h = hudHTML();
  h += '<div class="hero"><div class="kick" style="color:#5C7464;">TODAY · 今天練一塊</div>'
    + '<div class="big-t">' + m.name + '——<em>' + m.tech.split("・")[0] + '</em></div>'
    + '<div class="sub-t">' + DIM_RESULT[m.dim] + '。練完不是打勾——是記下<b>他走到哪了</b>。</div>'
    + '<div class="howq"><div class="howq-k">開口就用這句</div><div class="howq-t">「' + md_(d.line) + '」</div></div>'

    + (OPEN_DRILL ? drillHTML(d) : '')
    /* 「這一輪」不是「今天」：任務池的日界線在中午 12:00（taskCycleNow_），
       上午打開時昨天下午那筆還在同一輪內——講「今天記好了」會跟他的記憶打架。 */
    + (DONE_TODAY
        ? '<button class="gobtn done">這一輪記好了 ✓</button><div class="cyc-note">下一輪中午 12:00 開始——晚上練的算同一輪，不用趕在半夜前記。</div>'
        : '<button class="gobtn" onclick="openRec()">練完了，記下他的反應</button>')
    + '<div class="rule4" style="margin-top:16px;"></div></div>';
  return h + weekCardHTML() + tomorrowHTML() + seatPathHTML();

/* ═══ 開練流程（反饋當主角）＝寫真資料的那一刻 ═══ */
function findTask(mk){
  var t = (typeof TASKS !== "undefined" ? TASKS : []).find(function(x){
    return x.cadence === "daily" && taskMuscles_(x.muscle).indexOf(mk) > -1 && (!WID || x.workshopId === WID);
  });
  return t || fallbackMove(mk);
}
function openRec(){ REC = {who:null, rel:null, stage:null, note:"", share:false, step:1}; window.scrollTo(0,0); render(); }
function closeRec(){ REC = null; render(); }
function recHTML(){
  var m = MUSCLES[FOCUS];
  var h = '<div class="cd"><div class="rec-hd"><button class="rec-bk" onclick="closeRec()">‹</button>'
    + '<div><div class="rec-n">' + m.name + '</div><div class="rec-m">' + DIM_RESULT[m.dim] + '</div></div></div>';

  if (REC.step === 1) {
    /* 名字是使用者輸入——一律 esc_＋data 屬性綁事件，不塞 inline onclick */
    var seen = {}, chips = [];
    LOG.forEach(function(e){
      if (e.target && e.target !== "陌生人" && !seen[e.target]) { seen[e.target] = 1; chips.push({n:e.target, r:e.rel}); }
    });
    h += '<div class="q">對誰？<span class="qs">點一下就好</span></div><div class="opts">'
      + chips.map(function(p){ return '<button class="op' + (REC.who===p.n?" on":"") + '" data-who="' + esc_(p.n) + '" data-rel="' + esc_(p.r) + '">' + esc_(p.n) + '</button>'; }).join("")
      + '<button class="op warm" data-who="陌生人" data-rel="陌生人">陌生人</button>'
      + '<button class="op new' + (REC.adding?" on":"") + '" id="addWho">＋ 新對象</button></div>'
      + (REC.adding
          ? '<input class="ta" style="min-height:auto;margin-top:14px;" id="recwho" placeholder="他叫什麼？（例：王姐）" value="' + esc_(REC.whoDraft||"") + '">'
            + '<div class="q" style="margin-top:16px;">他是你的？</div><div class="opts">'
            + REL.map(function(r){ return '<button class="op' + (REC.rel===r?" on":"") + '" data-newrel="' + r + '">' + r + '</button>'; }).join("")
            + '</div><button class="sub" id="newWhoDone">就是他</button>'
          : '');
  } else if (REC.step === 2) {
    var soft = SOFT_REL.indexOf(REC.rel) > -1;
    h += '<div class="q">' + esc_(REC.who) + ' 走到哪了？<span class="qs">點一片</span></div>'
      + '<div class="ladder">' + slRow(STAGES.map(function(s, i){
          if (soft && (s.k==="P" || s.k==="I")) return null;
          var sel = stageIdx(REC.stage);
          var state = REC.stage==null ? "todo" : (s.k===REC.stage ? "now" : (i < sel ? "past" : "todo"));
          return {h:s.h, state:state, dimKey:s.k==="none" ? null : s.k, lbl:s.zh, lbl2:s.k==="none" ? "" : s.k, onclick:"pickStage('" + s.k + "')"};
        }).filter(Boolean)) + '</div>'
      + (soft ? '<div class="brake">家人朋友走到「願意說」就夠——<br>這裡我們刻意踩煞車，不往成交推。</div>' : '')
      + (REC.stage!=null
          ? '<div class="q" style="margin-top:16px;">發生什麼？<span class="qs">寫一句就好</span></div>'
            + '<textarea class="ta" id="recnote" placeholder="' + (stageIdx(REC.stage)>=2 ? "他放下手機看著我：「你怎麼突然這麼會講話？」" : "我問了他週末去哪，他只嗯了一聲") + '"></textarea>'
          : '')
      + (REC.stage!=null && REC.stage!=="none"
          ? '<button class="share-tg' + (REC.share?" on":"") + '" onclick="toggleShare()">' + (REC.share?"✓ 會放到館裡":"也放到館裡") + '——讓夥伴看見這一步</button>'
          : '')
      + '<button class="sub" ' + (REC.stage==null?"disabled":"") + ' id="recDone">' + (REC.stage==null?"先點一片":"記下來") + '</button>'
      + (REC.stage!=null ? '<button class="skip" id="recSkip">跳過文字，直接記 →</button>' : '');
  } else {
    var st = STAGES[stageIdx(REC.stage)];
    h += '<div class="ok">'
      + (REC.mile ? '<div class="fwwrap"><div class="p3check">✓</div>' + fwHTML() + '</div>' : '<div class="p3check">✓</div>')
      + '<div class="ok-t">每天進步一點點。</div>'
      + '<div class="ok-s">' + (REC.stage==="none"
          ? '沒反應不代表白講——這一筆也是他軌跡的一部分。'
          : '你練的是「' + m.name + '」，<br>他給你的回答是——<b style="color:' + st.t + ';">' + st.full + '</b>。') + '</div></div>'

      + (REC.note ? '<div class="echo">你記下的：「' + esc_(REC.note) + '」<span>文字留得住感覺，分數留不住。</span></div>' : '')
      + personPathHTML(REC.who, REC.stage)
      + (REC.mile && (REC.stage==="P" || REC.stage==="I")
          ? '<div class="soft-pro" onclick="location.href=\'pro.html?demo=1\'">這種時刻，私教席的教練會陪你看下一步推哪 →</div>'
          : '')
      + '<div class="bone" onclick="closeRec()">影響力的盡頭不是成交，是有人因為你變好。</div>'
      + '<div class="tapback" onclick="closeRec()">點一下，回到練習 ›</div>';
  }
  return h + '</div>';
}
function pickStage(k){
  var ta = el("recnote");
  if (ta) REC.note = ta.value;
  REC.stage = k; render();
  var t = el("recnote"); if (t && REC.note) t.value = REC.note;
}
function toggleShare(){
  var ta = el("recnote");
  if (ta) REC.note = ta.value;
  REC.share = !REC.share; render();
  var t = el("recnote"); if (t && REC.note) t.value = REC.note;
}
function fwHTML(){
  var cols = ["#C6603A","#6E8B77","#6E8CA8","#C99A4E"], out = "";
  for (var i=0;i<12;i++){
    var a = Math.PI*2*i/12, r = 44 + (i%2)*16;
    out += '<span class="fw" style="background:' + cols[i%4] + ';--dx:' + Math.round(Math.cos(a)*r) + 'px;--dy:' + Math.round(Math.sin(a)*r) + 'px;animation-delay:' + (0.15 + (i%3)*0.08) + 's;"></span>';
  }
  return out;
}
function bindRec(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-who]"), function(b){
    b.onclick = function(){ REC.who = b.getAttribute("data-who"); REC.rel = b.getAttribute("data-rel") || "客戶"; REC.adding = false; REC.step = 2; render(); };
  });
  var aw = el("addWho");
  if (aw) aw.onclick = function(){ REC.adding = true; if (!REC.rel) REC.rel = "客戶"; render(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-newrel]"), function(b){
    b.onclick = function(){
      var w = el("recwho"); if (w) REC.whoDraft = w.value;
      REC.rel = b.getAttribute("data-newrel"); render();
    };
  });
  var nd = el("newWhoDone");
  if (nd) nd.onclick = function(){
    var w = el("recwho");
    var n = w ? w.value.trim() : "";
    if (!n) { if (w) w.focus(); return; }
    REC.who = n.slice(0, 12); REC.adding = false; REC.step = 2; render();
  };
  var dn = el("recDone"), sk = el("recSkip");
  /* 里程碑＝這個人第一次走到新的一階（慶祝的理由是他前進了，不是你打卡了）。

     reaction 同步帶（跨頁相容：pro/報表照舊讀 reaction）。member 鐵則②：沒有金額欄。 */
  function done(skipNote){
    var ta = el("recnote");
    REC.note = (!skipNote && ta) ? ta.value.trim() : "";
    REC.mile = REC.stage !== "none" && stageIdx(REC.stage) > clientHi(REC.who);
    var task = findTask(FOCUS);
    doCheckin(S, task, WID || "", {
      reaction: REC.stage === "none" ? "沒特別" : "明顯有",
      target: REC.who || "", rel: REC.rel || "", note: REC.note,
      stage: REC.stage, share: REC.share
    });
    LOG = buildLog();
    if (REC.share && REC.stage !== "none")
      FEED.unshift({n:"你", stage:REC.stage, t: REC.note || ('練「' + MUSCLES[FOCUS].name + '」——' + STAGES[stageIdx(REC.stage)].full), cheer:0, mine:true});
    DONE_TODAY = true; DONE_CAL = true;
    REC.step = 3; window.scrollTo(0,0); render();
  }
  if (dn) dn.onclick = function(){ done(false); };
  if (sk) sk.onclick = function(){ done(true); };
}

/* FEED＝三層疊起來：①真的分享貼文（gymPosts，只含 share=true 的筆、不含對象名字）
   ②真學員戰報 WINS ③種子戰報 GYM_SEED。鼓勵數一律從 0 起算——不編數字。
   2026-09-15 加排序：三層直接串會變成 20+ 張沒人看完，而且跟「我在練什麼」無關。
   權重＝你的這一步 › 跟你本週主力同一小塊 › 同一大肌肉 › 真貼文（新→舊）› 其餘；
   預設只印 5 張，其餘收在「看更多」後面。 */
function buildFeed(){
  var out = [];
  (GYM_POSTS || []).forEach(function(p){
    var st = entryStage({stage:"", reaction:p.reaction, muscle:p.muscle, dim:p.dim});
    var t = p.note || (p.muscle && MUSCLES[p.muscle]
      ? '練「' + MUSCLES[p.muscle].name + '」——' + STAGES[stageIdx(st)].full
      : STAGES[stageIdx(st)].full);
    out.push({n: p.name || "夥伴", stage: st, t: t, cheer: 0,
              real: true, muscle: p.muscle || "", dim: p.dim || (p.muscle && MUSCLES[p.muscle] ? MUSCLES[p.muscle].dim : "")});
  });
  WINS.forEach(function(w){ out.push({n: w.n + "・" + w.role, stage: w.dim, t: w.d, cheer: 0, dim: w.dim}); });
  GYM_SEED.forEach(function(g){
    out.push({n: g.n, stage: g.react === "沒特別" ? "none" : g.dim,
              t: g.turns.map(function(tn){ return tn.t; }).join("——"), cheer: 0, dim: g.dim});
  });
  return sortFeed(out);
}
/* 排序權重。sort 在現代引擎是穩定的——同分維持原順序，真貼文的新→舊（後端排好的）不會被打亂。 */
function feedRank(f){
  if (f.mine) return 0;
  if (FOCUS && f.muscle === FOCUS) return 1;
  if (FOCUS && f.dim && f.dim === MUSCLES[FOCUS].dim) return 2;
  return f.real ? 3 : 4;
}
function sortFeed(list){
  return list.slice().sort(function(a, b){ return feedRank(a) - feedRank(b); });
}

  if (!uid) return;
  var d = await loadBootstrap(uid, "");
  if (!d) { el("bd").innerHTML = '<div class="loading">讀不到資料，請稍後再試。</div>'; return; }
  if (d.tasks) TASKS = d.tasks;
  if (d.workshops) WORKSHOPS = d.workshops;
  var st = d.student || {};
  S = { lineId: st.lineId || uid, name: st.name || "", team: st.team || "",
        checkinLog: d.checkins || [], revenueLog: d.revenue || [], evalLog: d.evals || [] };
  /* 席位判定順序：①STUDENTS 的「指定席位」手動蓋台欄（index.html 的 routeFor 也吃這欄，
     兩邊要同一個答案，否則會被路由送進 member.html 卻掛體驗席的頭）②paidMember 勾選欄。
     ⚠️ Code.gs 的 granted_() 永遠回布林，paidMember 不會是 null——欄位漏掉或改名會靜默
     判成體驗席，所以不能只靠它。 */
  var forced = SEAT_FORCE[String(st.seat || "").trim().toLowerCase()];
  setSeat(forced == null ? !!st.paidMember : forced);
  var en = (d.enrollments || []).filter(function(e){ return e.lineId === S.lineId && PRO_WS.indexOf(e.workshopId) < 0; });
  WID = en.length ? en[0].workshopId : "";
  LOG = buildLog();
  FOCUS = weakestThree(S)[0] || "A1";
  DONE_TODAY = (S.checkinLog || []).some(function(e){ return normDate(e.date) === taskDayStr(); });
  DONE_CAL = (S.checkinLog || []).some(function(e){ return normDate(e.date) === todayStr(); });
  FEED = buildFeed(); /* 先上 WINS＋種子，真貼文載到再補 */
  el("nav").classList.remove("hide");
  render();
  track("screen_view", { screen: PANE, seat: IS_MEMBER ? "member" : "visitor" });
  GYM_POSTS = (await loadGymPosts(12)) || [];
  FEED = buildFeed();
  CHEERED = {};
  if (!REC && PANE === "gym") render();
}
boot();
</script>
</body>
</html>
