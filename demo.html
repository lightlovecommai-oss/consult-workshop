<style>
:root{
  --pg:#3A2418; --pg2:#4A2E1E; --pgi:#F7F1EC; --pgm:#C9AE9C; --pgl:#5C3B28;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --pg:#EFE6DE; --pg2:#E6DACF; --pgi:#4A1B0C; --pgm:#7A6154; --pgl:#D8C6B8; }
}
:root[data-theme="light"]{ --pg:#EFE6DE; --pg2:#E6DACF; --pgi:#4A1B0C; --pgm:#7A6154; --pgl:#D8C6B8; }
*{box-sizing:border-box;}
body{margin:0;background:var(--pg);color:var(--pgi);
 font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
 -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;
 min-height:100vh;padding:22px 14px 40px;gap:16px;}
.srf{font-family:"Noto Serif TC","Songti TC",Georgia,serif;}

.bar{width:100%;max-width:430px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.bar-t{font-family:"Noto Serif TC",Georgia,serif;font-size:17px;font-weight:700;}
.bar-s{font-size:13.5px;color:var(--pgm);}
.btns{margin-left:auto;display:flex;gap:7px;}
.tb{background:none;border:1px solid var(--pgl);color:var(--pgm);border-radius:20px;
 padding:7px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;min-height:36px;}
.tb:hover{border-color:var(--pgi);color:var(--pgi);}
.tb.on{background:var(--pgi);color:var(--pg);border-color:var(--pgi);font-weight:600;}

.dev{width:390px;max-width:100%;border-radius:30px;overflow:hidden;
 box-shadow:0 16px 48px rgba(0,0,0,.28);border:1px solid rgba(0,0,0,.14);}
#screen{width:100%;height:788px;background:#EFE6DE;color:#4A1B0C;
 display:flex;flex-direction:column;position:relative;overflow:hidden;
 font-family:"Noto Sans TC","PingFang TC",-apple-system,sans-serif;}
#screen *{box-sizing:border-box;}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.nav{position:absolute;left:0;right:0;bottom:0;background:#F7F1EC;border-top:1px solid #E6DAD1;
 display:flex;padding:10px 0 15px;}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;
 background:none;border:0;cursor:pointer;padding:4px 0;color:#B4A695;font-family:inherit;min-height:44px;}
.nv.on{color:#C6603A;}

.step{width:100%;max-width:430px;font-size:13.5px;color:var(--pgm);line-height:1.7;}
.step b{color:var(--pgi);}
.crumb{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.cb{font-size:12.5px;padding:4px 9px;border-radius:20px;border:1px solid var(--pgl);color:var(--pgm);
 background:none;cursor:pointer;font-family:inherit;min-height:30px;}
.cb.on{background:var(--pgi);color:var(--pg);border-color:var(--pgi);}
.cb.done{border-color:var(--pgi);color:var(--pgi);}
:focus-visible{outline:2px solid #C6603A;outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
@media (max-width:640px){
  body{padding:8px 6px 20px;gap:9px;}
  .bar-t{font-size:15px;} .bar-s{font-size:12px;}
  .tb{padding:6px 10px;font-size:12px;min-height:34px;}
  .dev{border-radius:22px;}
  #screen{height:calc(100dvh - 168px);min-height:520px;}
  .step{font-size:13px;}
  .step #hint{display:none;}
  .step.open #hint{display:block;}

<script>
(function(){
"use strict";
/* ═══ 用詞對照（⚠️ 暫定・老師 2026-09-01 口述，尚未進 01 字典《健身房語彙表》，還會再改）═══
   原則：**保留身體的隱喻（肌肉／練／長／萎縮＝命門），拿掉設施的詞彙（館／器材／體格／體測／開練／一組）。**
   舊（字典 2026-08-18 語彙表）→ 這個專案暫用：
     館   → app 裡叫「夥伴」；Skool 叫「社群」
     開練 → 「練溝通」
     動作 → 「一個秘訣」
     體格 → 「溝通肌肉」／「你的四塊溝通肌肉」
     體測 → 「週回顧」（自評）；教練帶的仍叫「溝通健檢」
     一組 → 退場（UI 直接說「今天這一件」）
     器材 → 只留內部，UI 不出現
     入館第 N 天 → 「第 N 天」
   三個分頁：夥伴 · 練習 · 進步
   ⚠️ 老師交代：先只改這個專案，不要寫進字典與 check.py——還可能會改。

   ═══ 暖版設計 token ═══
   真相＝productkit/2-行銷素材/會員App元件-穩暖版.html（逐值照抄）＋ 21-品牌色彩系統
   色層四階：#E6DACF 頁底 → #EFE6DE 外框 → #F7F1EC 主卡 → #fff 內卡
   圓角四級：26 外框 / 20 主卡 / 14 內卡·按鈕 / 4 進度條
   內距四級：24 / 18 / 14 / 13
   字級四級（參考檔 11/12/15/20 等比放大給 40-60 歲客群）：13 / 15 / 17 / 22（＋28 只給一個 hero）
   ⚠️ 只准用這些值。多一級字就少一分層次感——參考檔全檔只有 4 種字級。 */
var C={grd:"#E6DACF",frm:"#EFE6DE",card:"#F7F1EC",w:"#fff",
 ink:"#4A1B0C",mut:"#6E4A3C",mid:"#5A3A2A",warn:"#993C1D",fnt:"#8A7266",
 /* mut 從 #8A7266(4.01:1 不合格) 換成品牌次級色 #6E4A3C；#8A7266 降級成 fnt，只用在 ≥15px 或裝飾 */
 act:"#C6603A",actS:"#AF5433",line:"#E6DAD1",trk:"#F0E3DB",gbg:"#DCE7DE",gfg:"#3E5546",
 fill:{A:"#C6603A",T:"#6E8B77",P:"#6E8CA8",I:"#C99A4E"},
 text:{A:"#AF5433",T:"#5C7464",P:"#54718D",I:"#8E682B"},
 soft:{A:"#F3D9CD",T:"#DCE7DE",P:"#DDE6EE",I:"#F1E5CC"}};

function logo(w){w=w||38;var h=Math.round(w*0.75);
 return '<svg width="'+w+'" height="'+h+'" viewBox="-52 -30 104 72" aria-hidden="true">'
 +'<g fill="none" stroke="#4A1B0C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'
 +'<path d="M-36 -22 L36 -22 Q48 -22 48 -10"/><path d="M48 -10 L48 10 Q48 22 36 22"/>'
 +'<path d="M36 22 L-6 22 L-16 36 L-22 22 L-36 22 Q-48 22 -48 10"/><path d="M-48 10 L-48 -10 Q-48 -22 -36 -22"/></g>'
 +'<circle cx="-21" cy="0" r="4.5" fill="#C6603A"/><circle cx="-7" cy="0" r="4.5" fill="#6E8B77"/>'
 +'<circle cx="7" cy="0" r="4.5" fill="#6E8CA8"/><circle cx="21" cy="0" r="4.5" fill="#C99A4E"/></svg>';}

/* 統一的頭：logo ＋ 標題 ＋ 右側小字。所有畫面都用這個，沒有例外 */
function head(sub,right){
 return '<div style="padding:16px 16px 13px;flex-shrink:0;background:'+C.grd+';">'
  +'<div style="display:flex;align-items:center;gap:11px;">'+logo(40)
  +'<div><div style="font-size:17px;font-weight:700;color:'+C.ink+';letter-spacing:.04em;">溝通健身房</div>'
  +'<div style="font-size:13px;color:'+C.act+';margin-top:4px;letter-spacing:.02em;">練好溝通，你就有影響力</div></div>'
  +(right?'<div style="margin-left:auto;font-size:13px;color:'+C.fnt+';align-self:flex-start;">'+right+'</div>':'')+'</div>'
  +(sub?'<div style="font-size:13px;color:'+C.mut+';margin-top:10px;">'+sub+'</div>':'')
  +'</div>';}

var ic={
 gym:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"/></svg>',
 today:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/></svg>',
 me:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20a8 8 0 0 1 16 0"/><circle cx="12" cy="8" r="4"/></svg>',
 ar:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 ok:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
 thumb:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z"/><path d="M7 11l4.2-7.4a1.6 1.6 0 0 1 3 .8V9h4.6a2 2 0 0 1 1.95 2.45l-1.6 7A2 2 0 0 1 17.2 20H7"/></svg>'};

/* ══ 狀態 ══ */
var S;
function reset(){ S={sc:"quiz",member:false,tab:"gym",target:null,rel:null,react:null,note:"",
  cheered:{},done:0,streak:4,visited:{},
  /* ⭐ 秘訣按「上線次數」給，不按日期——多數人隔幾週才回來，按日期發他一定錯過。
     三個輪流：內容不枯竭，但也不新增（守住 99 的界線）。 */
  visits:1, lastSeen:"3 週前", pick:0}; }
reset();
var el=document.getElementById("screen");

/* ══ 小工具 ══ */
function card(inner,pad){return '<div style="background:'+C.card+';border-radius:20px;padding:'+(pad||"18px 16px")+';margin-bottom:14px;">'+inner+'</div>';}
function cw(inner,pad,extra){return '<div style="background:'+C.w+';border-radius:14px;padding:'+(pad||"18px 16px")+';margin-bottom:14px;'+(extra||"")+'">'+inner+'</div>';}
function lbl(t){return '<div style="font-size:13px;font-weight:700;color:'+C.mut+';margin-bottom:13px;letter-spacing:.03em;">'+t+'</div>';}
function pill(t){return '<span style="font-size:13px;font-weight:600;color:'+C.warn+';background:'+C.trk+';padding:5px 12px;border-radius:20px;">'+t+'</span>';}
function btnDark(id,t,s){return '<button data-go="'+id+'" style="width:100%;background:'+C.ink+';color:'+C.card+';border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;min-height:44px;">'+t+(s?'<div style="font-size:13.5px;font-weight:400;color:rgba(247,241,236,.72);margin-top:4px;">'+s+'</div>':'')+'</button>';}
function bar4(k,pct,val,name){
 return '<div style="display:flex;align-items:center;gap:9px;">'
  +'<span style="width:14px;font-size:12px;color:'+C.text[k]+';font-weight:700;">'+k+'</span>'
  +(name?'<span style="width:56px;font-size:13.5px;color:'+C.ink+';">'+name+'</span>':'')
  +'<span style="flex:1;height:7px;background:'+C.trk+';border-radius:4px;overflow:hidden;display:block;">'
  +'<span style="display:block;height:7px;width:'+pct+';background:'+C.fill[k]+';border-radius:4px;"></span></span>'
  +(val?'<span style="width:30px;text-align:right;font-size:13.5px;font-weight:600;color:'+C.ink+';font-variant-numeric:tabular-nums;">'+val+'</span>':'')+'</div>';}
function navBar(){
 return '<div class="nav">'+[["gym","夥伴"],["today","練習"],["me","進步"]].map(function(t){
  var on=S.tab===t[0];
  return '<button class="nv'+(on?" on":"")+'" data-tab="'+t[0]+'">'+ic[t[0]]+t[1]+'</button>';}).join("")+'</div>';}

/* ══ 畫面 ══ */

/* ══════════ 開場輪播（每 3 秒一張，可左右滑） ══════════
   ⚠️ 見證引言逐字取自 productkit/產品kit/見證庫-共筆.md，**未改一字**。
   （品牌鐵則：見證以截圖為準，絕不代擬引言。）
   · 王偉翔・到府按摩師＝📷 截圖原話（check.py「按摩師見證引言」條的 ok 值就是這句）
   · 學員（匿名）＝📷 截圖 8.JPG，見證庫 C2 段
   兩則都是**純溝通、無金額**，符合「路人層講溝通、不講變現」的分野。
   ⚠️ 原本用的雅雯（成交率 4 倍）／阿澤（2 週 50 萬）已換掉——那兩則是變現訴求，
      路人層第一眼看到會過度承諾。
   🟡 備選（老師未拍板）：情緒溝通老師「家人說『我變了』、願意聽我說話」——
      📝 僅口述無截圖，位階低一階，但無數字所以可用。 */
var HERO=[
 {k:"say", t:"會不會講話，<br>決定你活得多順。",
  b:'溝通不是天分，是<b style="color:#E8C89A;">四塊可以練的肌肉</b>。<br>剛才那 16 題，是在量你這四塊現在長什麼樣。'},
 {k:"say", t:"你會知道<br>自己卡在哪。",
  b:'四塊肌肉一次看清楚——<br>不用再靠感覺猜「我是不是不太會講話」。'},
 {k:"say", t:"每天只花<br>十秒鐘。",
  b:'一件小事、兩下點擊。<br><b style="color:#E8C89A;">不用寫日記、不用背話術。</b>'},
 {k:"say", t:"你不是一個人<br>在練。",
  b:'現在有 <b style="color:#E8C89A;">13 個人</b>跟你練同一塊。<br>看得到他們怎麼做、對方怎麼回。'},
 {k:"quote", who:"王偉翔 ｜ 到府按摩師",
  q:'如何說話讓自己感覺起來<b style="color:#E8C89A;">有自信</b>，讓顧客<b style="color:#E8C89A;">更信賴我</b>，快速幫我拓展客源。'},
 {k:"quote", who:"學員 ｜ 一對一實戰",
  q:'有<b style="color:#E8C89A;">聊到對方的點</b>，比問完該問的問題還重要。'}
];
var heroI=0, heroTimer=null, heroX0=null;
function heroSlide(h){
 if(h.k==="quote")
  return '<div style="min-width:100%;padding:26px 20px;">'
   +'<div style="font-size:13px;color:rgba(247,241,236,.55);letter-spacing:.06em;margin-bottom:14px;">學員真實故事</div>'
   +'<div style="font-size:17px;line-height:2.05;color:'+C.card+';">'+h.q+'</div>'
   +'<div style="font-size:13px;color:rgba(247,241,236,.6);margin-top:16px;">'+h.who+'</div></div>';
 return '<div style="min-width:100%;padding:26px 20px;">'
  +'<div style="font-size:22px;font-weight:600;line-height:1.6;margin-bottom:16px;color:'+C.card+';">'+h.t+'</div>'
  +'<div style="font-size:15px;line-height:2.1;color:rgba(247,241,236,.85);">'+h.b+'</div></div>';
}
function heroHTML(){
 return '<div id="hero" style="background:'+C.ink+';border-radius:20px;margin-bottom:16px;overflow:hidden;position:relative;">'
  +'<div id="heroTrack" style="display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1);">'
  +HERO.map(heroSlide).join("")+'</div>'
  +'<div style="display:flex;gap:6px;justify-content:center;padding:0 0 16px;">'
  +HERO.map(function(_,i){return '<button data-hero="'+i+'" aria-label="第 '+(i+1)+' 張" style="width:'+(i===heroI?"18px":"7px")+';height:7px;border-radius:4px;border:0;padding:0;cursor:pointer;background:'+(i===heroI?"#E8C89A":"rgba(247,241,236,.28)")+';transition:width .3s,background .3s;"></button>';}).join("")
  +'</div></div>';
}
function heroGo(i){
 heroI=(i+HERO.length)%HERO.length;
 var t=document.getElementById("heroTrack"); if(!t) return;
 t.style.transform="translateX("+(-heroI*100)+"%)";
 var dots=document.querySelectorAll("[data-hero]");
 dots.forEach(function(d,n){
  d.style.width = n===heroI ? "18px" : "7px";
  d.style.background = n===heroI ? "#E8C89A" : "rgba(247,241,236,.28)";});
}
function heroBind(){
 if(heroTimer){clearInterval(heroTimer);heroTimer=null;}
 var box=document.getElementById("hero"); if(!box) return;
 heroI=0; heroGo(0);
 var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 if(!reduce) heroTimer=setInterval(function(){heroGo(heroI+1);},3000);
 function pause(){ if(heroTimer){clearInterval(heroTimer);heroTimer=null;} }
 box.querySelectorAll("[data-hero]").forEach(function(d){
  d.onclick=function(){pause();heroGo(+d.getAttribute("data-hero"));};});
 box.addEventListener("touchstart",function(e){heroX0=e.touches[0].clientX;pause();},{passive:true});
 box.addEventListener("touchend",function(e){
  if(heroX0===null) return;
  var dx=e.changedTouches[0].clientX-heroX0; heroX0=null;
  if(Math.abs(dx)>36) heroGo(heroI + (dx<0?1:-1));});
 box.addEventListener("mousedown",function(e){heroX0=e.clientX;pause();});
 box.addEventListener("mouseup",function(e){
  if(heroX0===null) return; var dx=e.clientX-heroX0; heroX0=null;
  if(Math.abs(dx)>36) heroGo(heroI + (dx<0?1:-1));});
}


/* ⭐ 免費層拿得到的內容＝最弱那一塊大肌肉的三個秘訣，輪流。
   內容取自 judgement.js 的 homework 欄（T1/T2/T3）。拿不到的是「回饋」——
   沒有解盤、記錄不進肌肉、沒有人回你。99 賣的是回饋，不是內容。 */
var TIPS=[
 {n:"讓他敢說", t:"先講一句你心裡沒說的",
  how:'找一個你今天本來就會講到話的人。用下面這句，講一件你還在卡、還沒成的事。',
  line:'「我最近有點＿＿，不過我想跟你說。」',
  end:'一句就好。講完停住，<b style="color:'+"'"+'+C.warn+'+"'"+';">數三秒</b>，把場讓給他。',
  note:'三秒很久。忍住不補話，他才有空隙接。'},
 {n:"讓他交心", t:"連問三次「為什麼」",

  +'<div style="font-size:13px;line-height:1.9;color:'+C.mid+';margin-top:13px;">如果你曾經覺得自己嘴巴笨，或想讓聲音更有影響力——用你最真實的聲音，練出影響力。</div></div>'
 +'<div style="margin:0 22px;height:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);border-radius:4px;"></div>'
 +'<div style="padding:19px 22px 4px;display:grid;gap:14px;">'+perks+'</div>'
 +'<div style="margin:15px 22px 0;padding:15px;background:'+C.w+';border-radius:14px;">'
  +'<div style="font-size:13px;font-weight:700;color:'+C.ink+';margin-bottom:12px;">為什麼是現在</div>'
  +'<div style="display:flex;flex-direction:column;gap:11px;font-size:13px;color:'+C.ink+';line-height:1.8;">'
  +["社群裡有<b>免費課</b>，進來就能看——這些平常是課程學員才有的。",
    "課表<b>一個月換一塊肌肉</b>。這個月大家正在練信任肌肉——剛好是你最卡的那塊，走完就換下一塊。",
    "溝通健檢的報告是教練<b>一個一個陪你看</b>的，這個月還剩 6 個名額。"].map(function(x){
    return '<div style="display:flex;gap:9px;"><span style="color:'+C.act+';flex-shrink:0;">·</span><span>'+x+'</span></div>';}).join("")
  +'</div>'
  +'<div style="margin-top:13px;padding-top:12px;border-top:1px solid '+C.line+';font-size:13px;color:'+C.mid+';line-height:1.85;">NT$99／月買的<b style="color:'+C.ink+';">不是內容</b>——內容你自己查也查得到。<br>買的是這個月<b style="color:'+C.ink+';">有人陪你練、有人回你話</b>。</div></div>'
 +'<div style="padding:17px 22px 0;">'+btnDark("paid","進來練　NT$99／月　→","一杯飲料的錢。隨時開始，不用等開班——練起來的肌肉是你的。")
  +'<div style="margin-top:11px;text-align:center;font-size:13px;color:'+C.mut+';">信用卡 · 30 秒完成</div></div>'
 +'</div></div>';};

SC.paid=function(){
 return '<div class="body" style="padding:0 13px 20px;display:flex;flex-direction:column;justify-content:center;">'
 +'<div style="text-align:center;padding:30px 0 20px;">'+logo(64)+'</div>'
 +cw('<div style="text-align:center;">'
   +'<div style="font-size:22px;color:'+C.ink+';margin-bottom:11px;">歡迎加入</div>'
   +'<div style="font-size:13px;color:'+C.mid+';line-height:1.95;">你的溝通健檢結果已經放進來了。<br>接下來三個月，有人會陪你練。</div></div>'
   +'<div style="background:'+C.card+';border-radius:14px;padding:14px;margin-top:17px;">'
   +'<div style="font-size:13px;color:'+C.mut+';margin-bottom:11px;">接下來會發生的事</div>'
   +'<div style="display:flex;flex-direction:column;gap:11px;font-size:13px;color:'+C.ink+';line-height:1.75;">'
   +[["48 小時內","場邊教練會私訊你，陪你把溝通健檢看一遍"],
     ["看完健檢","從最弱的兩塊裡幫你挑一個開始，不是六個全給"],
     ["每天","這裡會有一件事等你，做完點兩下"],
     ["每個月","場邊教練覆盤一次——前三個月，每個月都跟"],
     ["每週日","回頭看這週，挑一次貼給夥伴看"]].map(function(x){
     return '<div style="display:flex;gap:11px;"><span style="color:'+C.act+';font-weight:700;flex-shrink:0;width:58px;font-size:13px;">'+x[0]+'</span><span>'+x[1]+'</span></div>';}).join("")
   +'</div></div>','18px')
 +'<div style="margin-top:12px;">'+btnDark("gym","開始")+'</div></div>';};

/* ══ 流程說明（畫面外） ══ */
var FLOW=[["quiz","健檢結果"],["gym","夥伴"],["today","練習"],["rec1","練溝通·對誰"],
          ["rec2","練溝通·反應"],["done","那 2 秒"],["me","進步"],["join","99 頁"],["paid","付款後"]];
var HINTS={
 quiz:"<b>第一次</b>做完測驗看到的。不給裸分數——用「已經練起來了／還沒開始長」講，因為 3.1 這種數字路人看不懂。只有一個出口：進去看看。",
 gym:"<b>打開的第一屏</b>。累計數字單調成長、動態不限今天、顧問也算進去——人少也不會是空的。動態流分兩層：有打字的是大卡片，<b>純點擊的只有一行</b>，所以沒人打字夥伴那頁照樣會動。",
 today:"一次只給<b>一件事</b>，不是課表。這一季只練一塊，其他的明說不用管——不露出內部框架，露了讀者會問「那我是不是漏看了什麼」。",
 rec1:"必填第一下：<b>對誰</b>。點一下就好，不用打字。",
 rec2:"必填第二下：<b>他有沒有反應</b>。點到「明顯有／超乎預期」才浮出打字框（想寫再寫）；點「沒特別」不扣分。",
 done:"<b>整個 app 最重要的兩秒</b>。決定他明天回不回來——所以這裡給的是「有長出東西」，不是「+1 分」。",
 me:"肌肉（練得怎麼樣）與次數（練了多少）<b>分開放</b>，沒量過的顯示「還沒量」不是 0。週日的橋只在會員模式出現。",
 join:"體驗客玩過之後才看到。急迫性用三條<b>真的</b>理由，不用假稀缺。",
 paid:"付完款自動開通，並且<b>先講清楚接下來會發生什麼</b>——避免付完之後不知道要幹嘛。"};

/* ══ 渲染與事件 ══ */
function render(){
 if(heroTimer){clearInterval(heroTimer);heroTimer=null;}
 el.innerHTML=(SC[S.sc]||SC.quiz)();
 heroBind();
 el.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-go"));};});
 el.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){var t=b.getAttribute("data-tab");
   if(t==="today" && S.sc!=="today") S.visits++;
   S.tab=t;S.sc=t;mark();render();};});
 el.querySelectorAll("[data-pick]").forEach(function(b){b.onclick=function(){S.pick=(S.pick||0)+1;render();};});
 el.querySelectorAll("[data-cheer]").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-cheer");S.cheered[k]=!S.cheered[k];render();};});
 el.querySelectorAll("[data-target]").forEach(function(b){b.onclick=function(){
   var v=b.getAttribute("data-target");
   S.target = v==="new" ? "新朋友" : TARGETS[+v][0];
   S.rel = v==="new" ? "" : TARGETS[+v][1];
   go("rec2");};});
 el.querySelectorAll("[data-react]").forEach(function(b){b.onclick=function(){
   var n=document.getElementById("note"); if(n) S.note=n.value;
   S.react=+b.getAttribute("data-react"); render();};});
 document.getElementById("mode").textContent = S.member ? "會員模式 · 已付 99" : "訪客模式 · 還沒付 99";
 document.getElementById("btnPay").textContent = S.member ? "切回訪客" : "切換成會員";
 document.getElementById("hint").innerHTML = HINTS[S.sc]||"";
 document.getElementById("crumb").innerHTML = FLOW.map(function(f){
  var cls = S.sc===f[0] ? "cb on" : (S.visited[f[0]] ? "cb done" : "cb");
  return '<button class="'+cls+'" data-jump="'+f[0]+'">'+f[1]+'</button>';}).join("");
 document.querySelectorAll("[data-jump]").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-jump"));};});
}
function mark(){ S.visited[S.sc]=true; }
function go(to){
 if(to==="done"){ var n=document.getElementById("note"); if(n) S.note=n.value; S.done++; }
 if(to==="paid"){ S.member=true; }
 if(to==="rec1"){ S.target=null; S.react=null; S.note=""; }
 if(to==="today" && S.sc!=="today") S.visits++;
 if(to==="gym"||to==="today"||to==="me") S.tab=to;
 S.sc=to; mark(); render();
 try{ el.scrollTop=0; var b=el.querySelector(".body"); if(b) b.scrollTop=0; }catch(e){}
}
var hintBtn=document.getElementById("btnHint"), stepbox=document.getElementById("stepbox");
if(window.matchMedia("(max-width:640px)").matches){ hintBtn.style.display="inline-block"; }
hintBtn.onclick=function(){ stepbox.classList.toggle("open");
  hintBtn.textContent = stepbox.classList.contains("open") ? "收起說明" : "這一屏在解決什麼？"; };
document.getElementById("btnReset").onclick=function(){reset();render();};
document.getElementById("btnPay").onclick=function(){S.member=!S.member;render();};
mark(); render();
})();
</script>
