<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif; background: #EFE6DE; }
    a { color: #AF5433; }
    a:hover { color: #8a3f26; }
  </style>
</helmet>

<div style="display:flex;flex-direction:column;width:390px;background:#EFE6DE;box-sizing:border-box;">

  <!-- 頁頭：與第一屏同一個頭 -->
  <div style="background:#E6DACF;padding:16px 16px 13px;display:flex;align-items:center;gap:11px;">
    <svg width="40" height="30" viewBox="-52 -30 104 72" aria-hidden="true"><g fill="none" stroke="#4A1B0C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-36 -22 L36 -22 Q48 -22 48 -10"></path><path d="M48 -10 L48 10 Q48 22 36 22"></path><path d="M36 22 L-6 22 L-16 36 L-22 22 L-36 22 Q-48 22 -48 10"></path><path d="M-48 10 L-48 -10 Q-48 -22 -36 -22"></path></g><circle cx="-21" cy="0" r="4.5" fill="#C6603A"></circle><circle cx="-7" cy="0" r="4.5" fill="#6E8B77"></circle><circle cx="7" cy="0" r="4.5" fill="#6E8CA8"></circle><circle cx="21" cy="0" r="4.5" fill="#C99A4E"></circle></svg>
    <div>
      <div style="font-size:17px;font-weight:700;color:#4A1B0C;letter-spacing:.04em;">影響力健檢</div>
      <div style="font-size:13px;color:#C6603A;margin-top:3px;letter-spacing:.02em;">影響力是肌肉，練了就有</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;padding:20px 16px 26px;">

    <div style="background:#F7F1EC;border-radius:20px;padding:18px 16px;">
      <!-- 進度 -->
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <div style="font-size:13px;font-weight:600;color:#6E4A3C;">第 4 題，共 16 題</div>
        <div style="font-size:13px;color:#8A7266;" aria-hidden="true">19%</div>
      </div>
      <div style="background:#F0E3DB;border-radius:4px;height:5px;margin-bottom:16px;">
        <div style="background:#C6603A;height:5px;border-radius:4px;width:19%;"></div>
      </div>

      <!-- 題目標籤＋題幹 -->
      <div style="display:inline-block;font-size:13px;font-weight:600;color:#AF5433;background:#F3D9CD;padding:4px 11px;border-radius:20px;margin-bottom:11px;">吸引肌肉｜讓他追問</div>
      <div style="font-size:17px;font-weight:600;color:#4A1B0C;line-height:1.8;margin-bottom:15px;">你講完自己在做什麼之後，他當場「哇」了一聲，主動追問「然後呢？」「你怎麼做到的？」——不是只點頭說「喔喔」。</div>

      <!-- 五個錨點選項（第 3 個為選中示意） -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
        <div style="background:#FFFFFF;border:1px solid #EFE6DE;border-radius:14px;padding:13px 14px;font-size:15px;color:#4A1B0C;line-height:1.6;">沒做到</div>
        <div style="background:#FFFFFF;border:1px solid #EFE6DE;border-radius:14px;padding:13px 14px;font-size:15px;color:#4A1B0C;line-height:1.6;">偶爾，而且生硬</div>
        <div style="background:#FDF4EF;border:1.5px solid #C6603A;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;color:#4A1B0C;line-height:1.6;display:flex;align-items:center;justify-content:space-between;gap:8px;">想到才做、時好時壞<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6603A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
        <div style="background:#FFFFFF;border:1px solid #EFE6DE;border-radius:14px;padding:13px 14px;font-size:15px;color:#4A1B0C;line-height:1.6;">多數情境做得到</div>
        <div style="background:#FFFFFF;border:1px solid #EFE6DE;border-radius:14px;padding:13px 14px;font-size:15px;color:#4A1B0C;line-height:1.6;">穩定到自動化</div>
      </div>

      <div style="background:#4A1B0C;color:#F7F1EC;border-radius:14px;padding:15px;text-align:center;font-size:17px;font-weight:600;">下一題</div>
    </div>

    <div style="font-size:13px;color:#8A7266;text-align:center;line-height:1.7;">想不出具體實例就選「沒做到」——那才測得準。</div>

  </div>
</div>
</x-dc>
</body>
</html>
