<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>部署驗證（暫時檔）</title>
<style>
body{font:15px/1.7 -apple-system,"PingFang TC",sans-serif;margin:0;padding:20px 16px 60px;background:#0c131e;color:#dfe7f0}
h1{font-size:19px;margin:0 0 4px}
.sub{font-size:13px;color:#8fa3ba;margin-bottom:20px}
.card{background:#141f2e;border:1px solid #223247;border-radius:12px;padding:14px;margin-bottom:14px}
.name{font-size:14px;font-weight:600;margin-bottom:8px}
.verdict{font-size:22px;font-weight:700;letter-spacing:.06em}
.pass{color:#4ade80}.fail{color:#f87171}.wait{color:#fbbf24}
.hint{font-size:13px;color:#8fa3ba;margin-top:6px}
pre{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;background:#08101a;color:#9db4cc;padding:9px;border-radius:7px;margin:8px 0 0;max-height:150px;overflow:auto}
.note{font-size:13px;color:#8fa3ba;border-top:1px solid #223247;padding-top:14px;margin-top:20px}
.note b{color:#fbbf24}
</style>
</head>
<body>
<h1>部署驗證</h1>
<div class="sub">確認 Apps Script 新版有沒有真的部署出去。這是暫時檔，驗完會刪。</div>
<div id="out"><div class="card"><div class="verdict wait">跑中…</div></div></div>
<div class="note">
  <b>驗完要做的清理</b>：T2 會在 <code>(漏斗)能力測驗</code> 寫一列
  <code>dev:s_selftest_0921</code>，在 <code>(系統)身份對照</code> 寫一列。
  兩列都可以直接刪掉，是這支測試自己製造的。
</div>
<script src="common.js"></script>
<script>
var out = document.getElementById("out");

function post(o) {
  return fetch(SHEET_API, { method: "POST", body: JSON.stringify(o),
                            headers: { "Content-Type": "text/plain;charset=utf-8" } })
    .then(function(r){ return r.text().then(function(t){ return { code: r.status, body: t }; }); })
    .catch(function(e){ return { code: "連不上", body: String(e) }; });
}

/* T1 零副作用：假身份應該被 isLineId_ 擋掉、回 skipped。
   舊版沒有 hello 這個 action，會回 unknown action——一眼就分得出有沒有部署。
   T2 會寫一列：沒 userId、沒 email，只有裝置碼，驗 dev: 退路鍵通不通。 */
var TESTS = [
  { name: "T1　新版有沒有部署出去",
    payload: { action: "hello", userId: "not-a-line-id", displayName: "deploy-check" },
    pass: function(b){ return b.indexOf('"skipped"') > -1; },
    passHint: "hello 端點活著，而且假身份有被擋下來（沒有寫進名單）",
    failHint: "回 unknown action ＝ 編輯器存檔了但沒部署成新版本。回去做「部署 → 管理部署 → 編輯 → 版本選新版本 → 部署」" },
  { name: "T2　沒 LINE、沒 Email 的人存不存得下來",
    payload: { action: "quiz", userId: "", email: "", name: "", displayName: "",
               scoreA: 40, scoreT: 50, scoreP: 60, scoreI: 30,
               rawAnswers: "3,3,3,3,3,3,3,3,3,3,3,3",
               mainAbility: "專業肌肉", subAbility: "信任肌肉", targetKeyMuscle: "推進肌肉",
               track: { sessionId: "s_selftest_0921", gaClientId: "", fbc: "", fbp: "",
                        utmSource: "", utmMedium: "", utmCampaign: "" } },
    pass: function(b){ return b.indexOf('"ok"') > -1 && b.indexOf("missing userId") < 0; },
    passHint: "已用 dev:s_selftest_0921 當鍵寫進去了，這批人不再被丟掉",
    failHint: "回 missing userId ＝ 跑的還是舊版後端" }
];

(async function(){
  var html = "";
  for (var i = 0; i < TESTS.length; i++) {
    var t = TESTS[i];
    out.innerHTML = html + '<div class="card"><div class="name">' + t.name
                  + '</div><div class="verdict wait">跑中…</div></div>';
    var r = await post(t.payload);
    var ok = typeof r.body === "string" && t.pass(r.body);
    html += '<div class="card"><div class="name">' + t.name + '</div>'
          + '<div class="verdict ' + (ok ? "pass" : "fail") + '">' + (ok ? "PASS" : "FAIL") + '</div>'
          + '<div class="hint">' + (ok ? t.passHint : t.failHint) + '</div>'
          + '<pre>HTTP ' + r.code + "\n" + String(r.body).slice(0, 300) + '</pre></div>';
    out.innerHTML = html;
  }
})();
</script>
</body>
</html>
