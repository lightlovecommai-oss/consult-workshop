<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>影響力健身房・member v5 demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap">
<style>
/* ═══ member 大改版 demo v5（2026-09-11 老師拍板：推翻可大動）═══
   ① 視覺＝24-VI §3.9 薄片語言（三態薄片／高度=量·顏色=身分／斜切共軸／I金紅線）
   ② 功能＝客戶反饋當主角：打卡問「他走到哪了」（ATPI 反饋階梯），不問「你做了沒」
   ③ 全貌感常駐：席位路徑條每個分頁都在（現在位置亮、灰格叫還沒解鎖、終點放骨層句）
   純前端假資料 demo，不接後端、不進正式路由；驗過才回寫 member.html。 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#F7F1EC;font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;color:#4A1B0C;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:#F7F1EC;padding-bottom:84px;}

/* 席位橫幅（member＝P 藍） */
.tb{background:linear-gradient(135deg,#54718D,#6E8CA8);padding:16px 20px 14px;color:#fff;}
.tb-k{display:flex;align-items:center;font-size:11px;letter-spacing:3px;font-weight:700;color:rgba(255,255,255,.85);}
.tb-d{margin-left:auto;font-size:12px;color:rgba(255,255,255,.75);letter-spacing:.5px;}
.tb-r{display:flex;align-items:center;gap:10px;margin-top:9px;}
.tb-n{font-size:19px;font-weight:900;}
.tb-s{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:5px;}
.hall{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:20px;margin-left:auto;}

.bd{padding:20px 20px 16px;}
.cd{background:#fff;border:1px solid #E8DDD3;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(90,60,30,.05);}
.hero{background:linear-gradient(160deg,#fff 0%,#FDF6EF 100%);border:1px solid #E8DDD3;border-radius:18px;padding:20px 18px 18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(90,60,30,.10);}
.sec{font-size:12px;font-weight:700;color:#8A7266;letter-spacing:2px;margin:0 0 12px;}
.sec b{color:#4A1B0C;font-size:13px;letter-spacing:1px;}
.kick{font-size:12px;font-weight:700;letter-spacing:2px;color:#8A7266;margin-bottom:8px;}
.big-t{font-size:22px;font-weight:900;line-height:1.5;}
.big-t em{font-style:normal;color:#C6603A;}
.sub-t{font-size:15px;color:#6E4A3C;margin-top:7px;line-height:1.85;}
.rule4{height:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);border-radius:2px;margin-top:16px;}

/* ═ 薄片原語（§3.9 九條的 CSS 落法）═
   共軸：一律 skewX(-12deg)、origin 釘在基線（底邊）→ 所有片同角同軸。
   三態：.now 實色＝現在/這一個；.past 淡填＝走過/既有；.todo 虛線＝還沒到。
   I 金紅線：實色態不鋪 #C99A4E，改淡底＋深版 #8E682B 描邊（.now.gold）。 */
.srow{display:flex;align-items:flex-end;gap:7px;border-bottom:2px solid rgba(74,27,12,.22);padding:6px 4px 0;}
.sl{flex:1;border-radius:6px 6px 0 0;transform:skewX(-12deg);transform-origin:50% 100%;position:relative;transition:height .4s cubic-bezier(.4,0,.2,1);}
.sl.todo{background:transparent!important;border:1.5px dashed #B4A695;border-bottom:0;}
.sl.now.gold{background:#F1E5CC!important;border:2px solid #8E682B;border-bottom:0;}
.slbl{display:flex;gap:7px;padding:7px 4px 0;}
.slbl span{flex:1;text-align:center;font-size:12px;font-weight:700;color:#4A1B0C;line-height:1.45;}
.slbl span i{display:block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:1px;}
.slbl span.dim{color:#B4A695;font-weight:600;}
.slv{display:flex;gap:7px;padding:0 4px;}
.slv span{flex:1;text-align:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}

/* 席位路徑條（全貌感常駐・§3.8 招8 的薄片實作）：整條路一次露出＋終點骨層句 */
.seatpath{background:#fff;border:1px solid #E8DDD3;border-radius:16px;padding:13px 14px 11px;margin-bottom:14px;box-shadow:0 2px 10px rgba(90,60,30,.05);}
.sp-row{display:flex;align-items:flex-end;gap:6px;border-bottom:2px solid rgba(74,27,12,.22);padding:2px 2px 0;}
.sp{border-radius:5px 5px 0 0;transform:skewX(-12deg);transform-origin:50% 100%;}
.sp.past{background:#DCE7DE;}
.sp.now{background:#6E8CA8;box-shadow:0 2px 8px rgba(110,140,168,.35);}
.sp.todo{border:1.5px dashed #B4A695;border-bottom:0;}
.sp-lbl{display:flex;gap:6px;padding:6px 2px 0;font-size:11.5px;font-weight:700;}
.sp-goal{flex:1.6;align-self:center;font-size:12px;color:#6E4A3C;line-height:1.6;padding:0 2px 4px 8px;}
.sp-goal b{color:#8E682B;}
.sp-here{font-size:10px;font-weight:800;letter-spacing:.5px;color:#54718D;white-space:nowrap;}

/* 主行動鈕（CTA 三層：練習鈕＝磚橘柔漸層） */
.gobtn{display:block;width:100%;background:linear-gradient(135deg,#C6603A 0%,#AF5433 100%);box-shadow:0 4px 12px rgba(198,96,58,.20);color:#fff;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:700;text-align:center;cursor:pointer;font-family:inherit;min-height:56px;margin-top:18px;}
.gobtn:active{transform:scale(.98);}
.gobtn.done{background:#DCE7DE;color:#3E5546;box-shadow:none;cursor:default;}
.howq{margin-top:14px;background:#FAF3EA;border-left:3px solid #C6603A;border-radius:0 12px 12px 0;padding:12px 14px;}
.howq-k{font-size:12px;color:#8A7266;margin-bottom:5px;}
.howq-t{font-size:15px;line-height:1.8;}

/* 口袋卡摺疊（正式版 DRILL 展開腳本搬入，視覺照本 demo 的卡語言） */
.drill-tg{width:100%;background:none;border:0;color:#AF5433;font-weight:700;font-size:13.5px;padding:12px 0 2px;cursor:pointer;font-family:inherit;min-height:44px;text-align:center;}
.drill{margin-top:8px;border-top:1px dashed #E8DDD3;}
.dr{padding:10px 2px 9px;border-bottom:1px dashed #F0E3DB;}
.dr:last-child{border-bottom:0;}
.dr-k{font-size:11.5px;color:#8A7266;font-weight:700;letter-spacing:1.5px;margin-bottom:3px;}
.dr-v{font-size:14px;line-height:1.85;}
.dr-v b{color:#AF5433;}

/* 週薄片列（正式版週圓環改成薄片語言：淡填=練過・實色=今天練了・虛線=還沒到） */
.wk{margin-top:16px;border-top:1px dashed #E8DDD3;padding-top:12px;}
.wk .slbl span{font-size:11px;}

/* 里程碑（正式版首亮徽章：慶祝的理由=他前進了） */
.mile{margin-top:14px;background:#FDF6EF;border:1.5px solid #E8C89A;border-radius:12px;padding:11px 13px;font-size:14.5px;font-weight:700;text-align:left;}
.mile span{display:block;font-size:12.5px;color:#8A7266;font-weight:400;margin-top:3px;}
.fwwrap{position:relative;width:64px;height:64px;margin:0 auto;}
.fw{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;animation:fly .9s ease-out both;}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.35);opacity:0;}}

/* 分享到館＋鼓勵（正式版 feed 互動搬入） */
.share-tg{display:block;width:100%;margin-top:12px;font-size:13.5px;padding:12px 16px;border-radius:14px;border:1.5px dashed #C9B4A4;background:none;color:#6E4A3C;cursor:pointer;font-family:inherit;min-height:44px;text-align:left;}
.share-tg.on{border:1.5px solid #5C7464;background:#DCE7DE;color:#3E5546;font-weight:600;}
.slim-ft{display:flex;align-items:center;margin-top:9px;}
.cheer{font-size:12.5px;padding:6px 13px;border-radius:16px;border:1px solid #E6DAD1;background:#fff;color:#6E4A3C;cursor:pointer;font-family:inherit;min-height:32px;}
.cheer.on{background:#F3D9CD;border-color:#C6603A;color:#AF5433;font-weight:700;}
.mine-tag{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:1px;color:#54718D;}

/* 開練流程 */
.rec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.rec-bk{background:none;border:0;color:#6E4A3C;font-size:22px;cursor:pointer;padding:0 4px 0 0;line-height:1;font-family:inherit;min-height:44px;}
.rec-n{font-size:15px;font-weight:700;}
.rec-m{font-size:13px;color:#6E4A3C;margin-top:2px;}
.q{font-size:15px;font-weight:700;margin:4px 0 11px;}
.qs{font-size:13px;color:#6E4A3C;font-weight:400;margin-left:6px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.op{font-size:13px;padding:11px 16px;border-radius:20px;border:1px solid #E6DAD1;background:#fff;color:#4A1B0C;cursor:pointer;font-family:inherit;min-height:44px;}
.op.on{background:#C6603A;border-color:#C6603A;color:#fff;font-weight:600;}
.op.warm{background:#F7F1EC;}
.brake{margin-top:12px;background:#DCE7DE;border-radius:12px;padding:10px 12px;font-size:13px;color:#3E5546;line-height:1.75;}
.ta{width:100%;background:#F7F1EC;border:1px solid #E6DAD1;border-radius:14px;padding:11px;font-size:17px;font-family:inherit;line-height:1.6;min-height:64px;resize:vertical;margin-top:9px;}
.ta:focus{outline:none;border-color:#C6603A;background:#fff;}
.sub{width:100%;background:#AF5433;color:#fff;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:15px;font-family:inherit;min-height:44px;}
.sub[disabled]{background:#D8C9BC;color:#F7F1EC;}
.skip{width:100%;margin-top:8px;background:none;border:0;color:#8A7266;font-size:13px;cursor:pointer;font-family:inherit;min-height:44px;}

/* 反應階梯（打卡第二步的主圖形）：點選哪片，那片實色、之前淡填、之後虛線 */
.ladder{margin-top:6px;}
.ladder .sl{cursor:pointer;}
.lad-note{font-size:12.5px;color:#8A7266;margin-top:10px;line-height:1.7;}

/* 完成頁 */
.ok{text-align:center;padding:10px 0 4px;}
.ok-t{font-size:26px;margin:14px 0 10px;line-height:1.4;font-weight:600;}
.ok-s{font-size:15px;color:#5A3A2A;line-height:1.95;}
.p3check{width:64px;height:64px;border-radius:50%;background:#C6603A;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;animation:cpop .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes cpop{0%{transform:scale(0);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.echo{background:#fff;border-left:3px solid #C6603A;border-radius:0 12px 12px 0;padding:11px 13px;margin-top:12px;font-size:14px;line-height:1.75;text-align:left;}
.echo span{display:block;font-size:12px;color:#8A7266;margin-top:4px;}
.bone{margin:16px 2px 2px;font-size:15px;line-height:1.85;text-align:center;animation:bfade 1s .4s both;cursor:pointer;}
@keyframes bfade{from{opacity:0;}to{opacity:1;}}
.tapback{text-align:center;font-size:12.5px;color:#B39C89;margin-top:8px;cursor:pointer;padding:10px;min-height:44px;}

/* 肌肉牆（進步頁主圖形）：4 大肌肉薄片、高度=分、顏色=身分 */
.wall-pot{border-bottom:1px dashed #E8DDD3;padding-bottom:12px;margin-bottom:14px;}
.pot-k{font-size:11.5px;font-weight:700;color:#8A7266;letter-spacing:2px;}
.pot-n{font-size:27px;font-weight:900;color:#8E682B;margin-top:1px;}
.pot-n span{font-size:13px;font-weight:700;color:#B39C89;margin-left:4px;}
.subrow{margin-top:14px;border-top:1px dashed #E8DDD3;padding-top:12px;}
.fbchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.fbc{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#F7F1EC;color:#6E4A3C;}
.fbc b{font-weight:800;}
.wall-note{font-size:12.5px;color:#8A7266;margin-top:10px;line-height:1.7;}

/* 反應總覽（進步頁第二卡）：這個月客戶都走到哪 */
.rx{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #F0E3DB;font-size:14px;}
.rx:first-of-type{border-top:0;}
.rx-av{width:30px;height:30px;border-radius:50%;background:#6E8CA8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.rx-n{font-weight:700;}
.rx-s{font-size:12px;color:#8A7266;}
.rx-st{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;color:#fff;flex-shrink:0;}

/* 夥伴頁 feed */
.slim{background:#fff;border:1px solid #F0E3DB;border-radius:14px;padding:11px 13px;margin-bottom:8px;}
.slim-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
.slim-b{font-size:14px;line-height:1.8;margin-top:6px;color:#5A3A2A;}
.stat{font-size:15px;line-height:1.8;}
.stat b{font-size:28px;font-weight:700;color:#C6603A;font-variant-numeric:tabular-nums;vertical-align:-3px;}

/* 升單卡（私教席）：軌跡預覽當主角＋錢鈕（磚橘→金漸層・一頁一顆） */
.upg{background:linear-gradient(135deg,#4A1B0C,#6B3018);border-radius:16px;padding:19px 18px;color:#F7F1EC;margin-bottom:14px;}
.upg-k{font-size:12px;letter-spacing:2px;color:#E8C89A;font-weight:700;}
.upg-t{font-size:17px;font-weight:900;margin-top:9px;line-height:1.65;}
.upg-s{font-size:13.5px;line-height:1.85;margin-top:10px;color:rgba(247,241,236,.92);}
.upg-demo{background:#FDF9F4;border-radius:12px;padding:12px 12px 10px;margin-top:13px;color:#4A1B0C;}
.upg-demo-k{font-size:10.5px;font-weight:800;letter-spacing:1.5px;color:#8A7266;margin-bottom:4px;}
.upg-coach{font-size:12.5px;color:#6E4A3C;margin-top:9px;line-height:1.75;border-top:1px dashed #E8DDD3;padding-top:8px;}
.upg-bone{margin-top:13px;font-size:14.5px;color:#F1E5CC;font-weight:600;line-height:1.7;}
.upg-money{display:block;text-align:center;margin-top:13px;background:linear-gradient(135deg,#C6603A,#C99A4E);color:#fff;border-radius:14px;padding:15px;font-size:15.5px;font-weight:800;text-decoration:none;box-shadow:0 4px 14px rgba(198,96,58,.35);}
.upg-b2{display:block;text-align:center;margin-top:8px;color:rgba(247,241,236,.72);font-size:13px;text-decoration:none;padding:9px;min-height:32px;}

/* 簡版膠囊 HUD（練習頁常駐）：大數字＋4 迷你薄片，點了去進步頁 */
.hudcap{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E8DDD3;border-radius:16px;padding:10px 14px 8px;margin-bottom:14px;box-shadow:0 2px 10px rgba(90,60,30,.05);cursor:pointer;}
.hud-n{font-size:21px;font-weight:900;color:#8E682B;white-space:nowrap;line-height:1.1;}
.hud-n span{font-size:10.5px;font-weight:700;color:#B39C89;display:block;letter-spacing:1px;}
.hud-sl{flex:1;}
.hud-sl .srow{gap:5px;}
.hud-go{font-size:18px;color:#B4A695;}

/* 里程碑時刻的私教軟連結（幽靈框・不是錢鈕） */
.soft-pro{margin-top:12px;font-size:13px;color:#8E682B;border:1.5px dashed #C99A4E;border-radius:12px;padding:11px 12px;text-align:center;cursor:pointer;line-height:1.7;}

/* 導覽（頁尾四色線＝品牌落款） */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;background:#fff;display:flex;padding:8px 0 max(11px,env(safe-area-inset-bottom));}
.nav::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#C6603A,#6E8B77,#6E8CA8,#C99A4E);}
.nv{flex:1;text-align:center;font-size:13px;color:#B4A695;background:none;border:0;cursor:pointer;padding:8px 0;font-family:inherit;min-height:44px;font-weight:600;}
.nv.on{color:#C6603A;font-weight:800;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="app">
  <div class="tb">
    <div class="tb-k"><span>ATPIFIT · MEMBER SEAT</span><div class="tb-d">DEMO</div></div>
    <div class="tb-r"><div class="tb-n">影響力健身房</div><span class="hall">會員席</span></div>
    <div class="tb-s">影響力是肌肉，練了就有</div>
  </div>
  <div class="bd" id="bd"></div>
  <div class="nav">
    <button class="nv" data-pane="gym">夥伴</button>
    <button class="nv" data-pane="today">練習</button>
    <button class="nv" data-pane="me">進步</button>
  </div>
</div>

<script src="atpi-core.js"></script>
<script src="judgement.js"></script>
<script>
/* ── 反饋階梯（2026-09-11 老師拍板「可以試試看」）：
   打卡記的不是「我做了」，是「他走到哪」——沒反應→被吸引(A)→信了(T)→服了(P)→行動了(I)。
   跟 pro 的客戶 CRM 同一把尺：member 每筆打卡都在替某個人的 ATPI 軌跡添一步。 */
var STAGES = [
  {k:"none", zh:"沒反應",  full:"他沒什麼反應",   c:"#B4A695", t:"#8A7266", tint:"#EFE6DB", h:30},
  {k:"A",    zh:"被吸引",  full:"他被吸引了",     c:"#C6603A", t:"#AF5433", tint:"#F3D9CD", h:52},
  {k:"T",    zh:"信了",    full:"他信了",         c:"#6E8B77", t:"#5C7464", tint:"#DCE7DE", h:74},
  {k:"P",    zh:"服了",    full:"他服了",         c:"#6E8CA8", t:"#54718D", tint:"#DDE6EE", h:96},
  {k:"I",    zh:"行動了",  full:"他行動了",       c:"#C99A4E", t:"#8E682B", tint:"#F1E5CC", h:118}
];
function stageIdx(k){ for (var i=0;i<STAGES.length;i++) if (STAGES[i].k===k) return i; return -1; }
var PALV = {A:{c:"#C6603A",t:"#AF5433",tint:"#F3D9CD"},T:{c:"#6E8B77",t:"#5C7464",tint:"#DCE7DE"},P:{c:"#6E8CA8",t:"#54718D",tint:"#DDE6EE"},I:{c:"#C99A4E",t:"#8E682B",tint:"#F1E5CC"}};
/* atpi-core.js 不含 DIMS（渲染輔助那段註明「依賴呼叫端定義」），demo 自備 */
var DIMS = {A:{name:"吸引肌肉"},T:{name:"信任肌肉"},P:{name:"專業肌肉"},I:{name:"推進肌肉"}};
var DIM_EN = {A:"ATTRACT",T:"TRUST",P:"PROFESSIONAL",I:"IMPACT"};
var REL = ["工作","客戶","家人","朋友"], SOFT_REL = ["家人","朋友"];

/* ── demo 假資料（新格式：reaction 欄＝階段 key）── */
function ago(i){ var d=new Date(Date.now()-i*86400000); return d.toISOString().slice(0,10); }
var LOG = [
  {muscle:"T1", target:"陳大哥", rel:"工作", stage:"T", date:ago(1), note:"「我早就感覺到了」"},
  {muscle:"T2", target:"陳大哥", rel:"工作", stage:"T", date:ago(2), note:""},
  {muscle:"P1", target:"陳大哥", rel:"工作", stage:"A", date:ago(3), note:""},

  {muscle:"A1", target:"妹妹",   rel:"家人", stage:"A", date:ago(4), note:""},

  {muscle:"A3", target:"妹妹",   rel:"家人", stage:"A", date:ago(6), note:""}
];
var EVAL = {A1:3,A2:2,A3:2,T1:4,T2:3,T3:5,P1:3,P2:1,P3:3,I1:2}; /* I2/I3 還沒解鎖 */

/* ── 薄片原語（CSS 版）：一排三態薄片 ──
   items: [{h, state:'now|past|todo', dimKey(顏色身分), vTop(上方數字), lbl, lbl2, onclick}] */
function slRow(items, opt){
  opt = opt || {};
  var vals = items.map(function(it){
    return '<span style="color:' + (it.state==="now" ? (PALV[it.dimKey]||{}).t || "#4A1B0C" : "#B4A695") + ';">' + (it.vTop||"") + '</span>';
  }).join("");
  var slices = items.map(function(it){
    var p = PALV[it.dimKey] || {c:"#B4A695",t:"#8A7266",tint:"#EFE6DB"};
    var cls = "sl " + it.state, sty = "height:" + it.h + "px;";
    if (it.state==="now") {
      if (it.dimKey==="I") cls += " gold"; /* I 金紅線：淡底＋深版描邊，不鋪實色 */
      else sty += "background:" + p.c + ";box-shadow:0 2px 8px " + p.c + "44;";
    } else if (it.state==="past") sty += "background:" + p.tint + ";";
    if (it.state==="todo" && it.hot) sty += "border-color:#C6603A;"; /* 今天還沒記：虛線亮行動色邀請點 */
    return '<div class="' + cls + '" style="' + sty + '"' + (it.onclick ? ' onclick="' + it.onclick + '"' : '') + '></div>';
  }).join("");
  var lbls = items.map(function(it){
    var p = PALV[it.dimKey] || {};
    if (it.hot) return '<span style="color:#AF5433;font-weight:800;">' + it.lbl + '</span>';
    return '<span class="' + (it.state==="todo" ? "dim" : "") + '">'
      + (it.lbl2 ? '<i style="color:' + (it.state==="todo" ? "#B4A695" : p.t||"#8A7266") + ';">' + it.lbl2 + '</i>' : '')
      + it.lbl + '</span>';
  }).join("");
  return (opt.vals ? '<div class="slv">' + vals + '</div>' : '')
    + '<div class="srow">' + slices + '</div>'
    + (opt.noLbl ? '' : '<div class="slbl">' + lbls + '</div>');
}

/* ── 全貌感席位路徑（每個分頁常駐）：走過淡填・現在實色・還沒虛線＋終點骨層句 ── */
function seatPathHTML(){
  return '<div class="seatpath">'
    + '<div class="sp-row">'
    + '<div class="sp past" style="flex:1;height:26px;"></div>'
    + '<div class="sp now"  style="flex:1;height:44px;"></div>'
    + '<div class="sp todo" style="flex:1;height:62px;"></div>'
    + '<div class="sp-goal">終點不是成交——<br><b>有人因為你變好。</b></div>'
    + '</div>'
    + '<div class="sp-lbl">'
    + '<span style="flex:1;text-align:center;color:#5C7464;">體驗席</span>'
    + '<span style="flex:1;text-align:center;color:#54718D;">會員席<div class="sp-here">YOU’RE HERE</div></span>'
    + '<span style="flex:1;text-align:center;color:#B4A695;">私教席<div class="sp-here" style="color:#B4A695;">還沒解鎖</div></span>'
    + '<span style="flex:1.6;"></span>'
    + '</div></div>';
}

/* ── 某個人的 ATPI 軌跡（打卡完成頁主圖形；pro CRM 的同一支原語）──
   位置＝這個人歷史紀錄走到的最高階；今天那步實色，之前淡填、之後虛線。 */
function personPathHTML(name, todayStage){
  var hi = 0;
  LOG.forEach(function(e){ if (e.target===name) hi = Math.max(hi, stageIdx(e.stage)); });
  hi = Math.max(hi, stageIdx(todayStage));
  var items = STAGES.slice(1).map(function(s){
    var i = stageIdx(s.k);
    var state = s.k===todayStage ? "now" : (i < stageIdx(todayStage) || i <= hi && i < stageIdx(todayStage) ? "past" : (i <= hi ? "past" : "todo"));
    if (todayStage==="none") state = i<=hi && hi>0 ? "past" : "todo";
    return {h:s.h-16, state:state, dimKey:s.k, lbl:s.zh, lbl2:s.k};
  });
  return '<div style="background:#fff;border-radius:16px;padding:14px 14px 12px;margin-top:16px;box-shadow:0 8px 30px rgba(74,27,12,.08);text-align:left;">'
    + '<div class="sec">CLIENT PATH · <b>' + name + ' 走到哪了</b></div>'
    + slRow(items) + '</div>';
}

/* ═══ 練習頁 ═══ */
var OPEN_DRILL = false;
function toggleDrill(){ OPEN_DRILL = !OPEN_DRILL; render(); }
function md_(s){ return String(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>"); }
function drillHTML(d){
  function row(k, v){ return '<div class="dr"><div class="dr-k">' + k + '</div><div class="dr-v">' + md_(v) + '</div></div>'; }
  return '<div class="drill">'
    + row("練什麼", d.h) + row("找誰", d.who)
    + row("怎麼開口", d.lead + '<br>「' + md_(d.line) + '」')
    + row("重點", d.key)
    + row("🌱 怎麼算成了", d.win)
    + row("🌾 沒成怎麼辦", d.retry) + '</div>';
}
/* 週薄片列（週圓環的薄片版）：淡填＝練過・實色＝今天記了・虛線＝還沒到 */
function weekStripHTML(){
  var days = ["一","二","三","四","五","六","日"];
  var dow = (new Date().getDay() + 6) % 7;
  var dset = {}; LOG.forEach(function(e){ dset[e.date] = 1; });
  var dim = MUSCLES[FOCUS].dim;
  var items = days.map(function(d, i){
    var off = dow - i;
    var done = off >= 0 && !!dset[ago(off)];
    var state = i === dow ? (done ? "now" : "todo") : (done ? "past" : "todo");
    return {h: done ? 26 : 17, state: state, dimKey: dim, lbl: i === dow ? "今天" : d,
            hot: i === dow && !done, onclick: i === dow && !done ? "openRec()" : null};
  });
  return '<div class="wk">' + slRow(items) + '</div>';
}
function goPane(p){ REC = null; PANE = p; window.scrollTo(0,0); render(); }
/* 簡版膠囊 HUD：同一支 slRow，縮到只剩高度和顏色 */
function hudHTML(){
  var focusDim = MUSCLES[FOCUS].dim;
  var items = DORD.map(function(k){
    var v = dimScore(k);
    return {h: v==null ? 10 : Math.round(8 + (v-1)/4*20), state: v==null ? "todo" : (k===focusDim ? "now" : "past"), dimKey:k};
  });
  return '<div class="hudcap" onclick="goPane(\'me\')">'
    + '<div class="hud-n">205<span>已解鎖 / 1000</span></div>'
    + '<div class="hud-sl">' + slRow(items, {noLbl:true}) + '</div>'
    + '<div class="hud-go">›</div></div>';
}
function todayHTML(){
  var m = MUSCLES[FOCUS], d = DRILL[FOCUS];
  var h = seatPathHTML() + hudHTML();
  h += '<div class="hero"><div class="kick" style="color:#5C7464;">TODAY · 今天練一塊</div>'
    + '<div class="big-t">' + m.name + '——<em>' + m.tech.split("・")[0] + '</em></div>'
    + '<div class="sub-t">' + DIM_RESULT[m.dim] + '。練完不是打勾——是記下<b>他走到哪了</b>。</div>'
    + '<div class="howq"><div class="howq-k">開口就用這句</div><div class="howq-t">「' + md_(d.line) + '」</div></div>'
    + '<button class="drill-tg" onclick="toggleDrill()">怎麼練・完整詳解 ' + (OPEN_DRILL ? "▴" : "▾") + '</button>'
    + (OPEN_DRILL ? drillHTML(d) : '')
    + (DONE_TODAY
        ? '<button class="gobtn done">今天記好了 ✓</button>'
        : '<button class="gobtn" onclick="openRec()">練完了，記下他的反應</button>')
    + weekStripHTML()
    + '<div class="rule4"></div></div>';
  return h;
}

/* ═══ 開練流程（反饋當主角）═══ */
function openRec(){ REC = {who:null, rel:null, stage:null, note:"", share:false, step:1}; window.scrollTo(0,0); render(); }
function closeRec(){ REC = null; render(); }
function recHTML(){
  var m = MUSCLES[FOCUS];
  var h = '<div class="cd"><div class="rec-hd"><button class="rec-bk" onclick="closeRec()">‹</button>'
    + '<div><div class="rec-n">' + m.name + '</div><div class="rec-m">' + DIM_RESULT[m.dim] + '</div></div></div>';

  if (REC.step === 1) {
    var seen = {};
    var chips = [];
    LOG.forEach(function(e){ if (e.target && !seen[e.target]) { seen[e.target]=1; chips.push({n:e.target, r:e.rel}); } });
    h += '<div class="q">對誰？<span class="qs">點一下就好</span></div><div class="opts">'
      + chips.map(function(p){ return '<button class="op' + (REC.who===p.n?" on":"") + '" onclick="pickWho(\'' + p.n + '\',\'' + p.r + '\')">' + p.n + '</button>'; }).join("")
      + '<button class="op warm" onclick="pickWho(\'陌生人\',\'陌生人\')">陌生人</button></div>';
  } else if (REC.step === 2) {
    var soft = SOFT_REL.indexOf(REC.rel) > -1;
    h += '<div class="q">' + REC.who + ' 走到哪了？<span class="qs">點一片</span></div>'
      + '<div class="ladder">' + slRow(STAGES.map(function(s, i){
          if (soft && (s.k==="P" || s.k==="I")) return null;
          var sel = stageIdx(REC.stage);
          var state = REC.stage==null ? "todo" : (s.k===REC.stage ? "now" : (i < sel ? "past" : "todo"));
          return {h:s.h, state:state, dimKey:s.k==="none" ? null : s.k, lbl:s.zh, lbl2:s.k==="none" ? "" : s.k, onclick:"pickStage('" + s.k + "')"};
        }).filter(Boolean)) + '</div>'
      + (soft ? '<div class="brake">家人朋友走到「信了」就夠——<br>這裡我們刻意踩煞車，不往成交推。</div>' : '')
      + (REC.stage!=null
          ? '<div class="q" style="margin-top:16px;">發生什麼？<span class="qs">寫一句就好</span></div>'
            + '<textarea class="ta" id="recnote" placeholder="' + (stageIdx(REC.stage)>=2 ? "他放下手機看著我：「你怎麼突然這麼會講話？」" : "我問了他週末去哪，他只嗯了一聲") + '"></textarea>'
          : '')
      + (REC.stage!=null && REC.stage!=="none"
          ? '<button class="share-tg' + (REC.share?" on":"") + '" onclick="toggleShare()">' + (REC.share?"✓ 會放到館裡":"也放到館裡") + '——讓夥伴看見這一步</button>'
          : '')
      + '<button class="sub" ' + (REC.stage==null?"disabled":"") + ' onclick="recDone()">' + (REC.stage==null?"先點一片":"記下來") + '</button>'
      + (REC.stage!=null ? '<button class="skip" onclick="recDone()">跳過文字，直接記 →</button>' : '');
  } else {
    var st = STAGES[stageIdx(REC.stage)];
    h += '<div class="ok">'
      + (REC.mile ? '<div class="fwwrap"><div class="p3check">✓</div>' + fwHTML() + '</div>' : '<div class="p3check">✓</div>')
      + '<div class="ok-t">每天進步一點點。</div>'
      + '<div class="ok-s">' + (REC.stage==="none"
          ? '沒反應不代表白講——這一筆也是他軌跡的一部分。'
          : '你練的是「' + m.name + '」，<br>他給你的回答是——<b style="color:' + st.t + ';">' + st.full + '</b>。') + '</div></div>'
      + (REC.mile ? '<div class="mile">🎉 ' + REC.who + ' 第一次走到「' + st.zh + '」<span>這一步是他的里程碑，也是你的。</span></div>' : '')
      + (REC.note ? '<div class="echo">你記下的：「' + REC.note + '」<span>文字留得住感覺，分數留不住。</span></div>' : '')
      + personPathHTML(REC.who, REC.stage)
      + (REC.mile && (REC.stage==="P" || REC.stage==="I")
          ? '<div class="soft-pro" onclick="goPane(\'me\')">這種時刻，私教席的教練會陪你看下一步推哪 →</div>'
          : '')
      + '<div class="bone" onclick="closeRec()">影響力的盡頭不是成交，是有人因為你變好。</div>'
      + '<div class="tapback" onclick="closeRec()">點一下，回到練習 ›</div>';
  }
  return h + '</div>';
}
function pickWho(n, r){ REC.who=n; REC.rel=r; REC.step=2; render(); }
function pickStage(k){
  var ta = document.getElementById("recnote");
  if (ta) REC.note = ta.value;
  REC.stage = k; render();
  var t = document.getElementById("recnote"); if (t && REC.note) t.value = REC.note;
}
function toggleShare(){
  var ta = document.getElementById("recnote");
  if (ta) REC.note = ta.value;
  REC.share = !REC.share; render();
  var t = document.getElementById("recnote"); if (t && REC.note) t.value = REC.note;
}
function fwHTML(){
  var cols = ["#C6603A","#6E8B77","#6E8CA8","#C99A4E"], out = "";
  for (var i=0;i<12;i++){
    var a = Math.PI*2*i/12, r = 44 + (i%2)*16;
    out += '<span class="fw" style="background:' + cols[i%4] + ';--dx:' + Math.round(Math.cos(a)*r) + 'px;--dy:' + Math.round(Math.sin(a)*r) + 'px;animation-delay:' + (0.15 + (i%3)*0.08) + 's;"></span>';
  }
  return out;
}
function recDone(){
  var ta = document.getElementById("recnote");
  if (ta) REC.note = ta.value.trim();
  /* 里程碑＝這個人第一次走到新的一階（慶祝的理由是他前進了，不是你打卡了） */
  var prevHi = 0;
  LOG.forEach(function(e){ if (e.target===REC.who) prevHi = Math.max(prevHi, stageIdx(e.stage)); });
  REC.mile = REC.stage!=="none" && stageIdx(REC.stage) > prevHi;
  LOG.unshift({muscle:FOCUS, target:REC.who, rel:REC.rel, stage:REC.stage, date:ago(0), note:REC.note});
  if (REC.share && REC.stage!=="none")
    FEED.unshift({n:"你", stage:REC.stage, t: REC.note || ('練「' + MUSCLES[FOCUS].name + '」——' + STAGES[stageIdx(REC.stage)].full), cheer:0, mine:true});
  DONE_TODAY = true; REC.step = 3; window.scrollTo(0,0); render();
}

/* ═══ 進步頁 ═══ */
var OPEN_DIM = null;
function toggleDim(k){ OPEN_DIM = OPEN_DIM===k ? null : k; render(); }
function dimScore(k){
  var ks = MORD.filter(function(mk){ return MUSCLES[mk].dim===k; });
  var vs = ks.map(function(mk){ return EVAL[mk]; }).filter(function(v){ return v!=null; });
  if (!vs.length) return null;
  return vs.reduce(function(a,b){return a+b;},0) / vs.length;
}
function fbCount(dimOrMk){
  var n = {};
  LOG.forEach(function(e){
    var hit = e.muscle===dimOrMk || (MUSCLES[e.muscle]||{}).dim===dimOrMk;
    if (hit && e.stage && e.stage!=="none") n[e.stage] = (n[e.stage]||0) + 1;
  });
  return n;
}
function fbChips(dimOrMk){
  var n = fbCount(dimOrMk), out = "";
  STAGES.slice(1).forEach(function(s){
    if (n[s.k]) out += '<span class="fbc" style="color:' + s.t + ';background:' + s.tint + ';">' + s.full + ' <b>×' + n[s.k] + '</b></span>';
  });
  return out || '<span class="fbc">還沒有人給過反應——今天就去試一次</span>';
}

var WALL_FULL = false;
function toggleWall(){ WALL_FULL = !WALL_FULL; OPEN_DIM = null; render(); }
function dimDetailHTML(k){
  var ks = MORD.filter(function(mk){ return MUSCLES[mk].dim===k; });
  return '<div class="subrow"><div class="sec" style="margin-bottom:8px;"><span style="color:' + PALV[k].t + ';">' + DIM_EN[k] + '</span> · <b>' + DIMS[k].name + '・3 小塊</b></div>'

function rxListHTML(){
  var seen = {}, ppl = [];
  LOG.forEach(function(e){
    if (!e.target || seen[e.target]) return; seen[e.target]=1;
    var hi = 0; LOG.forEach(function(x){ if (x.target===e.target) hi = Math.max(hi, stageIdx(x.stage)); });
    ppl.push({n:e.target, rel:e.rel, hi:hi});
  });
  return ppl.map(function(p){
    var s = STAGES[p.hi];
    var soft = SOFT_REL.indexOf(p.rel) > -1;
    return '<div class="rx"><div class="rx-av">' + p.n.charAt(0) + '</div>'
      + '<div><div class="rx-n">' + p.n + '</div><div class="rx-s">' + p.rel + (soft ? '・到「信了」就夠' : '') + '</div></div>'
      + '<span class="rx-st" style="background:' + (p.hi===0 ? "#B4A695" : s.c) + ';' + (p.hi===4 ? 'background:#F1E5CC;color:#8E682B;border:1.5px solid #8E682B;' : '') + '">' + (p.hi===0 ? "還沒反應" : s.full) + '</span></div>';
  }).join("");
}

  {n:"N",  stage:"T", t:"發現他一直要明牌，其實是怕自己判斷錯", cheer:3},
  {n:"M",  stage:"T", t:"第一次在別人面前講出內心真實的想法", cheer:2},
  {n:"佳", stage:"none", t:"演練卡住——太尊重對方的自主，反而不容易多說什麼", cheer:6}
];
var CHEERED = {};
function cheer(i){ if (CHEERED[i]) return; CHEERED[i] = 1; FEED[i].cheer++; render(); }
function gymHTML(){
  var h = seatPathHTML();
  h += '<div class="hero"><div class="kick" style="color:#5C7464;">GYM · 全館這個月</div>'
    + '<div class="stat">大家一起記下了 <b>412</b> 次客戶反應</div>'
    + '<div class="sub-t">最多人練到的一步：<b style="color:#5C7464;">他信了</b></div><div class="rule4"></div></div>';
  h += '<div class="sec" style="margin:18px 4px 10px;">FEED · <b>夥伴的這一步</b></div>';
  h += FEED.map(function(f, i){
    var s = STAGES[stageIdx(f.stage)];
    return '<div class="slim"><div class="slim-top"><span>' + f.n + '</span>'
      + '<span class="rx-st" style="margin-left:auto;background:' + (f.stage==="none" ? "#B4A695" : f.stage==="I" ? "#F1E5CC" : s.c) + ';' + (f.stage==="I" ? "color:#8E682B;border:1.5px solid #8E682B;" : "") + '">' + (f.stage==="none" ? "還在練" : "對方" + s.zh) + '</span></div>'
      + '<div class="slim-b">' + f.t + '</div>'
      + '<div class="slim-ft"><button class="cheer' + (CHEERED[i] ? " on" : "") + '" onclick="cheer(' + i + ')">💪 鼓勵' + (f.cheer ? ' ×' + f.cheer : '') + '</button>'
      + (f.mine ? '<span class="mine-tag">你的這一步</span>' : '') + '</div></div>';
  }).join("");
  return h;
}

/* ═══ render ═══ */
function render(){
  var h = REC ? recHTML() : (PANE==="today" ? todayHTML() : PANE==="me" ? meHTML() : gymHTML());
  document.getElementById("bd").innerHTML = h;
  document.querySelectorAll(".nv").forEach(function(b){
    b.className = "nv" + (b.getAttribute("data-pane")===PANE ? " on" : "");
    b.onclick = function(){ REC = null; PANE = b.getAttribute("data-pane"); window.scrollTo(0,0); render(); };
  });
}
/* demo 專用：?rec=2&who=妹妹&rel=家人&stage=T 直接跳進打卡某一步（截圖驗收用） */
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get("rec")) REC = {who:q.get("who")||"陳大哥", rel:q.get("rel")||"工作", stage:q.get("stage"), note:q.get("note")||"", share:false, mile:q.get("mile")==="1", step:+q.get("rec")};
  if (q.get("dim")) OPEN_DIM = q.get("dim");
  if (q.get("drill")) OPEN_DRILL = true;
  if (q.get("wall")) WALL_FULL = true;
})();
render();
</script>
